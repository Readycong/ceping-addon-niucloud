你？","options":[{"key":"A","text":"上就上，气势先拉满","score":{"cat":"white_tiger","points":1}},{"key":"B","text":"讲点大家爱听的，先把场子热起来","score":{"cat":"vermilion","points":1}},{"key":"C","text":"提前把稿子过三遍，稳稳讲完","score":{"cat":"black_tortoise","points":1}},{"key":"D","text":"内容和排版都打磨到满意，才肯上台","score":{"cat":"qilin","points":1}}]},{"no":9,"stem":"遇到一件明显不公平的事，你？","options":[{"key":"A","text":"当场就提出来，不能装没看见","score":{"cat":"white_tiger","points":1}},{"key":"B","text":"先判断值不值得为它消耗，再做打算","score":{"cat":"azure_dragon","points":1}},{"key":"C","text":"记下来，按流程一步步反映","score":{"cat":"black_tortoise","points":1}},{"key":"D","text":"好奇规则是怎么被钻空的，研究一下","score":{"cat":"baize","points":1}}]},{"no":10,"stem":"挑一件礼物送重要的人，你？","options":[{"key":"A","text":"看中了当场拿下，纠结最费时间","score":{"cat":"white_tiger","points":1}},{"key":"B","text":"先想清楚对方真正缺的是什么","score":{"cat":"azure_dragon","points":1}},{"key":"C","text":"选实用耐用的，别整虚的","score":{"cat":"black_tortoise","points":1}},{"key":"D","text":"要有质感，包装也不能马虎","score":{"cat":"qilin","points":1}}]},{"no":11,"stem":"换到一个全新环境（新城市、新公司），你？","options":[{"key":"A","text":"主动出击，先把关键的人认识一遍","score":{"cat":"white_tiger","points":1}},{"key":"B","text":"先摸清这里的规则和利益结构","score":{"cat":"azure_dragon","points":1}},{"key":"C","text":"先跟人熟起来，有人就踏实","score":{"cat":"vermilion","points":1}},{"key":"D","text":"到处逛、到处问，什么都新鲜","score":{"cat":"baize","points":1}}]},{"no":12,"stem":"回头看这一年，你最想给自己加的一个字是？","options":[{"key":"A","text":"敢","score":{"cat":"white_tiger","points":1}},{"key":"B","text":"远","score":{"cat":"azure_dragon","points":1}},{"key":"C","text":"暖","score":{"cat":"vermilion","points":1}},{"key":"D","text":"精","score":{"cat":"qilin","points":1}}]}],"results":[{"key":"white_tiger","categoryKey":"white_tiger","name":"白虎","summary":"开山辟路的那位，遇事正面迎上去。","detail":"白虎守的是一股锐气。你不喜欢拖泥带水，别人还在权衡利弊时你已经迈出第一步。你的存在本身就是队伍的定心丸，因为大家都知道关键时刻你会顶上去。这股冲劲很能破局，但也容易在不需要硬碰的地方消耗自己。真正厉害的锐气，是知道什么时候该出拳，什么时候该收力。","traits":["果敢","行动力强","护短"],"growthTip":"冲锋之前先花三秒判断对手，省下的力气能多打三场。","shareCard":"我的幸运守护兽：白虎，遇事先赢一波气势。你呢？","adSlot":"result_page"},{"key":"azure_dragon","categoryKey":"azure_dragon","name":"青龙","summary":"抬头看天的人，擅长在乱局里找方向。","detail":"青龙守的是视野。你习惯先站高一点看全局，再决定从哪儿下手。你讨厌被束缚，喜欢保留转圜空间，也因此比别人更容易找到别人看不见的路径。你给朋友的建议常常一针见血，因为你看到的是结构而不是细节。要留意的是：看得太远有时会忘了脚下的第一步，方向定了就该落地。","traits":["格局大","善于判断","不爱受限"],"growthTip":"想清楚之后给自己设一个启动日，别让完美方案停在草稿里。","shareCard":"我的幸运守护兽：青龙，先看全局再落子。你呢？","adSlot":"share_card"},{"key":"vermilion","categoryKey":"vermilion","name":"朱雀","summary":"自带光和热的那个，走到哪儿哪儿亮。","detail":"朱雀守的是人气。你天生有把场子烧热的能力，冷场在你面前活不过三分钟。你重视连接，也确实擅长让人感到被看见。你的热情很真诚，不是表演，所以别人愿意靠近你。只是火焰也要有燃料：别把所有能量都用来温暖别人，留一些给自己，你的光才能烧得久。","traits":["感染力","热情","连接力强"],"growthTip":"热闹之外留一段安静时间，独处能让你的热度更持久。","shareCard":"我的幸运守护兽：朱雀，冷场在我这儿活不过三分钟。你呢？","adSlot":"info_feed"},{"key":"black_tortoise","categoryKey":"black_tortoise","name":"玄武","summary":"稳如老城墙，交给你就没人再操心。","detail":"玄武守的是底盘。你不一定最亮眼，但一定最让人放心。你做事讲节奏、讲底线，不轻易承诺，承诺了就一定做到。别人慌的时候你反而更稳，这份定力在关键时刻价值连城。你需要注意的不是能力，而是弹性：偶尔给自己一次不按计划的尝试，世界不会因此塌掉。","traits":["靠谱","情绪稳定","耐力足"],"growthTip":"允许计划里留一格「随便发生点什么」，生活会更有意思。","shareCard":"我的幸运守护兽：玄武，交给我你就不用再操心。你呢？","adSlot":"result_page"},{"key":"qilin","categoryKey":"qilin","name":"麒麟","summary":"讲究质感的那位，出手就要有分量。","detail":"麒麟守的是格调。你对粗糙的东西容忍度很低，宁可慢一点也不肯将就。你做出来的东西往往自带完成度，别人一看就知道用了心。你重视仪式感，也愿意为喜欢的事多花力气。要提醒的是：追求完美有时会拖慢开始，先做出一版六十分，再把它打磨到九十分，往往比憋一个大招更有效。","traits":["有品位","追求质感","慢工出细活"],"growthTip":"给每件事设一个「可以交卷」的标准，别让打磨无限延长。","shareCard":"我的幸运守护兽：麒麟，宁可慢一点也不将就。你呢？","adSlot":"share_card"},{"key":"baize","categoryKey":"baize","name":"白泽","summary":"什么都知道一点的百科全书型选手。","detail":"白泽守的是见识。你对世界保持着旺盛的好奇心，冷知识、奇闻、偏门技能都能信手拈来。你不一定追求成为焦点，但只要话题打开，你总能让对话变得有意思。你的广度是优势，也让你更容易在不同圈子间穿梭。唯一的小建议是：把分散的兴趣收拢到一两个方向深耕，见识会变成真正的实力。","traits":["好奇心强","涉猎广","脑洞清奇"],"growthTip":"在感兴趣的领域里挑一个深挖，把知道变成做到。","shareCard":"我的幸运守护兽：白泽，冷知识储备常年满仓。你呢？","adSlot":"info_feed"}]},"36":{"id":36,"title":"你的时间人格是什么","shortName":"时间人格","category":"生活/自我","tags":["时间管理","拖延","作息","效率","chronotype"],"copyrightStatus":"theory","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性趣味分类，参考时间管理风格与作息时型的日常概念，不代表任何心理评估或医学诊断。","minorProtected":false},"source":{"theory":"参考时间管理风格与 chronotype（个体作息时型差异）的公开概念，用于描述日常时间安排偏好。","sourceType":"theory","reference":"本测题为原创自编，仅借鉴公开概念，不采用任何量表原文。"},"description":"从闹钟、待办清单、周末作息到截止日前的那三天，看看你和时间到底是什么关系。有人把时间切成块，有人和时间谈恋爱，也有人一直跟它躲猫猫。","instructions":"共 10 题，按最近三个月的真实状态作答，别按理想中的自己选。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"planner","name":"规划控"},{"key":"goflow","name":"随性派"},{"key":"procrastinator","name":"拖延共生体"},{"key":"multitasker","name":"多线程选手"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"你的待办清单长什么样？","options":[{"key":"A","text":"分层分类，还有截止时间","score":{"cat":"planner","points":1}},{"key":"B","text":"记在脑子里，想起就做","score":{"cat":"goflow","points":1}},{"key":"C","text":"写在便签上，越积越厚","score":{"cat":"procrastinator","points":1}},{"key":"D","text":"三个工具同时记，同步很重要","score":{"cat":"multitasker","points":1}}]},{"no":2,"stem":"周一早上，你通常怎么开始？","options":[{"key":"A","text":"先看本周排期，把重点标出来","score":{"cat":"planner","points":1}},{"key":"B","text":"看心情，从最容易的那件开始","score":{"cat":"goflow","points":1}},{"key":"C","text":"先处理上周五留下的尾巴","score":{"cat":"procrastinator","points":1}},{"key":"D","text":"边开晨会边回消息，顺手排好今天","score":{"cat":"multitasker","points":1}}]},{"no":3,"stem":"一个任务还有三天到期，你现在的状态是？","options":[{"key":"A","text":"已经过半，剩下两天很从容","score":{"cat":"planner","points":1}},{"key":"B","text":"还没开始，但完全不慌","score":{"cat":"goflow","points":1}},{"key":"C","text":"还没开始，而且有点慌","score":{"cat":"procrastinator","points":1}},{"key":"D","text":"同时在处理三件事，这个排在第二","score":{"cat":"multitasker","points":1}}]},{"no":4,"stem":"截止日前一晚，你通常？","options":[{"key":"A","text":"正常睡觉，早就做完了","score":{"cat":"planner","points":1}},{"key":"B","text":"才开始，但效率惊人","score":{"cat":"procrastinator","points":1}},{"key":"C","text":"边听歌边做，顺便回几条消息","score":{"cat":"multitasker","points":1}},{"key":"D","text":"做多少算多少，明天再说","score":{"cat":"goflow","points":1}}]},{"no":5,"stem":"你的手机闹钟设置是？","options":[{"key":"A","text":"一个就够，作息很固定","score":{"cat":"planner","points":1}},{"key":"B","text":"五六个，每隔五分钟响一次","score":{"cat":"procrastinator","points":1}},{"key":"C","text":"看明天有没有事，临时设","score":{"cat":"goflow","points":1}},{"key":"D","text":"不同地点不同提醒，靠系统帮我记","score":{"cat":"multitasker","points":1}}]},{"no":6,"stem":"你的高效时段一般在？","options":[{"key":"A","text":"上午，越早越好","score":{"cat":"planner","points":1}},{"key":"B","text":"深夜，世界终于安静了","score":{"cat":"procrastinator","points":1}},{"key":"C","text":"不确定，状态来了就行","score":{"cat":"goflow","points":1}},{"key":"D","text":"碎片时间都能用，随时切换","score":{"cat":"multitasker","points":1}}]},{"no":7,"stem":"计划突然被打乱，你的反应？","options":[{"key":"A","text":"立刻重排一遍，把损失降到最小","score":{"cat":"planner","points":1}},{"key":"B","text":"无所谓，本来也没定死","score":{"cat":"goflow","points":1}},{"key":"C","text":"有点烦，但先拖一会儿再说","score":{"cat":"procrastinator","points":1}},{"key":"D","text":"正好，把另一条线上的事提前","score":{"cat":"multitasker","points":1}}]},{"no":8,"stem":"周末你的时间基本？","options":[{"key":"A","text":"提前约好，行程表已排满","score":{"cat":"planner","points":1}},{"key":"B","text":"醒来再说，走到哪儿算哪儿","score":{"cat":"goflow","points":1}},{"key":"C","text":"一半在补上周没做完的事","score":{"cat":"procrastinator","points":1}},{"key":"D","text":"同时开着好几个兴趣项目","score":{"cat":"multitasker","points":1}}]},{"no":9,"stem":"你最常用的效率工具是？","options":[{"key":"A","text":"日历和甘特图，视觉化很关键","score":{"cat":"planner","points":1}},{"key":"B","text":"番茄钟加待办 App，双开","score":{"cat":"multitasker","points":1}},{"key":"C","text":"备忘录，写完基本不看","score":{"cat":"procrastinator","points":1}},{"key":"D","text":"不用工具，靠感觉","score":{"cat":"goflow","points":1}}]},{"no":10,"stem":"如果一天多出两小时，你会？","options":[{"key":"A","text":"排进计划，做最该做的那件","score":{"cat":"planner","points":1}},{"key":"B","text":"什么也不安排，享受一下","score":{"cat":"goflow","points":1}},{"key":"C","text":"补上之前欠下的进度","score":{"cat":"procrastinator","points":1}},{"key":"D","text":"开启一个一直想试的新项目","score":{"cat":"multitasker","points":1}}]}],"results":[{"key":"planner","categoryKey":"planner","name":"规划控","summary":"时间是你的积木，怎么拼你说了算。","detail":"你和时间的相处方式是「先设计再使用」。待办有优先级，日程有缓冲带，连休息都排进了计划。这种掌控感让你很少临时救火，也让你在团队里常常是那个兜底的人。你的效率来自前置思考，而不是临场爆发。要留意的是计划过密带来的僵硬：给每天留一格空白，意外来的时候你才不会全线崩盘。","traits":["条理清晰","前置思考","守时"],"growthTip":"每天留一格不安排的空白，专门用来处理意外。","shareCard":"时间人格：规划控，我的日程表自带缓冲带。你呢？","adSlot":"result_page"},{"key":"goflow","categoryKey":"goflow","name":"随性派","summary":"时间跟着感觉走，计划赶不上心情。","detail":"你和时间的相处方式是「跟着状态走」。你不爱被日程绑死，相信状态来了效率自然高。你的灵活性很强，突发事件打不乱你，因为你本来就没把计划钉死。这种松弛让你在高压环境里更容易自洽，但也可能让重要的事一直往后排。折中的办法不是变成规划控，而是只给最重要的一件事定死时间。","traits":["灵活","松弛","抗扰动"],"growthTip":"只给最重要的那一件事定死时间，其余的继续随缘。","shareCard":"时间人格：随性派，计划赶不上我的心情。你呢？","adSlot":"share_card"},{"key":"procrastinator","categoryKey":"procrastinator","name":"拖延共生体","summary":"和截止日期相爱相杀，最后一刻效率爆表。","detail":"你和时间的相处方式是「先共存，再爆发」。前三分之二的时间你在和各种小事纠缠，最后三分之一你突然进入无人之境，效率堪比开挂。你不是懒，只是需要压力作为启动燃料。这套模式的代价是长期紧绷和睡眠负债。更可持续的做法是把大任务提前拆成几个小截止日，让压力分批到达，而不是一次性砸下来。","traits":["爆发力强","压力驱动","夜猫子"],"growthTip":"把大任务拆成三个小截止日，让压力分批到达而不是集中砸下。","shareCard":"时间人格：拖延共生体，最后一刻的我效率爆表。你呢？","adSlot":"info_feed"},{"key":"multitasker","categoryKey":"multitasker","name":"多线程选手","summary":"脑子里同时跑着好几个进程，还都不卡。","detail":"你和时间的相处方式是「并行处理」。你能一边开会一边回消息，一边写方案一边跟进另一个项目，碎片时间在你手里也能被用起来。你的调度能力很强，是团队里推进多条线的关键角色。需要小心的是切换成本：看起来同时在跑，实际上每次换挡都会损失一点专注。给最需要深度的工作留一段单线程时间，产出会更稳。","traits":["调度强","反应快","善用碎片"],"growthTip":"每天留一小时只跑一个进程，深度工作的产出远高于并行。","shareCard":"时间人格：多线程选手，我的脑子常年开着好几个标签页。你呢？","adSlot":"result_page"}]},"37":{"id":37,"title":"【商业版权·原题参考】吵架风格测试（冲突处理模式）","shortName":"吵架风格","category":"关系","tags":["关系","职场","共鸣","实用向"],"copyrightStatus":"commercial","entertainment":true,"status":"pending_rederive","compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性关系风格分类，结果不代表任何心理评估、婚姻或临床诊断，仅用于自我觉察与沟通参考。","minorProtected":false},"source":{"theory":"Thomas-Kilmann Conflict Mode Instrument（TKI），Kenneth Thomas 与 Ralph Kilmann 编制；基于「坚持度（assertiveness）× 合作度（cooperativeness）」两轴划分五种冲突处理模式","officialOwner":"Kilmann Diagnostics；发行方为 The Myers-Briggs Company（CPP）","sourceType":"commercial","licensing":"官方 TKI 为 30 题商业量表，需向 CPP / Kilmann Diagnostics 或授权分销商购买，含计分表与解读手册；商用与施测须付费授权。","verbatimNote":"官方 TKI 逐字题面为专有资产，本文件所载为基于公开资料还原的代表性样题（成对陈述二选一形式），非官方逐字原文；若需逐字商用须获授权。"},"description":"TKI 用两个维度描述人在冲突中的反应：你有多想坚持自己（坚持度），以及你有多想顾及对方（合作度）。两轴交叉出五种典型模式：竞争、协作、妥协、回避、迁就。没有哪一种绝对更好，关键是你是否知道自己在用哪一种。","instructions":"共 10 组，每组两个反应方式，选你在冲突中更可能选的那个，凭直觉作答，约 3 分钟。","estimatedMinutes":3,"questionCount":10,"scoringModel":"category","categories":[{"key":"competing","name":"竞争型 · 我要赢"},{"key":"collaborating","name":"协作型 · 一起解"},{"key":"compromising","name":"妥协型 · 各让一步"},{"key":"avoiding","name":"回避型 · 先放放"},{"key":"accommodating","name":"迁就型 · 让给你"}],"axes":[{"key":"assertive","name":"坚持度","poles":[{"key":"high","label":"高坚持"},{"key":"low","label":"低坚持"}]},{"key":"cooperative","name":"合作度","poles":[{"key":"high","label":"高合作"},{"key":"low","label":"低合作"}]}],"tieBreak":"得分最高的模式为结果；平票时按数组顺序（竞争→协作→妥协→回避→迁就）优先取前者。","originalItemBank":{"structure":"官方 TKI 为 30 道「成对陈述二选一」题：五种模式两两组合共 10 种配对，每种配对出现 3 次，每种模式累计出现 12 次；计分后得到五种模式各自的原始分，并对照常模转换为剖面图。","itemForm":"成对陈述二选一：给出 A、B 两种在冲突中的反应，选更像自己会做的那个。","note":"以下为还原的代表性样题（中文），用于理解原题出题逻辑与五模式、两轴的操作化方式，非官方逐字原文。","items":[{"no":1,"stem":"发生分歧时，我更可能","options":[{"key":"A","text":"坚持自己的立场，直到对方接受","maps":"competing"},{"key":"B","text":"先让步，把关系维持住","maps":"accommodating"}]},{"no":2,"stem":"发生分歧时，我更可能","options":[{"key":"A","text":"把问题摊开，一起找出新的解法","maps":"collaborating"},{"key":"B","text":"各让一步，尽快把这件事结束掉","maps":"compromising"}]},{"no":3,"stem":"发生分歧时，我更可能","options":[{"key":"A","text":"先放一放，等合适的时机再说","maps":"avoiding"},{"key":"B","text":"直接把我的想法说出来","maps":"competing"}]},{"no":4,"stem":"发生分歧时，我更可能","options":[{"key":"A","text":"试着先满足对方的期待","maps":"accommodating"},{"key":"B","text":"找出双方真正在意的点，再谈","maps":"collaborating"}]},{"no":5,"stem":"发生分歧时，我更可能","options":[{"key":"A","text":"提一个折中的方案","maps":"compromising"},{"key":"B","text":"先不表态，观察一下","maps":"avoiding"}]},{"no":6,"stem":"发生分歧时，我更可能","options":[{"key":"A","text":"用事实和道理说服对方","maps":"competing"},{"key":"B","text":"顾及对方感受，适当退让","maps":"accommodating"}]},{"no":7,"stem":"发生分歧时，我更可能","options":[{"key":"A","text":"组织一次认真的讨论，把根因解决掉","maps":"collaborating"},{"key":"B","text":"建议双方各承担一半","maps":"compromising"}]},{"no":8,"stem":"发生分歧时，我更可能","options":[{"key":"A","text":"避免正面冲突，冷处理","maps":"avoiding"},{"key":"B","text":"明确表达我的底线","maps":"competing"}]},{"no":9,"stem":"发生分歧时，我更可能","options":[{"key":"A","text":"把对方的需求放在我的前面","maps":"accommodating"},{"key":"B","text":"找一个双方都不太满意但能接受的方案","maps":"compromising"}]},{"no":10,"stem":"发生分歧时，我更可能","options":[{"key":"A","text":"推动大家把问题彻底解决","maps":"collaborating"},{"key":"B","text":"暂时搁置，先做别的事","maps":"avoiding"}]}]},"questions":[{"no":1,"stem":"群里讨论方案，你的方案被当众反对，你会：","options":[{"key":"A","text":"当场摆数据据理力争，我不信说不服","score":{"cat":"competing","points":1}},{"key":"B","text":"把人拉下来，一起找个双方都能接受的新方案","score":{"cat":"collaborating","points":1}},{"key":"C","text":"各自退一步，取中间值先往前走","score":{"cat":"compromising","points":1}},{"key":"D","text":"没必要争，先不回，等气氛过了再说","score":{"cat":"avoiding","points":1}}]},{"no":2,"stem":"和伴侣因为周末安排吵起来：","options":[{"key":"A","text":"聊清楚各自到底想要什么，设计个两全安排","score":{"cat":"collaborating","points":1}},{"key":"B","text":"一人选一天，公平交换","score":{"cat":"compromising","points":1}},{"key":"C","text":"先冷战两天，谁也别理谁","score":{"cat":"avoiding","points":1}},{"key":"D","text":"算了听你的吧，别因为这点事伤感情","score":{"cat":"accommodating","points":1}}]},{"no":3,"stem":"开会两派僵持不下，你是主持人：","options":[{"key":"A","text":"直接拍板按更优的来，时间不等人","score":{"cat":"competing","points":1}},{"key":"B","text":"让双方把诉求摊开，逐条对齐","score":{"cat":"collaborating","points":1}},{"key":"C","text":"提议一个折中版，让大家都能下台阶","score":{"cat":"compromising","points":1}},{"key":"D","text":"为了大局，我可以先按对方的来","score":{"cat":"accommodating","points":1}}]},{"no":4,"stem":"同事把锅甩到了你头上：","options":[{"key":"A","text":"立刻在群里澄清，责任该是谁讲明白","score":{"cat":"competing","points":1}},{"key":"B","text":"这次我先认一半，下次你得顶回来","score":{"cat":"compromising","points":1}},{"key":"C","text":"默默把事做了，懒得撕","score":{"cat":"avoiding","points":1}},{"key":"D","text":"他要是真为难，我先帮忙兜住，事后再说","score":{"cat":"accommodating","points":1}}]},{"no":5,"stem":"朋友聚餐选店，你想吃 A，大家想吃 B：","options":[{"key":"A","text":"都行都行，你们开心就好","score":{"cat":"accommodating","points":1}},{"key":"B","text":"找一家大家都想吃点东西的店","score":{"cat":"collaborating","points":1}},{"key":"C","text":"这次先吃 B，下次我来选","score":{"cat":"compromising","points":1}},{"key":"D","text":"我不参与讨论，你们定好喊我","score":{"cat":"avoiding","points":1}}]},{"no":6,"stem":"明知道对方在胡搅蛮缠：","options":[{"key":"A","text":"直接戳破逻辑漏洞，不留情面","score":{"cat":"competing","points":1}},{"key":"B","text":"先理解他诉求背后的担心，再对齐事实","score":{"cat":"collaborating","points":1}},{"key":"C","text":"找个借口离场","score":{"cat":"avoiding","points":1}},{"key":"D","text":"不想让他太难堪，按他说的来吧","score":{"cat":"accommodating","points":1}}]},{"no":7,"stem":"因为噪音问题和邻居起了冲突，你是当事人：","options":[{"key":"A","text":"讲道理，我的作息没毛病","score":{"cat":"competing","points":1}},{"key":"B","text":"主动沟通，商量个双方都方便的方案","score":{"cat":"collaborating","points":1}},{"key":"C","text":"约定几点之后保持安静，互相体谅","score":{"cat":"compromising","points":1}},{"key":"D","text":"戴耳塞算了，不想敲门","score":{"cat":"avoiding","points":1}}]},{"no":8,"stem":"团队里功劳分配明显偏向别人：","options":[{"key":"A","text":"找领导把贡献讲清楚，该我的不能少","score":{"cat":"competing","points":1}},{"key":"B","text":"和相关人沟通一个更合理的分工口径","score":{"cat":"collaborating","points":1}},{"key":"C","text":"不争头功，但下次资源要向我倾斜","score":{"cat":"compromising","points":1}},{"key":"D","text":"吃亏是福，算了","score":{"cat":"accommodating","points":1}}]},{"no":9,"stem":"谈判桌上对方条件很离谱：","options":[{"key":"A","text":"亮出底牌强硬施压","score":{"cat":"competing","points":1}},{"key":"B","text":"深挖双方真实利益，把蛋糕做大","score":{"cat":"collaborating","points":1}},{"key":"C","text":"拖着，等对方先急","score":{"cat":"avoiding","points":1}},{"key":"D","text":"先让一步把单签了，细节以后再说","score":{"cat":"accommodating","points":1}}]},{"no":10,"stem":"室友从来不做公共卫生：","options":[{"key":"A","text":"定规矩、拍照打卡，不执行就摊牌","score":{"cat":"competing","points":1}},{"key":"B","text":"我多做一点，但他负责倒垃圾","score":{"cat":"compromising","points":1}},{"key":"C","text":"忍着，大不了自己做完","score":{"cat":"avoiding","points":1}},{"key":"D","text":"顺手做了，不想为这种事红脸","score":{"cat":"accommodating","points":1}}]}],"results":[{"key":"competing","categoryKey":"competing","name":"竞争型 · 我要赢","summary":"坚持度高、合作度低：立场明确，寸步不让。","detail":"冲突一来，你的第一反应是站定自己的立场：有理就要说透，必要时可以硬碰硬。紧急时刻你敢拍板，边界始终清晰，不会因为怕尴尬而含糊其辞。优势是决断快、抗压、关键时刻扛得住场面；代价是容易让对方觉得被压了过去，事情解决了，关系却留下一道看不见的划痕。","traits":["决断","有边界","抗压"],"growthTip":"赢下论点之前，先确认这段关系你还想不想要。","shareCard":"我是竞争型，吵架从来不打算输。你呢？","adSlot":"result_page"},{"key":"collaborating","categoryKey":"collaborating","name":"协作型 · 一起解","summary":"坚持度高、合作度高：既说清自己，也接住对方。","detail":"你把冲突当成一道要解的题，而不是一场要赢的仗。你会先问「你真正在意的是什么」，再把自己的底线摊开，愿意多花时间找到两边都能接受的那个点。优势是方案扎实、关系不伤，一次谈透就少掉很多后患；代价是耗时耗力，还得碰上一个同样愿意坐下来聊的人。","traits":["双赢思维","耐心","会挖掘需求"],"growthTip":"不是所有冲突都值得深挖，小事上允许快速结案。","shareCard":"我是协作型，吵架是为了把问题解决掉。你呢？","adSlot":"result_page"},{"key":"compromising","categoryKey":"compromising","name":"妥协型 · 各让一步","summary":"两个维度都在中间：务实、求快、能落地。","detail":"你务实、求快，习惯先找一条双方都能接受的中线：各让一步，今天就能过。截止日期压过来的时候，你是那个把事情推过终点的人。优势是效率高、能快速止损、让运转不停摆；代价是方案常常是「两边都不太满意」，根因还在原地，同样的分歧过阵子还会再来一次。","traits":["务实","灵活","效率高"],"growthTip":"偶尔多问一句：我们到底在让掉什么？","shareCard":"我是妥协型，各让一步赶紧翻篇。你呢？","adSlot":"result_page"},{"key":"avoiding","categoryKey":"avoiding","name":"回避型 · 先放放","summary":"坚持度低、合作度低：不正面处理，先搁置。","detail":"冲突刚起时你倾向于先放一放，等情绪退潮再说，或者直接绕开这个话题。这确实挡掉了不少无谓的升级，也为思考争取了缓冲时间。优势是不被情绪裹挟、很少说出让自己后悔的话；代价是小问题会悄悄攒成大问题，而对面那个人可能已经开始怀疑你到底在不在意。","traits":["克制","冷静","会缓冲"],"growthTip":"给回避设一个期限，别把「先放放」变成「永不处理」。","shareCard":"我是回避型，先放一放再说。你呢？","adSlot":"result_page"},{"key":"accommodating","categoryKey":"accommodating","name":"迁就型 · 让给你","summary":"坚持度低、合作度高：先满足对方，维持和谐。","detail":"你把关系放在自己的需求前面，习惯先满足对方、先把气氛稳住。冲突降温快，你也因此人缘不错，很少有人真的生你的气。优势是温和、体贴、能让局面迅速回到正轨；代价是委屈会一点点积起来，而对方始终不知道你真正想要的是什么，久了连你自己也懒得再提。","traits":["温和","顾大局","善维持关系"],"growthTip":"你的需求不是添麻烦，说一次不会失去谁。","shareCard":"我是迁就型，算了，让给你吧。你呢？","adSlot":"result_page"}],"reDeriveHint":"自编重推方向：保留「五模式 + 两轴」这一公开理论框架（Thomas-Kilmann 两轴五模式属广泛流传的管理学知识），但题面全部换成中文生活化冲突场景（和伴侣吵架、同事甩锅、朋友爽约、家人催婚），并把「成对二选一」改造成更适合小程序的四选一。建议 8–10 题，输出主导模式 + 次要模式，增加「你们俩的模式组合」会显著提升双人分享。","_derived":true},"38":{"id":38,"title":"饭局生存人格鉴定","shortName":"饭局人格","category":"社交","tags":["饭局","聚餐","社交","职场","中国人情"],"copyrightStatus":"internet_native","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性趣味分类，结果不代表任何心理评估或医学诊断。","minorProtected":false},"source":{"theory":"无权威来源，互联网原生趣味测评","sourceType":"internet_native","reference":"本测题为原创自编"},"description":"从点菜、敬酒、转桌到散场，饭局是中国人最微妙的社交场。测一测你在饭桌上最稳定的生存姿势是哪一种。","instructions":"共 10 题，请按真实饭局表现作答，别按你希望的样子选。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"host","name":"主陪"},{"key":"topic_king","name":"话题王"},{"key":"eater","name":"埋头吃"},{"key":"server","name":"服务员型"},{"key":"leaver","name":"先溜型"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"刚被通知今晚有个局，你的第一反应是？","options":[{"key":"A","text":"问清都有谁，好提前安排座位","score":{"cat":"host","points":1}},{"key":"B","text":"挺好，又有新的人可以聊","score":{"cat":"topic_king","points":1}},{"key":"C","text":"提前问一句有没有忌口，好跟店里交代","score":{"cat":"server","points":1}},{"key":"D","text":"先确认几点能走，心里有个底","score":{"cat":"leaver","points":1}}]},{"no":2,"stem":"人到齐了，菜单传到你手上？","options":[{"key":"A","text":"我来统筹，荤素凉热和忌口一次问全","score":{"cat":"host","points":1}},{"key":"B","text":"边点边聊，顺便问问大家最近在忙啥","score":{"cat":"topic_king","points":1}},{"key":"C","text":"直奔招牌菜，别的都随意","score":{"cat":"eater","points":1}},{"key":"D","text":"快速划完，赶紧把菜单传下去","score":{"cat":"leaver","points":1}}]},{"no":3,"stem":"上菜了，转盘正好停在你面前？","options":[{"key":"A","text":"先照顾主位和长辈，再转回来","score":{"cat":"host","points":1}},{"key":"B","text":"边转边夸这道菜，顺手带出一个话题","score":{"cat":"topic_king","points":1}},{"key":"C","text":"先给自己来一筷子，等这道菜等半天了","score":{"cat":"eater","points":1}},{"key":"D","text":"先给旁边空着碗的人添上","score":{"cat":"server","points":1}}]},{"no":4,"stem":"有人开始讲一个又长又没人接的段子，你？","options":[{"key":"A","text":"礼貌听完，再自然把话头递给别人","score":{"cat":"host","points":1}},{"key":"B","text":"低头认真吃，等这段过去","score":{"cat":"eater","points":1}},{"key":"C","text":"给他续点茶，让人有个台阶下","score":{"cat":"server","points":1}},{"key":"D","text":"看一眼手机，盘算这段还要多久","score":{"cat":"leaver","points":1}}]},{"no":5,"stem":"桌上有人杯子空了，你？","options":[{"key":"A","text":"正好借这个空档跟他搭上话","score":{"cat":"topic_king","points":1}},{"key":"B","text":"没太注意，我正研究这道菜怎么做","score":{"cat":"eater","points":1}},{"key":"C","text":"直接起身给他满上","score":{"cat":"server","points":1}},{"key":"D","text":"注意到了，但不太想起身","score":{"cat":"leaver","points":1}}]},{"no":6,"stem":"有人迟到了二十分钟才到，你？","options":[{"key":"A","text":"起身给他腾位置，顺便补一句菜还热着","score":{"cat":"host","points":1}},{"key":"B","text":"拿他开个玩笑，把气氛接上","score":{"cat":"topic_king","points":1}},{"key":"C","text":"帮他把餐具和杯子摆好","score":{"cat":"server","points":1}},{"key":"D","text":"心里算了算，这局又得往后延","score":{"cat":"leaver","points":1}}]},{"no":7,"stem":"聊到一半，话题转到了你不熟的领域？","options":[{"key":"A","text":"把话头往大家都能接的方向带一带","score":{"cat":"host","points":1}},{"key":"B","text":"不懂就问，问着问着就聊开了","score":{"cat":"topic_king","points":1}},{"key":"C","text":"不插话，专心对付面前那盘","score":{"cat":"eater","points":1}},{"key":"D","text":"安静听着，开始盘算待会儿怎么退场","score":{"cat":"leaver","points":1}}]},{"no":8,"stem":"一道硬菜上桌，分量刚好不够分？","options":[{"key":"A","text":"张罗着先给主客和年长的分","score":{"cat":"host","points":1}},{"key":"B","text":"起哄说这道得配个故事，把气氛顶上去","score":{"cat":"topic_king","points":1}},{"key":"C","text":"眼疾手快，这种时候不能客气","score":{"cat":"eater","points":1}},{"key":"D","text":"说自己不饿，让别人先来","score":{"cat":"server","points":1}}]},{"no":9,"stem":"饭吃到八分饱，节奏慢下来了，你？","options":[{"key":"A","text":"看一眼表，差不多该收尾了","score":{"cat":"host","points":1}},{"key":"B","text":"主打一个不浪费，把剩的慢慢扫完","score":{"cat":"eater","points":1}},{"key":"C","text":"把桌上的空盘和杂物收一收","score":{"cat":"server","points":1}},{"key":"D","text":"找个合适的空档起身，说先走一步","score":{"cat":"leaver","points":1}}]},{"no":10,"stem":"散场之后，你最常做的事是？","options":[{"key":"A","text":"还在门口跟人聊，又续上了第二轮","score":{"cat":"topic_king","points":1}},{"key":"B","text":"复盘一下今天哪道菜最值得","score":{"cat":"eater","points":1}},{"key":"C","text":"确认大家都到家了才放心","score":{"cat":"server","points":1}},{"key":"D","text":"一出门就长出一口气，终于自由了","score":{"cat":"leaver","points":1}}]}],"results":[{"key":"host","categoryKey":"host","name":"主陪","summary":"场子由你撑着，谁都没被落下。","detail":"你是饭局里的隐形主持人：安排座位、点菜问忌口、冷场时提议碰一个、散场张罗买单。你享受把一切安排妥当的感觉，也确实擅长让每个人都舒服。你的周到是真心实意，不是客套，所以大家都愿意叫你来组局。要记得的是：主陪也是客人，别把自己完全忘了，偶尔让别人接一次班，你会轻松很多。","traits":["周到","控场","照顾全局"],"growthTip":"把一部分张罗交给别人，你也该好好吃几口菜。","shareCard":"饭局生存人格：主陪，冷场时我会提议碰一个。你呢？","adSlot":"result_page"},{"key":"topic_king","categoryKey":"topic_king","name":"话题王","summary":"有你在，桌上就不会出现三秒钟冷场。","detail":"你是饭局的空气循环系统。冷场三秒之内你必然抛出新话题，谁被晾在一边你会主动拉进来，还能把不熟的人聊成熟人。你的表达欲和观察力让饭局始终有流动感，也让你成为大家默认想约的人。唯一的小提醒：话题之外也要留白，别人需要说话的空间，饭局不是你的个人脱口秀。","traits":["会聊天","救场专业户","带动气氛"],"growthTip":"抛完话题后多问一句「你觉得呢」，把舞台分一半出去。","shareCard":"饭局生存人格：话题王，冷场在我这儿活不过三秒。你呢？","adSlot":"share_card"},{"key":"eater","categoryKey":"eater","name":"埋头吃","summary":"社交可以没有，但这道菜不能不吃。","detail":"你来饭局的核心目标非常清晰：把这顿饭吃明白。别人在敬酒，你在研究这家的招牌做法；别人在寒暄，你在等转盘转到你面前。你不是不懂社交，只是觉得与其硬聊不如认真对待桌上的菜。你的存在让饭局保持了最朴素的快乐。偶尔抬头接两句话，你会发现气氛其实也没那么难。","traits":["目标明确","真诚不装","美食优先"],"growthTip":"抬头接一句别人抛来的话，社交没你想的那么耗电。","shareCard":"饭局生存人格：埋头吃，社交可以没有，这道菜必须有。你呢？","adSlot":"info_feed"},{"key":"server","categoryKey":"server","name":"服务员型","summary":"全场最忙的人，茶水纸巾全靠你。","detail":"你在饭局上几乎没怎么坐着：茶没了你喊人，碗空了你添饭，新菜上桌你先给别人转过去。你的体贴是本能反应，看到别人不方便就忍不住上手。你是桌上最让人安心的存在，但也常常因此吃不到几口热菜。体贴很好，只是别让它变成义务——照顾别人的同时，也允许自己被照顾一次。","traits":["眼里有活","体贴","默默兜底"],"growthTip":"先给自己盛一碗再照顾别人，你的体贴不该以饿肚子为代价。","shareCard":"饭局生存人格：服务员型，全场茶水都由我盯着。你呢？","adSlot":"result_page"},{"key":"leaver","categoryKey":"leaver","name":"先溜型","summary":"从入座开始就在计算撤退时间。","detail":"你的饭局时钟从落座那一刻就开始走动：什么时候礼貌地走、用什么理由走、需不需要先跟主位说一声。你不讨厌人，只是长时间社交确实耗电，独处才是你的充电方式。你懂得体面地退场，这是种成熟。可以改进的是退场时机：把该建立的连接在离开前完成，溜得早也不会错过重要的事。","traits":["边界清晰","省电优先","退场体面"],"growthTip":"走之前把该聊的两句聊完，早退也能留下好印象。","shareCard":"饭局 "有自己的事业，收入不设上限","score":{"cat":"hustler","points":1}},{"key":"C","text":"过得松弛，知道自己真正想要什么","score":{"cat":"gapyear","points":1}},{"key":"D","text":"见过更大的世界，也更知道自己要什么","score":{"cat":"study_abroad","points":1}}]}],"results":[{"key":"postgrad","categoryKey":"postgrad","name":"考研党","summary":"自习室的常驻选手，倒计时比生日记得还清楚。","detail":"你选择用一段时间的高强度专注，换一个更高的起点。你的自制力和目标感都很强，能把一年的计划拆成每天的作息表。这条路最大的挑战不是难度，而是漫长过程中的自我怀疑。请记得：考研是一场长跑，状态起伏是正常的，别用某一天的低效否定整段努力，节奏比强度更重要。","traits":["目标感强","自律","能熬"],"growthTip":"给每周留半天彻底放松，长期战靠的是节奏而不是冲刺。","shareCard":"毕业生存图鉴：考研党，倒计时比生日记得还清楚。你呢？","adSlot":"result_page"},{"key":"civil_service","categoryKey":"civil_service","name":"考公党","summary":"刷题刷到梦里都在做言语理解。","detail":"你把确定性放在很高的位置，愿意为此投入大量重复练习。你做事讲流程、讲复盘，错题本比笔记还厚。这种踏实是优势，但也要小心一条路走太久带来的视野收窄：给自己留一个备选方案不是动摇，而是风险控制。把备考当成项目来管理，效率会比硬熬高得多。","traits":["耐得住重复","求稳","复盘能力强"],"growthTip":"备考之外留一个备选方向，有兜底的心态反而更容易发挥。","shareCard":"毕业生存图鉴：考公党，梦里都在做言语理解。你呢？","adSlot":"share_card"},{"key":"hustler","categoryKey":"hustler","name":"搞钱派","summary":"不等机会上门，自己先开一扇窗。","detail":"你对「先干起来」这件事有天然认同：别人还在投简历，你已经在接第一单。你的市场嗅觉和执行力是最大资产，也让你比同龄人更早理解真实世界的规则。要留意的是收入波动带来的不确定感：把零散的单子沉淀成可复用的能力和稳定的客户，搞钱才会从体力活变成事业。","traits":["行动力强","市场嗅觉好","不怕试错"],"growthTip":"把每次试错的流程记下来，能力沉淀比单笔收入更值钱。","shareCard":"毕业生存图鉴：搞钱派，不等机会上门，自己先开窗。你呢？","adSlot":"info_feed"},{"key":"gapyear","categoryKey":"gapyear","name":"gap year","summary":"先停下来，把方向想清楚再出发。","detail":"你拒绝在没想清楚的时候被推着走，愿意用一段时间换一个更明确的自己。这份勇气在当下的节奏里并不常见，也很珍贵。但空窗期最怕的是「既没休息好也没想清楚」：给这段时间设一个主题和大致期限，比如学一门技能、走一趟长途、做一次实习，回来时你会带着具体的收获而不是空白。","traits":["敢于暂停","自我觉察","节奏自主"],"growthTip":"给空窗期设一个主题和期限，结束时要能说清自己得到了什么。","shareCard":"毕业生存图鉴：gap year，先停下来把方向想清楚。你呢？","adSlot":"result_page"},{"key":"study_abroad","categoryKey":"study_abroad","name":"留学党","summary":"行李还没收，脑子里已经在倒时差。","detail":"你愿意把生活整体搬到一个陌生的坐标系里，换取更大的视野和不同的可能性。你的准备过程繁琐而漫长：语言、材料、申请、签证，每一步都不轻松，你已经比很多人更能扛事。出发前请多准备一件事：想清楚你希望在那里得到什么，视野之外，具体的目标会让这一年值回票价。","traits":["视野开阔","准备充分","适应力强"],"growthTip":"在申请清单之外，也列一份「想在那边做成的事」清单。","shareCard":"毕业生存图鉴：留学党，行李没收，脑子已在倒时差。你呢？","adSlot":"share_card"}]},"40":{"id":40,"title":"松弛感等级测试（趣味版）","shortName":"松弛感等级","category":"自我成长/生活","tags":["松弛感","反内耗","生活方式","打工人","自我成长"],"copyrightStatus":"internet_native","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性趣味分级，结果不代表任何心理评估或医学诊断，也不评价个人价值。","minorProtected":false},"source":{"theory":"无权威来源，互联网原生趣味测评","sourceType":"internet_native","reference":"本测题为原创自编"},"description":"松弛感不是躺平，是事情来了也不把自己绷断。从突发状况、别人的评价到周末安排，测一测你的松弛浓度落在哪一档。","instructions":"共 10 题，请按最近三个月的真实反应作答，别按你希望成为的样子选。","estimatedMinutes":2,"questionCount":10,"scoringModel":"threshold","bands":[{"key":"tense","name":"紧绷大师","min":0,"max":7},{"key":"partly","name":"间歇松弛","min":8,"max":14},{"key":"mostly","name":"小有松弛","min":15,"max":22},{"key":"master","name":"松弛天花板","min":23,"max":30}],"tieBreak":"总分按 bands 区间直接命中；若分数落在区间边界，取更高一档。","questions":[{"no":1,"stem":"计划好的周末被临时打乱，你会？","options":[{"key":"A","text":"很烦躁，一整天都回不来","score":{"points":0}},{"key":"B","text":"有点不爽，但会重新排一下","score":{"points":1}},{"key":"C","text":"看情况，说不定有意外惊喜","score":{"points":2}},{"key":"D","text":"正好，随它去","score":{"points":3}}]},{"no":2,"stem":"发了一条消息对方半天没回？","options":[{"key":"A","text":"反复看聊天记录，怀疑自己说错话","score":{"points":0}},{"key":"B","text":"有点在意，但忍住不追问","score":{"points":1}},{"key":"C","text":"大概在忙，等就是了","score":{"points":2}},{"key":"D","text":"完全没注意，手机放一边","score":{"points":3}}]},{"no":3,"stem":"有人对你的选择提出不同意见？","options":[{"key":"A","text":"会反复想，是不是自己真的错了","score":{"points":0}},{"key":"B","text":"听一听，但心里还是会纠结","score":{"points":1}},{"key":"C","text":"有道理的部分就吸收","score":{"points":2}},{"key":"D","text":"谢谢，但我清楚自己要什么","score":{"points":3}}]},{"no":4,"stem":"工作群里深夜弹出新需求？","options":[{"key":"A","text":"立刻爬起来处理，不然睡不着","score":{"points":0}},{"key":"B","text":"先看一眼，心里挂念着","score":{"points":1}},{"key":"C","text":"判断真不紧急，明天再说","score":{"points":2}},{"key":"D","text":"静音，明天是另一个我","score":{"points":3}}]},{"no":5,"stem":"出门前发现要迟到了？","options":[{"key":"A","text":"一路都在自责和焦虑","score":{"points":0}},{"key":" 有效得多。","traits":["有觉察","认真但不极端","容易回弹"],"growthTip":"把放松写进日程而不是等有空，固定时段的松弛才不会被事情挤掉。","shareCard":"松弛感等级：间歇松弛，刚松下来又把自己绷回去了。你呢？","adSlot":"share_card"},{"key":"mostly","name":"小有松弛","summary":"大事认真，小事随缘，分寸拿捏得不错。","detail":"你已经掌握了松弛的核心：分清哪些事值得用力，哪些事可以放手。被打乱的计划你能接住，别人的评价你能筛选，做错事也不会反复折磨自己。你的状态让身边的人也跟着放松，这是很稀缺的能力。要做的只是守住它：在特别忙的阶段里，也别把那点放空时间第一个牺牲掉。","traits":["分寸感好","能取舍","不易内耗"],"growthTip":"忙季也要守住那一段放空时间，它是你的续航来源而不是奖励。","shareCard":"松弛感等级：小有松弛，大事认真小事随缘。你呢？","adSlot":"info_feed"},{"key":"master","name":"松弛天花板","summary":"事情来了接住，接不住就放下，从不内耗。","detail":"你的松弛不是无所谓，而是分得清边界：别人的节奏是别人的，自己的时区自己做主。你能认真做事，也能在下班那一刻真正下班。这种状态让你很少被情绪拖着走，也让和你相处的人感到舒服。唯一需要留意的是：松弛过了头容易变成回避，该争取的事还是要开口，不然机会会默认跳过你。","traits":["边界清晰","不易内耗","自带节奏"],"growthTip":"松弛很好，遇到真正想要的东西记得主动伸手，别全靠随缘。","shareCard":"松弛感等级：松弛天花板，接不住的事我就放下。你呢？","adSlot":"result_page"}]},"41":{"id":41,"title":"信息茧房类型鉴定","shortName":"信息茧房类型","category":"网络/认知","tags":["信息茧房","算法推荐","刷短视频","热搜","认知习惯"],"copyrightStatus":"theory","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性分类，结果不代表任何心理评估、能力评定或医学诊断。","minorProtected":false},"source":{"theory":"「信息茧房（Information Cocoons）」概念由 Cass Sunstein 于 2001 年在《Republic.com》中提出，用于描述人们只接触自己选择或令自己愉悦的信息、从而隔绝其他观点的现象；本测题为基于该概念的原创自编娱乐版。","sourceType":"theory","reference":"本测题为基于公开理论概念的原创自编题面，不引用任何量表原题"},"description":"每天刷到的内容，其实早就悄悄划分了你的信息口味。10 道题鉴定你被困在哪一层茧里：是算法把你养得舒服，还是你自己主动剪开了一个口子。","instructions":"共 10 题，按你刷手机、看新闻、逛社区时的真实习惯作答，别按理想中的自己回答。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"algo","name":"算法投喂型"},{"key":"comfort","name":"同温层舒适圈"},{"key":"breaker","name":"主动破圈型"},{"key":"hotspot","name":"热点跟随型"},{"key":"omnivore","name":"信息杂食型"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"刷到一个和你观点完全相反的视频，你会？","options":[{"key":"A","text":"看完就划走，反正推荐流很快又会给我顺眼的","score":{"cat":"algo","points":1}},{"key":"B","text":"转发到同好朋友群，大家一起吐槽","score":{"cat":"comfort","points":1}},{"key":"C","text":"停下来搜一搜对立面到底怎么说","score":{"cat":"breaker","poi etail":"你对被投喂天然警惕，遇到不熟悉甚至违背自己直觉的观点，第一反应不是划走而是查证。你会找原始出处、看完整背景、把对立面的推理认真读完，这份较真让你少踩很多坑。需要留意的是，破圈也会消耗精力，不必每条信息都追到底。把好奇心留给真正重要的问题，比什么都查更可持续。","traits":["主动求证","好奇心强","独立判断"],"growthTip":"给查证设个止损线，值得深挖的才深挖，其余交给时间验证。","shareCard":"信息茧房鉴定：我是主动破圈型，看到反对意见反而更想点开。你呢？","adSlot":"result_page"},{"key":"hotspot","categoryKey":"hotspot","name":"热点跟随型","summary":"世界在聊什么，你就立刻补什么课。","detail":"热榜是你的每日早报，爆款话题一个都舍不得落下。你的信息更新速度极快，社交场上永远不缺谈资，也不会出现「这事我居然不知道」的尴尬。需要注意的是，热点的半衰期很短，今天的全民话题下周可能无人提起。在追热之外留一点长期关注，你会在热闹散场后依然有东西可聊。","traits":["反应迅速","话题感强","紧跟节奏"],"growthTip":"挑一两个真正感兴趣的领域长期追更，让谈资不只剩热搜。","shareCard":"信息茧房鉴定：我是热点跟随型，热搜更新比我起床还早。你呢？","adSlot":"info_feed"},{"key":"omnivore","categoryKey":"omnivore","name":"信息杂食型","summary":"什么都看一点，好奇是对你最准确的描述。","detail":"你的信息口味相当杂：长文、播客、短视频、论文、评论区，来者不拒。你享受那种东看西看、偶然撞见有趣东西的感觉，脑子里也因此装着不少跨界素材。唯一的小麻烦是收藏夹越堆越高、真正读完的却不多。给杂食配一个消化动作，比如每周挑一篇收藏认真读完并写下三句话，你的杂食就会变成真正的积累。","traits":["涉猎广泛","跨界素材多","好奇心旺盛"],"growthTip":"每周清一次收藏夹，把「看过」变成「消化过」，杂食也能长肌肉。","shareCard":"信息茧房鉴定：我是信息杂食型，收藏夹比我的人生还丰富。你呢？","adSlot":"share_card"}]},"42":{"id":42,"title":"星际人格鉴定：你是哪个外星种族","shortName":"星际人格","category":"脑洞/玄学","tags":["脑洞","外星人","星际","人设","趣味"],"copyrightStatus":"internet_native","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性分类，结果不代表任何心理评估或医学诊断，纯属脑洞设定。","minorProtected":false},"source":{"theory":"无权威来源，互联网原生趣味测评","sourceType":"internet_native","reference":"本测题为原创自编"},"description":"如果地球只是你的暂住证，你老家究竟在哪片星区？10 道题给你安排一个外星种族身份，附赠族徽性格、舱室审美和社交方式。科学含量为 0，快乐含量拉满。","instructions":"共 10 题，凭第一直觉选，不要计算哪个听起来更酷（虽然我知道你很想）。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"solari","name":"炽阳族"},{"key":"abyssi","name":"深蓝族"},{"key":"zephyr","name":"风行族"},{"key":"crystal","name":"晶石族"},{"key":"darkmatter","name":"暗物质族"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"第一次踏上陌生星球，你的第一反应是？","options":[{"key":"A","text":"冲在最前面，把周围照亮看个清楚","score":{"cat":"solari","points":1}},{"key":"B","text":"先安静观察地形和气候，再决定落脚点","score":{"ca ":{"cat":"crystal","points":1}},{"key":"C","text":"能感知到别人没说出口的情绪暗流","score":{"cat":"abyssi","points":1}},{"key":"D","text":"想去哪儿，一阵风就到了","score":{"cat":"zephyr","points":1}}]},{"no":8,"stem":"和同伴闹别扭，你的处理方式更像？","options":[{"key":"A","text":"先出去飞一圈，回来就当没事了","score":{"cat":"zephyr","points":1}},{"key":"B","text":"当晚就打过去，把话说透","score":{"cat":"solari","points":1}},{"key":"C","text":"写一段很有条理的文字，说清各自的问题","score":{"cat":"crystal","points":1}},{"key":"D","text":"默默消失几天，想清楚了再出现","score":{"cat":"darkmatter","points":1}}]},{"no":9,"stem":"一年一度的星际庆典，你最想？","options":[{"key":"A","text":"站上舞台中心，把气氛拉到最满","score":{"cat":"solari","points":1}},{"key":"B","text":"找个安静角落，看别人热闹","score":{"cat":"abyssi","points":1}},{"key":"C","text":"负责流程表，让一切严丝合缝","score":{"cat":"crystal","points":1}},{"key":"D","text":"不出现在名单上，但你知道全场的细节","score":{"cat":"darkmatter","points":1}}]},{"no":10,"stem":"给你的种族写一句自我介绍，你会选？","options":[{"key":"A","text":"我们的文明建在最严谨的结构之上","score":{"cat":"crystal","points":1}},{"key":"B","text":"我们从不在一个星系停留太久","score":{"cat":"zephyr","points":1}},{"key":"C","text":"我们更喜欢研究看不见的东西","score":{"cat":"darkmatter","points":1}},{"key":"D","text":"我们的海，比你们的天空更深","score":{"cat":"abyssi","points":1}}]}],"results":[{"key":"solari","categoryKey":"solari","name":"炽阳族","summary":"自带发光体质，走到哪儿哪儿亮堂。","detail":"炽阳族出生在恒星附近，天生热量超标，靠近他们的人都会被烘得暖洋洋。你是人群里的启动键：冷场时第一个开口，没人敢接的活儿第一个举手，情绪来得快去得也快。你的热情很有感染力，但也有个副作用——容易把别人的冷淡当成针对自己。记住，不是所有人都扛得住满功率照射，偶尔调成小夜灯模式，反而能让身边的人待得更久。","traits":["热情外放","行动力强","气氛发动机"],"growthTip":"把光留给愿意靠近的人，也给自己留一段不发热的冷却时间。","shareCard":"星际人格鉴定：我是炽阳族，自带发光体质，靠近我请注意防晒。你呢？","adSlot":"result_page"},{"key":"abyssi","categoryKey":"abyssi","name":"深蓝族","summary":"表面风平浪静，底下是整片深海。","detail":"深蓝族的家园被液态海洋覆盖，族人习惯在高压里安静思考。你话不多，但每句话都在脑子里过了好几遍；别人以为你只是安静，其实你正在感知全场最细微的情绪变化。你的深度和共情是稀缺资源，麻烦在于太习惯独自消化，把很多话沉到了海底。试着把深处的想法打捞上来一点点，你会发现愿意听的人比想象中多。","traits":["内敛深沉","共情细腻","观察力强"],"growthTip":"不用一次说尽，把心里话说出三成就已经是一次潜水成功。","shareCard":"星际人格鉴定：我是深蓝族，表面平静，内心压强未知。你呢？","adSlot":"share_card"},{"key":"zephyr","categoryKey":"zephyr","name":"风行族","summary":"不在一个星系停留太久，也不打算道歉。","detail":"风行族没有固定疆域，整个族群都在漂移，讲究的是此刻想去哪儿。你对新鲜事物上头极快，对重复性的日子则容易倦怠，计划表在你手里基本活不过三天。你的轻盈和即兴让人很放松，也总能带来意外的好点子。稍微留一点锚点——比如一件坚持很久的小事——你就不会在风里彻底失去方向。","traits":["自由洒脱","适应力强","即兴玩家"],"growthTip":"保留一件长期坚持的小事当锚，风再大也吹不走你。","shareCard":"星际人格鉴定：我是风行族，计划表在我手里活不过三天。你呢？","adSlot":"info_feed"},{"key":"crystal","categoryKey":"crystal","name":"晶石族","summary":"万物皆可分类，混乱在你手里会被重新排列。","detail":"晶石族的身体由规则晶格构成，天生对结构和秩序上瘾。看到乱糟糟的表格、混乱的流程、含糊的表达，你的第一反应是动手整理。你靠谱、严谨、交付稳定，是团队里的承重结构。唯一需要警惕的是过度打磨：当「还可以更整齐」变成无限循环时，完成比完美更值得庆祝。允许一点点无序存在，世界并不会塌。","traits":["严谨可靠","结构化思维","细节控"],"growthTip":"给每件事设一个「够好就交」的标准，把省下的力气拿去休息。","shareCard":"星际人格鉴定：我是晶石族，看到乱表格手就痒。你呢？","adSlot":"result_page"},{"key":"darkmatter","categoryKey":"darkmatter","name":"暗物质族","summary":"占宇宙质量的大头，但谁也看不见你。","detail":"暗物质族几乎不与光发生作用，习惯隐身在可见范围之外默默观察。你多半是那个不在群里发言、却把聊天记录全部看完的人；重要的场合你可能缺席合影，但全场细节都在你脑子里。你的存在感靠结果而非音量建立，值得注意的只有一点：不出现，别人就真的不知道你在。偶尔主动露一次面，你的影响力会立刻翻倍。","traits":["低调神秘","洞察入微","结果导向"],"growthTip":"每季度主动展示一次成果，让存在感不只停留在你的脑子里。","shareCard":"星际人格鉴定：我是暗物质族，我一直在场，只是你没看到。你呢？","adSlot":"share_card"}]},"43":{"id":43,"title":"理财脑回路鉴定","shortName":"理财脑回路","category":"生活/消费","tags":["消费观","存钱","打工人","记账","金钱态度"],"copyrightStatus":"theory","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性分类，结果不代表任何心理评估或医学诊断，也绝不构成任何投资、理财或消费决策建议。","minorProtected":false},"source":{"theory":"参考金钱态度量表 MAS（Money Attitude Scale, Yamauchi & Templer, 1982）与 Klontz 金钱人格（Klontz Money Script / Money Personality）理论框架；本测题为基于上述公开理论的原创自编娱乐版。","sourceType":"theory","reference":"本测题为基于公开理论框架的原创自编题面，不引用任何量表原题"},"description":"同样是一笔钱，有人先存起来，有人先花掉，有人先算三遍。10 道题鉴定你的金钱脑回路属于哪一派：储蓄、投机、月光还是精算。这里没有任何投资建议，只有花钱姿势的自我介绍。","instructions":"共 10 题，按你真实的花钱习惯作答。本测试不提供、也不构成任何理财或投资建议。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"saver","name":"储蓄派"},{"key":"speculator","name":"投机派"},{"key":"moonlight","name":"月光派"},{"key":"calculator","name":"精算式消费"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"发工资当天，你的第一反应是？","options":[{"key":"A","text":"先把固定要存的那部分转走","score":{"cat":"saver","points":1}},{"key":"B","text":"看看最近有没有什么机会可以搏一把","score":{"cat":"speculator","points":1}},{"key":"C","text":"先把上个月的欠款还上","score":{"cat":"moonlight","points":1}},{"key":"D","text":"打开记账软件，对齐这个月的预算","score":{"cat":"calculator","points":1}}]},{"no":2,"stem":"看到一件很想要、但有点贵的东西，你会？","options":[{"key":"A","text":"想要就买，快乐不能等","score":{"cat":"moonlight","points":1}},{"key":"B","text":"算一下每次使用的成本再决定","score":{"cat":"calculator","points":1}},{"key":"C","text":"放进购物车冷静三天再说","score":{"cat":"saver","points":1}},{"key":"D","text":"研究它会不会更值钱、好不好转手","score":{"cat":"speculator","points":1}}]},{"no":3,"stem":"突然多了一笔意外收入，你会？","options":[{"key":"A","text":"拿去试一个我关注很久的方向","score":{"cat":"speculator","points":1}},{"key":"B","text":"直接转入那张不动的卡","score":{"cat":"saver","points":1}},{"key":"C","text":"按比例分配：一部分花、一部分留","score":{"cat":"calculator","points":1}},{"key":"D","text":"请自己吃顿好的，钱就是用来花的","score":{"cat":"moonlight","points":1}}]},{"no":4,"stem":"你手机里的财务类 App 更接近哪一类？","options":[{"key":"A","text":"记账软件，分类清清楚楚","score":{"cat":"calculator","points":1}},{"key":"B","text":"支付软件，主要用来付款和看余额","score":{"cat":"moonlight","points":1}},{"key":"C","text":"行情软件，时不时瞄上一眼","score":{"cat":"speculator","points":1}},{"key":"D","text":"银行 App，看看存款和到期日","score":{"cat":"saver","points":1}}]},{"no":5,"stem":"月底发现这个月花超了，你的第一反应是？","options":[{"key":"A","text":"下个月把非必要开支全砍掉补回来","score":{"cat":"saver","points":1}},{"key":"B","text":"列张表看看钱具体漏在哪","score":{"cat":"calculator","points":1}},{"key":"C","text":"反正都花完了，先开心过完这月","score":{"cat":"moonlight","points":1}},{"key":"D","text":"想办法搞点额外收入把这个洞填上","score":{"cat":"speculator","points":1}}]},{"no":6,"stem":"一件日用品有平价款和贵价款，你会？","options":[{"key":"A","text":"挑喜欢的那个，贵点也认了","score":{"cat":"moonlight","points":1}},{"key":"B","text":"看哪个更划算、以后更好出手","score":{"cat":"speculator","points":1}},{"key":"C","text":"算一下使用频次和单次成本","score":{"cat":"calculator","points":1}},{"key":"D","text":"选平价款，差价省下来","score":{"cat":"saver","points":1}}]},{"no":7,"stem":"听到「这个以后可能会涨」，你的反应是？","options":[{"key":"A","text":"眼睛一亮，先研究研究","score":{"cat":"speculator","points":1}},{"key":"B","text":"算一下最坏情况能不能承受","score":{"cat":"calculator","points":1}},{"key":"C","text":"没兴趣，我只相信存下来的钱","score":{"cat":"saver","points":1}},{"key":"D","text":"心动一下，然后还是买了自己想要的","score":{"cat":"moonlight","points":1}}]},{"no":8,"stem":"你更愿意为什么样的支出买单？","options":[{"key":"A","text":"算过单价之后确认划算的东西","score":{"cat":"calculator","points":1}},{"key":"B","text":"必需品，而且挑最实惠的渠道买","score":{"cat":"saver","points":1}},{"key":"C","text":"让我当下特别开心的体验","score":{"cat":"moonlight","points":1}},{"key":"D","text":"有成长空间、将来可能更值钱的东西","score":{"cat":"speculator","points":1}}]},{"no":9,"stem":"卡里躺着一笔暂时用不到的钱，你更倾向？","options":[{"key":"A","text":"放着不动，看到余额就安心","score":{"cat":"saver","points":1}},{"key":"B","text":"迟早会花出去，不如早点安排","score":{"cat":"moonlight","points":1}},{"key":"C","text":"找一个我觉得有意思的方向试试","score":{"cat":"speculator","points":1}},{"key":"D","text":"分成几份，各司其职","score":{"cat":"calculator","points":1}}]},{"no":10,"stem":"年底算总账时，你最在意哪个数字？","options":[{"key":"A","text":"今年有多少次是花得真正开心的","score":{"cat":"moonlight","points":1}},{"key":"B","text":"各类支出的占比是否合理","score":{"cat":"calculator","points":1}},{"key":"C","text":"有没有抓住过一次好机会","score":{"cat":"speculator","points":1}},{"key":"D","text":"存款比年初多了多少","score":{"cat":"saver","points":1}}]}],"results":[{"key":"saver","categoryKey":"saver","name":"储蓄派","summary":"余额是安全感本身，数字不动心才定。","detail":"你的金钱脑回路以「确定性」为核心：先存后花、能省则省、看到余额增长比买到什么都高兴。你对冲动消费有天然免疫力，购物车里的东西经常被冷静期劝退。这份克制让你很少陷入月底的慌张，也是很多人羡慕的能力。需要注意的是，「省」一旦变成默认选项，也可能让你错过那些真正值得花的体验。给消费分个类：日常开销省，成长和体验花，你会过得既稳又不亏待自己。","traits":["克制自律","安全感强","先存后花"],"growthTip":"把「能省」和「值得花」分成两类对待，别让省钱成为唯一的判断标准。","shareCard":"理财脑回路鉴定：我是储蓄派，看到余额才睡得着。你呢？","adSlot":"result_page"},{"key":"speculator","categoryKey":"speculator","name":"投机派","summary":"比起确定的小收益，你更在意那一点点可能性。","detail":"你对「机会」两个字格外敏感，遇到可能变多的东西就忍不住研究一番，也愿意为此承担波动。你的脑子转得快、信息嗅觉灵敏，常常是最早注意到风向的人。需要注意的是，可能性总是比确定性更迷人，也更容易让人高估自己能承受的代价。玩得久的投机派都有一个共同点：提前给自己划好一条输得起的线，越线就停手。机会永远有，本金和心情只有一份。（本测试不涉及任何投资建议。）","traits":["机会敏感","敢于试错","信息嗅觉好"],"growthTip":"动手之前先写下自己能承受的最坏结果，并严格执行这条上限。","shareCard":"理财脑回路鉴定：我是投机派，看到「可能性」三个字就来劲。你呢？","adSlot":"share_card"},{"key":"moonlight","categoryKey":"moonlight","name":"月光派","summary":"钱是用来花的，月底见底是常态不是事故。","detail":"你花得不抠门，也从不亏待当下的心情：喜欢就买、开心就请、体验优先。朋友圈里你大概率是那种「这家店不错下次一起去」的人，人缘和快乐指数都很高。代价是每到月底就得跟余额玩一次心跳，遇到突发支出时会有点被动。不用强迫自己变成另一个人，只需要给未来的自己留一小份：把「先花剩下的再存」反过来一次，你会发现快乐并没有减少。","traits":["及时行乐","慷慨大方","体验优先"],"growthTip":"试试「先留后花」，哪怕只留一成，月底的你会感谢现在的你。","shareCard":"理财脑回路鉴定：我是月光派，月底余额和我一样坦诚。你呢？","adSlot":"info_feed"},{"key":"calculator","categoryKey":"calculator","name":"精算式消费","summary":"每一笔支出，都要先过一遍心算。","detail":"你的脑子里常年开着一张电子表格：单次使用成本、同类比价、月度占比、预算余量，样样清楚。你很少买贵的东西，也很少买错的东西，朋友们做购买决策时常来问你一句。这份理性让你几乎不会被营销话术带走。唯一的小提醒是，算得太细会消耗精力，也会让一些本该立刻拥有的快乐变得迟钝。小钱可以快速决定，大钱才值得你启动完整算法。","traits":["精打细算","理性比价","预算感强"],"growthTip":"给支出分个档：小额随手决定，大额才启动完整计算流程。","shareCard":"理财脑回路鉴定：我是精算式消费，买东西先算单次成本。你呢？","adSlot":"result_page"}]},"44":{"id":44,"title":"运动人格鉴定","shortName":"运动人格","category":"健康趣味","tags":["运动","健身","办卡","躺平","朋友圈"],"copyrightStatus":"internet_native","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性分类，结果不代表任何体能评定、健康评估或医学诊断。","minorProtected":false},"source":{"theory":"无权威来源，互联网原生趣味测评","sourceType":"internet_native","reference":"本测题为原创自编"},"description":"有人练到膝盖有话说，有人办卡即运动，有人把瑜伽垫铺成了防滑垫。10 道题鉴定你的运动人设，看看你和运动之间，到底是谁先动了心。","instructions":"共 10 题，按你这一年真实的运动状态作答，别替立了 flag 的自己代答。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"grinder","name":"卷练狂"},{"key":"zen","name":"佛系动"},{"key":"cardholder","name":"办卡即运动"},{"key":"couch","name":"纯躺派"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"朋友周末约你去运动，你的第一反应是？","options":[{"key":"A","text":"好啊几点，我把训练计划顺便发你","score":{"cat":"grinder","points":1}},{"key":"B","text":"行，走哪儿算哪儿，出点汗就行","score":{"cat":"zen","points":1}},{ ,"score":{"cat":"zen","points":1}},{"key":"D","text":"常年垫底，也不太打算改","score":{"cat":"couch","points":1}}]},{"no":8,"stem":"刷到别人的马甲线照片，你会？","options":[{"key":"A","text":"划走，顺手点了份外卖","score":{"cat":"couch","points":1}},{"key":"B","text":"收藏一下，哪天有心情再说","score":{"cat":"zen","points":1}},{"key":"C","text":"分析他的训练动作，今晚加练","score":{"cat":"grinder","points":1}},{"key":"D","text":"打开健身 App 看看课程排期","score":{"cat":"cardholder","points":1}}]},{"no":9,"stem":"你理想中的运动搭子是？","options":[{"key":"A","text":"会给我数数、不许我偷懒的人","score":{"cat":"grinder","points":1}},{"key":"B","text":"办了卡、愿意一起去的人","score":{"cat":"cardholder","points":1}},{"key":"C","text":"不强求、随时可以取消的人","score":{"cat":"zen","points":1}},{"key":"D","text":"能一起点外卖的人","score":{"cat":"couch","points":1}}]},{"no":10,"stem":"给这一年的运动写句年终总结，你会选？","options":[{"key":"A","text":"办卡三张，到店两次","score":{"cat":"couch","points":1}},{"key":"B","text":"全年无休，膝盖有话要说","score":{"cat":"grinder","points":1}},{"key":"C","text":"续费成功，明年再战","score":{"cat":"cardholder","points":1}},{"key":"D","text":"想动就动，没给自己压力","score":{"cat":"zen","points":1}}]}],"results":[{"key":"grinder","categoryKey":"grinder","name":"卷练狂","summary":"训练计划比工作日程还细，休息日也要算进周期。","detail":"你是健身房里最不需要教练催的人：目标、组数、心率、配速，样样有数。别人靠意志力启动，你靠日程表自动运行。这份自律非常能打，也确实带来了看得见的进步。只是身体不是永动机，恢复也是训练的一部分。给计划里加上「什么都不做」这一项，你会发现状态反而更稳，膝盖也会想给你发一面锦旗。","traits":["自律拉满","目标感强","执行力高"],"growthTip":"把休息日写进训练计划，并且像完成训练一样认真完成它。","shareCard":"运动人格鉴定：我是卷练狂，休息日也要排进训练周期。你呢？","adSlot":"result_page"},{"key":"zen","categoryKey":"zen","name":"佛系动","summary":"出点汗就行，KPI 这种东西不进健身房。","detail":"你和运动的关系相当健康：想动就动，不想动也没有罪恶感，从不为了打卡而打卡。散步、爬楼、偶尔跑两圈，都是你的运动方式。你不太在意数据和排名，也因此避开了很多焦虑和比较。唯一的小遗憾是，因为太随缘，进步常常来得慢一点。找一个不较劲但有点新鲜感的项目，比如跟着朋友去一次没玩过的课，你的佛系里会多出一点乐趣。","traits":["随缘自在","不内卷","心态稳"],"growthTip":"给随缘加一点点新鲜感，偶尔尝试一项没玩过的运动。","shareCard":"运动人格鉴定：我是佛系动，出点汗就行，不卷不比不焦虑。你呢？","adSlot":"share_card"},{"key":"cardholder","categoryKey":"cardholder","name":"办卡即运动","summary":"付费的那一刻，我感觉自己已经练过了。","detail":"你对运动的诚意主要体现在支付记录上：年卡、私教课、装备、运动 App 会员，一个不落。办卡当天你真心相信这次一定坚持，朋友圈的合影也拍得很认真。问题在于，付款带来的满足感太强，反而提前消耗了行动的动力。破局的办法很朴素：把「去一次」的门槛降到最低，比如只去十分钟就走。你需要的不是更强的意志，而是一次轻松的开机。","traits":["付费即行动","装备党","开局热情高"],"growthTip":"把目标从「练一小时」改成「到场十分钟」，先把门推开。","shareCard":"运动人格鉴定：我是办卡即运动，付完款就算练过了。你呢？","adSlot":"info_feed"},{"key":"couch","categoryKey":"couch","name":"纯躺派","summary":"沙发是我的主场，外卖是我的能量补给。","detail":"你和运动之间隔着一张沙发、一部手机和一份还没点的外卖。你不是不知道运动好，只是启动成本在你这里高得离谱：换衣服、出门、出汗、洗澡，每一步都能劝退你。好消息是，你对自己很诚实，没给自己编「明天一定」的谎言。真正能打动躺派的，从来不是宏大的健身目标，而是把动作塞进已有习惯里：外卖下楼拿、追剧时站着看两集，动起来其实不需要仪式感。","traits":["诚实躺平","启动门槛高","享受当下"],"growthTip":"别立大目标，把一个小动作挂在已有习惯上，比如取外卖顺便多走一圈。","shareCard":"运动人格鉴定：我是纯躺派，沙发和我已经融为一体。你呢？","adSlot":"result_page"}]},"45":{"id":45,"title":"追剧人格鉴定","shortName":"追剧人格","category":"生活","tags":["追剧","倍速","片单","弃剧","会员"],"copyrightStatus":"internet_native","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性分类，结果不代表任何心理评估或医学诊断。","minorProtected":false},"source":{"theory":"无权威来源，互联网原生趣味测评","sourceType":"internet_native","reference":"本测题为原创自编"},"description":"同样一部剧，有人一晚上刷完，有人看十分钟就弃，有人收藏了两年还没点开。10 道题鉴定你的追剧人格：倍速党、沉浸党、弃剧王还是囤剧党。","instructions":"共 10 题，按你真实的看剧习惯作答，别按你希望自己成为的那种观众回答。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"speed","name":"倍速党"},{"key":"immersive","name":"沉浸党"},{"key":"quitter","name":"弃剧王"},{"key":"hoarder","name":"囤剧党"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"新剧开播第一集，你会？","options":[{"key":"A","text":"直接 1.5 倍速，先看看值不值得看","score":{"cat":"speed","points":1}},{"key":"B","text":"关灯戴耳机，连片头都不跳过","score":{"cat":"immersive","points":1}},{"key":"C","text":"看十分钟，不行就立刻换一部","score":{"cat":"quitter","points":1}},{"key":"D","text":"先加进片单，攒着以后一起看","score":{"cat":"hoarder","points":1}}]},{"no":2,"stem":"你的「待看片单」现状更像哪一种？","options":[{"key":"A","text":"攒了三十部，一部还没动","score":{"cat":"hoarder","points":1}},{"key":"B","text":"开过的比看完的多三倍","score":{"cat":"quitter","points":1}},{"key":"C","text":"不多，但每一部都认真看完","score":{"cat":"immersive","points":1}},{"key":"D","text":"边攒边看， s":1}}]},{"no":9,"stem":"追剧时你最受不了什么？","options":[{"key":"A","text":"节奏拖沓，恨不得手动快进","score":{"cat":"speed","points":1}},{"key":"B","text":"更新太慢，等得片单越堆越高","score":{"cat":"hoarder","points":1}},{"key":"C","text":"中途人设崩了，立刻出戏","score":{"cat":"quitter","points":1}},{"key":"D","text":"看到一半被打断，情绪断了","score":{"cat":"immersive","points":1}}]},{"no":10,"stem":"年度追剧总结，你更像哪一句？","options":[{"key":"A","text":"一年看了 8 部，每部都能聊出细节","score":{"cat":"immersive","points":1}},{"key":"B","text":"弃了 20 部，完结 1 部","score":{"cat":"quitter","points":1}},{"key":"C","text":"全年刷完 50 部，倍速功不可没","score":{"cat":"speed","points":1}},{"key":"D","text":"收藏 100 部，实际看完 2 部","score":{"cat":"hoarder","points":1}}]}],"results":[{"key":"speed","categoryKey":"speed","name":"倍速党","summary":"1.5 倍速是起步，3 倍速才是常态。","detail":"你对剧情的耐心极其有限，对节奏的敏感度却高得惊人：哪段是注水、哪段是关键，扫两眼就能判断。你的看剧效率让很多人自叹不如，朋友圈里你永远是最早聊结局的那个人。代价是，被你快进掉的常常不只是拖沓，还有那些值得停留的镜头和配乐。遇到真正喜欢的剧，试着调回原速看一集，你会发现有些东西只有慢下来才看得见。","traits":["效率至上","节奏敏感","阅片量大"],"growthTip":"遇到真正喜欢的剧调回原速，给好内容一点不被快进的尊重。","shareCard":"追剧人格鉴定：我是倍速党，1.5 倍速只是我的热身。你呢？","adSlot":"result_page"},{"key":"immersive","categoryKey":"immersive","name":"沉浸党","summary":"片头不跳、弹幕关掉，看剧是我的专属仪式。","detail":"你把看剧当成一件正经事：关灯、戴耳机、不跳片头、关弹幕，甚至会为了一部剧专门留出一个不被打扰的晚上。你能记住角色的台词细节，也能为一集哭得稀里哗啦，这种投入本身就是一种享受。唯一的问题是，沉浸需要整块时间，而你常常等不到。提前把看剧时段写进日程，你的沉浸就不再是奢侈，而是每周固定的犒赏。","traits":["投入度高","感受力强","有仪式感"],"growthTip":"把看剧时间提前排进日程，让它成为固定奖励而不是临时插空。","shareCard":"追剧人格鉴定：我是沉浸党，看剧关弹幕不跳片头。你呢？","adSlot":"share_card"},{"key":"quitter","categoryKey":"quitter","name":"弃剧王","summary":"开过的不计其数，完结的屈指可数。","detail":"你对烂剧零容忍：人设崩了、逻辑走了、节奏塌了，立刻出戏换台。这份果断让你省下大量时间，也从不在烂片上纠缠。可副作用也很真实——你的播放记录像一份弃剧清单，能完整聊到结局的剧没几部，朋友聊到后半段剧情时你常常插不上话。试试给每部剧一个「三集试用期」，过了试用期再决定去留，你的完结率会悄悄上升。","traits":["果断止损","眼光挑剔","拒绝将就"],"growthTip":"给新剧设一个三集试用期，熬过试用期再决定要不要弃。","shareCard":"追剧人格鉴定：我是弃剧王，开过的比看完的多三倍。你呢？","adSlot":"info_feed"},{"key":"hoarder","categoryKey":"hoarder","name":"囤剧党","summary":"收藏夹比片库还满，播放记录比脸还干净。","detail":"你是收藏夹的忠实囤积者：看到推荐就先码住，会员到期前疯狂下载，硬盘和片单一起膨胀。囤的过程本身就让你满足，仿佛收藏等于看过了。真相是，清单越长，开一部新剧的心理负担就越重。破局只需要一个动作：每次想收藏新剧，先删掉一部旧的。片单瘦下来，你反而更容易点开某一部，真正开始看。","traits":["收藏狂魔","未雨绸缪","选择困难"],"growthTip":"进一部先出一部，给片单做减法，看剧这件事才会真正开始。","shareCard":"追剧人格鉴定：我是囤剧党，收藏 100 部，看完 2 部。你呢？","adSlot":"result_page"}]},"46":{"id":46,"title":"【商业版权·原题参考】团队角色测试（贝尔宾九角色）","shortName":"团队角色","category":"职场","tags":["职场","团队","自我认知","转发向"],"copyrightStatus":"commercial","entertainment":true,"status":"pending_rederive","compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性团队角色分类，结果不代表任何心理评估或人事测评结论，不得用于招聘、晋升等人事决策。","minorProtected":false},"source":{"theory":"Belbin Team Roles，Meredith Belbin 博士基于英国剑桥 Henley 管理学院的团队研究提出；九种团队角色理论及配套自评量表（Belbin Team Role Self-Perception Inventory）与观察者评价（Observer Assessment）","officialOwner":"Belbin Associates（belbin.com）","sourceType":"commercial","licensing":"官方 Belbin 自评量表与 360 度观察者评价系统均为商业产品，需向 Belbin Associates 或授权代理购买账号；商用与团队报告须付费授权。","verbatimNote":"官方 Belbin 量表逐字题面为专有资产，本文件所载为基于公开资料还原的代表性样题（分数分配题形式），非官方逐字原文；若需逐字商用须获授权。"},"description":"贝尔宾认为，高效团队不是由「最优秀的人」组成，而是由「角色互补的人」组成。他把团队成员分为九种角色：协调者、推动者、创新者、资源调查者、监控评估者、团队工作者、执行者、完成者、专家。每种角色都有其贡献，也有被允许的弱点。","instructions":"共 3 组，每组 8 句话，请把 10 分分配给你觉得符合自己的句子上（可以全给一句，也可以分散），凭直觉作答，约 5 分钟。","estimatedMinutes":5,"questionCount":10,"scoringModel":"category","categories":[{"key":"co","name":"CO 协调者"},{"key":"sh","name":"SH 推动者"},{"key":"pl","name":"PL 创新者"},{"key":"ri","name":"RI 资源调查者"},{"key":"me","name":"ME 监控评估者"},{"key":"tw","name":"TW 团队工作者"},{"key":"imp","name":"IMP 执行者"},{"key":"cf","name":"CF 完成者"},{"key":"sp","name":"SP 专家"}],"tieBreak":"得分最高的角色为主角色；平票时取在题目中出现位置更靠前的角色（数组顺序优先）。","originalItemBank":{"structure":"官方 Belbin Team Role Self-Perception Inventory 共 7 个大组，每组 8 句陈述，受测者把 10 分分配到组内符合自己的句子上（可集中也可分散）；计分后得到九种角色的分数剖面，并区分「最突出角色」与「可管理角色」。另有观察者评价（同事打分）版用于对照自评与他评的差异。","itemForm":"分数分配题：每组给出 8 句行为陈述，把 10 分分配到你认为符合自己的句子。","note":"以下为还原的代表性样题（中文），用于理解原题出题逻辑与九角色的操作化方式，非官方逐字原文。","items":[{"no":1,"stem":"第 1 组：把 10 分分配给你觉得符合自己的句子","options":[{"key":"A","text":"我能很快发现并利用新的机会","maps":"ri"},{"key":"B","text": 。","detail":"你和手机的关系相当清爽：需要时用，用完就放，电量见底也不慌，吃饭时它是真的不参与。你能长时间专注在一件事上，也不需要靠刷屏填补空隙，这在今天其实是一种稀缺能力。值得留意的是，偶尔也可能因此错过一些需要及时回应的消息。给自己定一个固定的查看时段，既不打扰专注，也不会让别人找不到你。","traits":["专注力强","边界清楚","不焦虑"],"growthTip":"保持这份清爽，同时固定几个查看消息的时段，别让重要消息等你太久。","shareCard":"手机依赖人格鉴定：我是冷静在线型，手机只是我的工具，不是我的器官。你呢？","adSlot":"result_page"},{"key":"casual","name":"随手一刷型","bands":[{"key":"casual","name":"随手一刷型","min":18,"max":25}],"summary":"用得不少，但放得下，属于健康区间的常规操作。","detail":"你每天的手机使用量属于大多数人的水平：通勤刷一刷、睡前看两眼、等外卖时打发几分钟。它能帮你消解零碎时间，也不至于挤掉正事。你基本能控制住自己，只是偶尔会因为「再刷一条」而晚睡几分钟。想让状态更舒服，可以从最容易的地方下手：睡前把手机放到伸手够不着的地方，第二天早上的你会明显精神一些。","traits":["张弛有度","会放松","基本自控"],"growthTip":"睡前把手机放到伸手够不着的地方，睡眠质量会给你正反馈。","shareCard":"手机依赖人格鉴定：我是随手一刷型，刷得动也放得下。你呢？","adSlot":"share_card"},{"key":"attached","name":"机不离手型","bands":[{"key":"attached","name":"机不离手型","min":26,"max":32}],"summary":"手机在手里的时间，比在任何地方都长。","detail":"你的手机几乎参与了所有场景：吃饭、走路、睡前、甚至洗手间。你已经习惯了随时在线，一旦闲下来手就会自动伸向屏幕，很多时候并不是真的要看什么，只是需要一个填充动作。这种高频使用让你信息灵通、反应迅速，但也悄悄吃掉了不少整块时间。试试给每天划出一两段「无手机时间」，比如吃饭的前十分钟，你会重新注意到很多被忽略的细节。","traits":["随时在线","信息灵通","习惯性刷屏"],"growthTip":"每天划出一两段无手机时间，比如吃饭前十分钟，让注意力回到眼前。","shareCard":"手机依赖人格鉴定：我是机不离手型，手机比我更懂我的手。你呢？","adSlot":"info_feed"},{"key":"fused","name":"人机合一型","bands":[{"key":"fused","name":"人机合一型","min":33,"max":40}],"summary":"手机电量就是你的电量，掉一格心就紧一下。","detail":"你和手机基本完成了物理层面的融合：出门忘带会折返回家，睡前最后一眼和醒来第一眼都是它，电量告急时连心情都会跟着变。你不是不知道这样有点累，只是手比脑子快。好消息是，这类习惯通常来自环境触发，而不是意志力问题：把最容易无意识刷的那几个 App 从首屏移走、把充电器放到卧室外面，物理距离比决心管用得多。","traits":["随时在线","反射式刷屏","电量敏感"],"growthTip":"把最容易无意识打开的 App 移出首屏，用物理距离替代意志力。","shareCard":"手机依赖人格鉴定：我是人机合一型，手机电量就是我的心情电量。你呢？","adSlot":"result_page"}]},"50":{"id":50,"title":"年度关键词生成","shortName":"年度关键词","category":"玄学/总结","tags":["年终总结","年度关键词","朋友圈","仪式感","梗"],"copyrightStatus":"internet_native","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性分类，结果不代表任何心理评估、运势预测或医学诊断。","minorProtected":false},"source":{"theory":"无权威来源，互联网原生趣味测评（年终总结梗）","sourceType":"internet_native","reference":"本测题为原创自编"},"description":"又到了写年终总结的时候。1 const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function store(k,v){ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }
function jstore(k,v){ if(v===undefined){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}} localStorage.setItem(k,JSON.stringify(v)); }
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function pad(n){return n<10?'0'+n:n}
function fmtTime(t){const d=new Date(t);return `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`}
let toastTimer=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),2200)}
function countOf(id){return 1280+(id*7919)%86000}

function go(page,opts){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  $('pg-'+page).classList.add('on');
  $('pg-'+page).scrollTop=0;
  $('tabbar').classList.toggle('hidden',!(page in TABS));
  $('tab-home').classList.toggle('on',page==='home');
  $('tab-cats').classList.toggle('on',page==='cats');
  $('tab-his').classList.toggle('on',page==='his');
  if(page==='home')renderHome();
  if(page==='cats')renderCats();
  if(page==='his')renderHistory();
}
function confirmDlg(html,onOk,okText='确定',danger){
  $('confirmSheet').innerHTML=`<h3>${danger?'⚠️ 请确认':'提示'}</h3><p>${html}</p>
    <div class="row"><button class="c" onclick="CP.closeConfirm()">取消</button>
    <button class="${danger?'d':'ok'}" id="cfOk">${esc(okText)}</button></div>`;
  $('confirmMask').classList.add('on');
  CP_NAV._ok=onOk;
}

function renderHome(){

    const t=INFO(id),th=THEMES[t.theme];

/* ================= 答题 ================= */
function startQuiz(mode){
  const id=C.cur.testId,test=T(id);
  const draft=jstore('cp_draft_'+id+'_'+mode);
  const begin=()=>{
    C.cur.mode=mode;
    C.cur.variant=(mode!=='single'&&id===7)?'swipe':variantOf(test);
    C.cur.answers=new Array(test.questions.length).fill('');
    C.cur.qi=0;
    C.cur.revealed=false;
    renderQuiz();
    go('quiz');
  };
  if(draft&&draft.answers&&(Date.now()-draft.ts<24*3600*1000)&&draft.answers.some(a=>a)){
    const cont=()=>{
      C.cur.mode=mode;
      C.cur.variant=(mode!=='single'&&id===7)?'swipe':variantOf(test);
      C.cur.answers=draft.answers;
      C.cur.qi=Math.min(draft.qi,test.questions.length-1);
      C.cur.revealed=false;
      renderQuiz();go('quiz');
    };
    $('confirmSheet').innerHTML=`<h3>发现未完成的答题</h3>
      <p>你之前做到第 <b>${draft.qi+1}</b> 题（24 小时内有效），要继续上次作答吗？</p>
      <div class="row"><button class="c" onclick="CP.closeConfirm()">取消</button>
      <button class="c" id="rsBtn">重新开始</button>
      <button class="ok" id="goBtn">继续上次</button></div>`;
    $('confirmMask').classList.add('on');
    $('goBtn').onclick=()=>{closeConfirm();cont()};
    $('rsBtn').onclick=()=>{closeConfirm();begin()};
  }else begin();
}
function saveDraft(){
  const {testId,mode,answers,qi}=C.cur;
  jstore('cp_draft_'+testId+'_'+mode,{answers,qi,ts:Date.now()});
}
function clearDraft(){
  const {testId,mode}=C.cur;
  localStorage.removeItem('cp_draft_'+testId+'_'+mode);
}
function renderQuiz(){
  const test=T(C.cur.testId),info=INFO(C.cur.testId),v=C.cur.variant;
  $('pg-quiz').className='pg on themed th-'+info.theme;
  const done=C.cur.answers.filter(a=>a).length;
  const pct=Math.round(done/test.questions.length*100);
  let body='';
  if(v==='scroll'){
    body=test.questions.map((q,qi)=>{
      const sel=C.cur.answers[qi];
      return `<div class="scroll-q"><div class="qn">Q${qi+1}</div><h4>${esc(q.stem)}</h4>
        ${q.options.map(o=>`<button class="opt ${sel===o.key?'sel':''}" onclick="CP.pick(${qi},'${o.key}')"><span class="k">${o.key}</span>${esc(o.text)}</button>`).join('')}</div>`;
    }).join('');
    body+=`<div class="submit-bar"><button class="btn btn-primary" id="scrollSubmit" ${done<test.questions.length?'disabled style="opacity:.45"':''} onclick="CP.submit()">${done<test.questions.length?`已答 ${done}/${test.questions.length}`:'提交，查看我的结果 →'}</button></div>`;
  }else{
    const q=test.questions[C.cur.qi];
    const anim=v==='swipe'?'anim-slide':v==='flip'?'anim-flip':'';
    body=`<div class="qprog"><div class="bar"><i style="width:${pct}%"></i></div><span>${C.cur.qi+1} / ${test.questions.length}</span></div>`;
    if(v==='draw'&&!C.cur.revealed){
      body+=`<div class="draw-stage"><div class="tarot-card tarot-back" onclick="CP.revealCard()"><span style="position:relative;z-index:2;font-size:15px;letter-spacing:2px">✦ 点击翻牌 ✦</span></div>
        <p style="margin-top:18px;color:var(--sub);font-size:13px">第 ${C.cur.qi+1} 张命运牌</p></div>`;
    }else if(v==='dual'){
      const axisKey=q.options[0].score.axis;
      const axis=test.axes.find(a=>a.key===axisKey);
      const cols=axis.poles.map(pl=>{
        const os=q.options.filter(o=>o.score.pole===pl.key);
        return `<div class="dual-col"><div class="pole">${esc(pl.label)}</div>
          ${os.map(o=>`<button class="opt ${C.cur.answers[C.cur.qi]===o.key?'sel':''}" onclick="CP.pick(${C.cur.qi},'${o.key}')"><span class="k">${o.key}</span>${esc(o.text)}</button>`).join('')}</div>`;
      }).join('');
      body+=`<div class="qcard ${anim}"><h2>${esc(q.stem)}</h2><div class="dual-axis">${esc(axis.name)}</div><div class="dual-cols">${cols}</div></div>`;
    }else{
      const revealCls=v==='draw'?'tarot-reveal':'';
      body+=`<div class="qcard ${anim} ${revealCls}">
        <h2>${esc(q.stem)}</h2>
        ${q.options.map(o=>`<button class="opt ${C.cur.answers[C.cur.qi]===o.key?'sel':''}" onclick="CP.pick(${C.cur.qi},'${o.key}')"><span class="k">${o.key}</span>${esc(o.text)}</button>`).join('')}
      </div>`;
    }
    body+=`<div class="q-foot"><button class="prev" ${C.cur.qi===0?'disabled style="opacity:.3"':''} onclick="CP.prevQ()">‹ 上一题</button><span style="font-size:12px;color:var(--sub)">${vHint(v)}</span><button class="prev" style="visibility:hidden">占位</button></div>`;
  }
  $('pg-quiz').innerHTML=`<div class="topbar" style="background:linear-gradient(180deg,var(--bg) 70%,transparent)">
      <button class="tb-back" style="background:var(--card);color:var(--tx);border:1px solid var(--line)" onclick="CP.quitQuiz()">‹</button>
      <div class="tb-title" style="color:var(--tx)">${esc(info.shortName)}</div></div>
    <div class="quiz-wrap">${body}</div>`;
}
function vHint(v){return {flip:'选择后自动下一题',swipe:'左右滑卡式',draw:'抽卡式作答',dual:'按你的倾向二选一'}[v]||''}
function revealCard(){C.cur.revealed=true;renderQuiz()}
function pick(qi,key){
  C.cur.answers[qi]=key;saveDraft();
  const test=T(C.cur.testId);
  if(C.cur.variant==='scroll'){const st=$('pg-quiz').scrollTop;renderQuiz();$('pg-quiz').scrollTop=st;return}
  if(qi<test.questions.length-1){
    C.cur.qi=qi+1;C.cur.revealed=false;
    setTimeout(renderQuiz,220);
  }else{
    setTimeout(submit,260);
  }
}
function prevQ(){if(C.cur.qi>0){C.cur.qi--;C.cur.revealed=true;renderQuiz()}}
function quitQuiz(){
  confirmDlg('退出后已答内容会保存为草稿（24 小时内有效），确定退出吗？',()=>{go('home')},'退出',true);
}

/* ================= 计分引擎 ================= */
function scoreTest(test,answers){
  const m=test.scoringModel;
  if(m==='category'){
    const sums={};
    test.questions.forEach((q,i)=>{
      const o=q.options.find(x=>x.key===answers[i]);const s=o.score;
      sums[s.cat]=(sums[s.cat]||0)+(s.points||1);
    });
    // 平票按 results 数组顺序
    let key=test.results[0].key,max=-1;
    test.results.forEach(r=>{const v=sums[r.key]||0;if(v>max){max=v;key=r.key}});
    const sorted=Object.entries(sums).sort((a,b)=>b[1]-a[1]);
    const nameMap=Object.fromEntries((test.categories||[]).map(c=>[c.key,c.name]));
    return {key,detail:{sums,sorted,nameMap,runnerUp:sorted[1]?{key:sorted[1][0],name:nameMap[sorted[1][0]]||sorted[1][0],gap:sorted[0][1]-sorted[1][1]}:null}};
  }
  if(m==='threshold'){
    let total=0;
    test.questions.forEach((q,i)=>{const o=q.options.find(x=>x.key===answers[i]);total+=(o.score.points||0)});
    const band=test.bands.find(b=>total>=b.min&&total<=b.max)||test.bands[test.bands.length-1];
    return {key:band.key,detail:{total,max:Math.max(...test.bands.map(b=>b.max)),bands:test.bands,band}};
  }
  if(m==='dimension'){
    const tally={};
    test.axes.forEach(a=>{tally[a.key]={};a.poles.forEach(p=>tally[a.key][p.key]=0)});
    test.questions.forEach((q,i)=>{const o=q.options.find(x=>x.key===answers[i]);tally[o.score.axis][o.score.pole]++});
    const match={};
    test.axes.forEach(a=>{
      const ps=a.poles;const v0=tally[a.key][ps[0].key],v1=tally[a.key][ps[1].key];
      match[a.key]=v1>=v0?ps[1].key:ps[0].key; // 平票取 poles[1]
    });
    const result=test.results.find(r=>r.match&&Object.keys(r.match).every(k=>r.match[k]==='*'||r.match[k]===match[k]))||test.results[0];
    return {key:result.key,detail:{match,tally}};
  }
}
function partnerScore(test,aAns,bAns){
  const vals=(ans)=>test.questions.map((q,i)=>q.options.find(o=>o.key===ans[i]).score.points||0);
  const va=vals(aAns),vb=vals(bAns);
  const Sa=va.reduce((s,v)=>s+v,0),Sb=vb.reduce((s,v)=>s+v,0);
  let sync=0;const div=[];
  va.forEach((a,i)=>{sync+=Math.max(0,3-Math.abs(a-vb[i]));if(a!==vb[i])div.push({no:i+1,stem:test.questions[i].stem,diff:Math.abs(a-vb[i])})});
  div.sort((a,b)=>b.diff-a.diff);
  const warmth=(Sa+Sb)/2;
  const pair=Math.round(sync/30*60+warmth/30*40);
  const band=test.bands.find(b=>warmth>=b.min&&warmth<=b.max)||test.bands[test.bands.length-1];
  return {key:band.key,scoreDetail:{sa:Sa,sb:Sb,sync,warmth,pairScore:pair,same:va.filter((a,i)=>a===vb[i]).length,divergence:div.slice(0,2)}};
}

/* ================= 提交 / 建记录 ================= */
function makeRecord(testId,mode,answers,extra){
  const test=T(testId);
  const sc=scoreTest(test,answers);
  const res=test.results.find(r=>r.key===sc.key);
  return Object.assign({
    id:'r'+Date.now()+Math.floor(Math.random()*1e4),
    testId,mode,answers,
    resultKey:sc.key,resultName:res.name,
    scoreDetail:sc.detail,total:sc.detail.total||null,
    time:Date.now(),source:C.cur.from||'home',
    ai:{unlocked:false,status:'idle',content:null,cached:false}
  },extra||{});
}
function submit(){
  const {testId,mode,answers}=C.cur;
  if(answers.some(a=>!a)){toast('还有题目没答完');return}
  if(testId===7&&mode==='inviter'){
    const rec=makeRecord(7,'partner_inviter',answers,{status:'waiting_partner'});
    C.records.unshift(rec);saveRecords();clearDraft();
    createInvite(rec);
    return;
  }
  if(testId===7&&mode==='invitee'){
    const inv=C.invites[C.cur.inviteToken];
    const aRec=C.records.find(r=>r.id===inv.inviterRecordId);
    const ps=partnerScore(T(7),aRec.answers,answers);
    const bRec=makeRecord(7,'partner_invitee',answers,{
      status:'paired',resultKey:ps.key,scoreDetail:ps.scoreDetail,inviteId:inv.token,partnerNick:inv.inviterNick});
    // A 记录更新
    aRec.status='paired';aRec.resultKey=ps.key;aRec.resultName=T(7).results.find(r=>r.key===ps.key).name;
    aRec.scoreDetail=ps.scoreDetail;aRec.partnerNick=inv.inviteeNick;
    inv.status='paired';inv.inviteeRecordId=bRec.id;inv.pairTime=Date.now();
    C.records.unshift(bRec);saveRecords();saveInvites();clearDraft();
    openResult(bRec.id);return;
  }
  const rec=makeRecord(testId,'single',answers);
  C.records.unshift(rec);saveRecords();clearDraft();
  openResult(rec.id);
}

function chartHtml(test,rec){
  const d=rec.scoreDetail;
  if(rec.mode==='partner_invitee'||(rec.status==='paired'&&d&&d.pairScore!=null)){
    return `<div class="rings">
      <div class="ring" style="background:conic-gradient(var(--pri) ${d.pairScore*3.6}deg, color-mix(in srgb,var(--pri) 18%,var(--card)) 0)"><div style="background:var(--card);width:92px;height:92px;border-radius:0;display:flex;flex-direction:column;justify-content:center"><b>${d.pairScore}</b><span>契合分</span></div></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="ring small" style="background:conic-gradient(var(--pri2) ${d.sa/30*360}deg,rgba(128,128,128,.15) 0)"><div style="background:var(--card);width:56px;height:56px;border-radius:0;display:flex;flex-direction:column;justify-content:center"><b>${d.sa}</b></div></div>
        <div class="ring small" style="background:conic-gradient(var(--pri2) ${d.sb/30*360}deg,rgba(128,128,128,.15) 0)"><div style="background:var(--card);width:56px;height:56px;border-radius:0;border-radius:0;display:flex;flex-direction:column;justify-content:center"><b>${d.sb}</b></div></div>
      </div></div>
      <div style="font-size:12.5px;line-height:2;opacity:.9">同频度 <b>${d.sync}/30</b>（${d.same} 题完全同频）· 关系温度 <b>${d.warmth}/30</b></div>
      <div class="divlist">${(d.divergence||[]).map(x=>`<div>💭 你们在「${esc(x.stem)}」这题看法差异最大，但没有对错，只是视角不同。</div>`).join('')}</div>`;
  }
  if(test.scoringModel==='category'){
    const max=Math.max(...d.sorted.map(x=>x[1]));
    return d.sorted.map(([k,v],i)=>{
      const nm=(d.nameMap[k]||k);
      return `<div class="barrow ${i===0?'win':''}"><div class="nm">${esc(nm)}</div><div class="tk"><i style="width:${Math.round(v/max*100)}%"></i></div><div class="vv">${v}</div></div>`;
    }).join('')+(d.runnerUp?`<div style="font-size:12px;color:var(--sub);margin-top:8px">第二名「${esc(d.runnerUp.name)}」与你只差 ${d.runnerUp.gap} 分，你的两面性其实很近。</div>`:'');
  }
  if(test.scoringModel==='threshold'){
    const span=d.max+1;
    return `<div class="gauge"><div class="track">${d.bands.map((b,i)=>{
      const w=Math.round((b.max-b.min+1)/span*100);
      const col=i<1?'#8fd3b3':i<2?'#7fc7dd':i<3?'#f4c95d':i<4?'#f0976b':'#e9708b';
      return `<i style="width:${w}%;background:${col}"></i>`;
    }).join('')}</div>
    <div class="mk"><i style="left:calc(${Math.round(d.total/d.max*100)}% - 1px)"></i></div>
    <div class="gauge-lb">${d.bands.map(b=>`<span>${esc(b.name)}</span>`).join('')}</div>
    <div class="gauge-total"><b>${d.total}</b> / ${d.max} 分 · ${esc(d.band.name)}</div></div>`;
  }
  if(test.scoringModel==='dimension'){
    return test.axes.map(a=>{
      const win=d.match[a.key],ps=a.poles;
      const v0=d.tally[a.key][ps[0].key],v1=d.tally[a.key][ps[1].key];
      const pct=win===ps[0].key?10+(v0/(v0+v1))*28:62+(v1/(v0+v1))*28;
      return `<div class="axisrow"><div class="an">${esc(a.name)}</div><div class="line">
        <div class="l" ${win===ps[0].key?'style="color:var(--pri);font-weight:800"':''}>${esc(ps[0].label)} ${v0}</div>
        <div class="mid"><i style="left:calc(${pct}% - 8px)"></i></div>
        <div class="r" ${win===ps[1].key?'style="color:var(--pri);font-weight:800"':''}>${v1} ${esc(ps[1].label)}</div></div></div>`;
    }).join('');
  }
  return '';
}

/* ================= AI 报告（本地模拟生成） ================= */
function buildAi(rec,test,res){
  const d=rec.scoreDetail,info=INFO(rec.testId);
  const echoes=rec.answers.slice(0,10).map((k,i)=>({i,k})).filter(x=>x.i%3===0).slice(0,2).map(x=>{
    const q=test.questions[x.i],o=q.options.find(o=>o.key===x.k);
    return `你在「${q.stem.replace(/[：:？?]$/,'')}」选了「${o.text}」，这透露出${res.name}在这个场景里的本能反应。`;
  });
  let s2='';
  const isPair=rec.mode==='partner_invitee'||(rec.status==='paired'&&d&&d.pairScore!=null);
  if(isPair){
    s2=`你们的契合分 ${d.pairScore}：同频度 ${d.sync}/30（${d.same} 题完全一致），关系温度 ${d.warmth}/30。${(d.divergence||[]).map(x=>'在「'+x.stem+'」上你们视角不同，').join('')}这些差异不是扣分点，而是彼此补位的入口。`;
  }else if(test.scoringModel==='category'&&d.runnerUp){
    s2=`你身上最显眼的是「${res.name}」的一面，但「${d.runnerUp.name}」也只差 ${d.runnerUp.gap} 分——你并不是单一标签的人。${echoes.join('')}`;
  }else if(test.scoringModel==='threshold'&&d.band){
    s2=`你落在「${d.band.name}」区间（${d.total}/${d.max}）。这个位置说明你的倾向已经相当稳定，但区间两端的摇摆空间，正是你可以主动调整的部分。${echoes.join('')}`;
  }else if(test.scoringModel==='dimension'&&d.match){
    const code=test.axes.map(a=>d.match[a.key]).join('');
    s2=`四个维度的取向组合成 ${code}，也就是「${res.name}」。每个维度都不是非黑即白，你的配比决定了同一类型里只属于你的表达方式。${echoes.join('')}`;
  }else{
    s2=echoes.join('');
  }
  const detail=(res.detail||'');
  return {
    headline:(res.summary||res.name).slice(0,20),
    subline:`${info.shortName} · ${nickname()}`,
    sections:[
      {title:'01 核心解读',content:detail.length>150?detail.slice(0,145)+'…':detail},
      {title:'02 你的具体表现',content:s2||echoes.join('')},
      {title:'03 优势，以及可能的代价',content:`你的${(res.traits||[]).slice(0,2).join('、')||'鲜明特质'}让你在熟悉的场景里稳定输出；硬币的另一面是，它在不匹配的环境里也可能变成负担，留意它出现的场合即可。`},
      {title:'04 一条能马上用的建议',content:(res.growthTip||'按自己的节奏来，不必扮演别的样子。')}
    ],
    traits:res.traits||[],
    answerEcho:echoes,
    shareLine:(res.shareCard||`我测出来是「${res.name}」，你呢？`).slice(0,30),
    disclaimer:'本测试为娱乐性质，结果不代表专业心理评估或医学诊断。'
  };
}

function adVerify(rid){
  const rec=C.records.find(r=>r.id===rid);if(!rec)return;
  // 幂等 + 本人同答案缓存复制
  const hash=JSON.stringify(rec.answers);
  const prior=C.records.find(r=>r!==rec&&r.testId===rec.testId&&r.memberSame!==false&&JSON.stringify(r.answers)===hash&&r.ai.status==='ready');
  rec.ai.unlocked=true;rec.ai.status='gen';saveRecords();

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrap(ctx,text,x,y,maxW,lh,maxLines){
  let line='',lines=[];
  for(const ch of text){if(ctx.measureText(line+ch).width>maxW){lines.push(line);line=ch}else line+=ch}
  lines.push(line);
  if(maxLines&&lines.length>maxLines)lines=lines.slice(0,maxLines);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));
  return lines.length*lh;
}
function drawQR(ctx,x,y,size,seed){
  const n=21,c=size/n;let h=hashStr(seed);
  ctx.fillStyle='#fff';rr(ctx,x-8,y-8,size+16,size+16,10);ctx.fill();
  ctx.fillStyle='#1a1a24';
  const rnd=()=>{h=(Math.imul(h^ (h>>>15),2246822507))>>>0;return h/4294967296};
  for(let r=0;r<n;r++)for(let c2=0;c2<n;c2++){if(rnd()>0.52)ctx.fillRect(x+c2*c,y+r*c,c*1.02,c*1.02)}
  const finder=(fx,fy)=>{ctx.fillStyle='#1a1a24';ctx.fillRect(x+fx*c,y+fy*c,7*c,7*c);ctx.fillStyle='#fff';ctx.fillRect(x+(fx+1)*c,y+(fy+1)*c,5*c,5*c);ctx.fillStyle='#1a1a24';ctx.fillRect(x+(fx+2)*c,y+(fy+2)*c,3*c,3*c)};
  finder(0,0);finder(14,0);finder(0,14);
}

function simB(tk){

  $('pg-bwelcome').className='pg on themed th-love-letter';
  $('pg-bwelcome').innerHTML=`<div class="topbar" style="background:linear-gradient(180deg,var(--bg) 70%,transparent)"><button class="tb-back" style="background:var(--card);color:var(--tx)" onclick="CP.openInvite('${tk}')">‹</button><div class="tb-title" style="color:var(--tx)">邀请详情</div></div>
    <div class="invite-card"><div class="hearts">💌</div><h2>${esc(inv.inviterNick)} 邀请你</h2>
    <p>一起完成「你和 TA 的契合度」<br>你们将各自回答同样的 10 道题，<br>提交后一起看到双人契合报告。</p>
    <div style="background:#fff5f8;border-radius:0;padding:12px;font-size:12px;color:#b08293;line-height:1.7;margin:10px 0">🔒 你看不到 TA 的答案，TA 也看不到你的具体选项，结果只展示双方的同频度与分歧话题。</div>
    <button class="btn btn-primary" onclick="CP.bStart('${tk}')">开始作答（我是 TA）</button></div>`;
  go('bwelcome');
}
function bStart(tk){
  C.cur={testId:7,mode:'invitee',inviteToken:tk,variant:'swipe',
    answers:new Array(T(7).questions.length).fill(''),qi:0,revealed:false,from:'invite'};
  renderQuiz();go('quiz');
}

/* ================= 杂项 ================= */
function about(){
  confirmDlg(`<div class="featlist">
  · 50 个测评全量可玩（含 5 个自编衍生版）<br>
  · 8 套主题包：介绍/答题/结果/海报均差异化<br>
  · 答题交互：翻转 / 滑卡 / 一屏滚动 / 对偶二选一 / 抽卡<br>
  · 结果图表：条形分布 / 档位仪表 / 多维轴 / 双人双环<br>
  · 激励视频（模拟）→ AI 四段式报告（本地模拟生成）<br>
  · 同答案重复测评命中缓存；历史可单删/清空<br>
  · #7 契合度支持单人版 + 双人邀请版<br>
  · 三 Tab 导航（首页 / 分类 / 历史），找测评路径更短<br>
  · 顶部用户信息区：预设头像九宫格 + 昵称输入/随机生成<br>
  · 所有数据存于浏览器 localStorage</div>`,
  ()=>{localStorage.removeItem('cp_records');localStorage.removeItem('cp_invites');localStorage.removeItem('cp_profile');C.records=[];C.invites={};renderHome();toast('原型数据已重置')},'重置原型数据');
  $('cfOk').classList.remove('ok');$('cfOk').classList.add('d');
}
