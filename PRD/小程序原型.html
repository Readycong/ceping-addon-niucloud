<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱测评 · 小程序原型 v2.2</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/remixicon/4.5.0/files/fonts/remixicon.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--app:#f6f7fb;--ink:#1c2233;--sub:#8a90a0;--line:#e8eaf2;--brand:#3b5bdb;--brand-soft:#eef1fe}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:radial-gradient(120% 110% at 50% 0%,#3c4257 0%,#232733 48%,#101318 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
body{padding:18px}
.phone{position:relative;width:400px;height:860px;max-height:95vh;background:var(--app);border-radius:0;overflow:hidden;box-shadow:0 40px 110px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);border:12px solid #0c0e15}
.pg{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--app);-webkit-overflow-scrolling:touch;display:none;padding-bottom:122px}
.pg.on{display:block}
.pg::-webkit-scrollbar{display:none}
/* ============ 主题包变量 ============ */
.th-persona-archive{--bg:#141826;--bg2:#0d1020;--card:#1e2538;--pri:#d4af6a;--pri2:#8aa0c8;--acc:#f0d9a8;--tx:#f4eede;--sub:#98a2bd;--line:rgba(212,175,106,.28);--serif:"Songti SC","STSong",serif}
.th-love-letter{--bg:#fff1f5;--bg2:#ffe3ec;--card:#ffffff;--pri:#ef6d8c;--pri2:#ffb2c6;--acc:#ffe0e9;--tx:#5c3845;--sub:#b08293;--line:#ffd9e3}
.th-office-comic{--bg:#ffd93d;--bg2:#ffc700;--card:#fffdf2;--pri:#222222;--pri2:#ff5d2e;--acc:#fff;--tx:#222222;--sub:#777777;--line:#222}
.th-chat-bubble{--bg:#e8f7ee;--bg2:#d5f1e1;--card:#ffffff;--pri:#17b85f;--pri2:#4fc3f7;--acc:#dcf7e7;--tx:#173326;--sub:#6f8a7b;--line:#cdeedd}
.th-wave-healing{--bg:#e8f5fb;--bg2:#cfeaf6;--card:#ffffff;--pri:#2b86b8;--pri2:#6fc0dd;--acc:#d8effa;--tx:#1e3f50;--sub:#6c8fa1;--line:#d2e8f4}
.th-zine-collage{--bg:#f5ede1;--bg2:#efe2cf;--card:#fffdf7;--pri:#e04833;--pri2:#1f1f22;--acc:#f2c230;--tx:#29251f;--sub:#8b7e6e;--line:#e3d6c2}
.th-gallery-aesthetic{--bg:#f1eef5;--bg2:#e3dcef;--card:#fff;--pri:#6f5d9c;--pri2:#a99cc6;--acc:#e7e0f4;--tx:#2b2636;--sub:#7e7690;--line:#ddd4ec}
.th-tarot-night{--bg:#171133;--bg2:#0e0a24;--card:#241a49;--pri:#e7c272;--pri2:#9a7ae0;--acc:#c9a9ff;--tx:#f4ecff;--sub:#a99bd2;--line:rgba(231,194,114,.3)}
.themed{background:var(--bg);color:var(--tx)}
.serif{font-family:var(--serif)}
/* ============ 通用件 ============ */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:16px 18px;background:linear-gradient(180deg,var(--app) 72%,transparent)}
.tb-back{width:40px;height:40px;border-radius:0;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.09);display:flex;align-items:center;justify-content:center;font-size:21px;color:#3c4256;border:none}
.tb-title{font-size:19px;font-weight:800}
.ad{margin:12px 16px;border:2px dashed #e38a8a;background:#fdf0f0;color:#c56565;border-radius:0;height:56px;display:flex;align-items:center;justify-content:center;font-size:13px;gap:8px;flex-shrink:0}
.ad.horizontal{height:48px}
.ad.slot{background:rgba(255,255,255,.5);border-color:rgba(227,138,138,.7)}
.btn{display:block;width:calc(100% - 36px);margin:14px auto 6px;padding:16px;border-radius:0;border:none;font-size:17.5px;font-weight:800;text-align:center;cursor:pointer;box-shadow:0 10px 26px rgba(25,35,80,.14)}
.btn-primary{background:var(--pri);color:var(--card)}
.th-office-comic .btn-primary{border:3px solid #222;box-shadow:4px 4px 0 #222}
.btn-ghost{background:transparent;color:var(--sub);border:2px solid var(--line);font-weight:700;font-size:15px;padding:13px;box-shadow:none}
.btn.dual{width:calc(50% - 22px);display:inline-block;margin:14px 7px}
.chip{display:inline-block;padding:5px 12px;border-radius:0;font-size:12.5px;background:rgba(0,0,0,.05);color:var(--sub);margin:0 6px 8px 0}
.themed .chip{background:rgba(255,255,255,.1);color:var(--sub)}
/* ============ 首页 ============ */
.home-head{padding:22px 20px 12px;background:linear-gradient(180deg,#fff 0%,#f6f7fb 100%)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 0;background:#fff;margin:12px 14px;border-radius:0;padding:18px 6px;box-shadow:0 3px 14px rgba(25,35,70,.05)}
.gi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;cursor:pointer}
.gi .ico{width:56px;height:56px;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.gi span{font-size:13px;font-weight:600;color:#454c60}
.gi em{font-style:normal;font-size:10.5px;color:#a5abba}
.shead{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 10px}
.shead b{font-size:19px;font-weight:800;display:flex;align-items:center}
.shead b::before{content:"";width:5px;height:18px;border-radius:0;background:linear-gradient(180deg,var(--brand),#8aa4ff);margin-right:9px}
.shead span{font-size:13px;color:var(--sub)}
.hotscroll{display:flex;gap:12px;padding:6px 16px 12px;overflow-x:auto}
.hotscroll::-webkit-scrollbar{display:none}
.hotcard{flex:0 0 156px;border-radius:0;padding:16px 14px;color:#fff;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:0 8px 20px rgba(25,35,70,.14)}
.hotcard b{font-size:15.5px;line-height:1.4}
.hotcard i{font-style:normal;font-size:11px;opacity:.9;align-self:flex-start;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:0}
.feed{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 16px}
.tcard{background:#fff;border-radius:0;overflow:hidden;cursor:pointer;box-shadow:0 4px 16px rgba(25,35,70,.07)}
.tcard .cover{height:104px;display:flex;align-items:center;justify-content:center;font-size:42px;position:relative}
.tcard .cover .no{position:absolute;left:10px;top:9px;font-size:11px;font-weight:800;opacity:.55}
.tcard .bd{padding:11px 12px 14px}
.tcard .bd b{font-size:15.5px;line-height:1.4;display:block}
.tcard .bd small{display:block;color:#9aa0b2;font-size:12px;margin-top:6px}
/* ============ 介绍页 ============ */
.intro-hero{margin:12px 16px 0;border-radius:0;padding:30px 24px;position:relative;overflow:hidden;min-height:240px;display:flex;flex-direction:column;justify-content:flex-end}
.themed .intro-hero{background:var(--card)}
.intro-hero .kicker{font-size:12.5px;letter-spacing:4px;opacity:.7;font-weight:800}
.intro-hero h1{font-size:31px;line-height:1.28;margin:10px 0 8px;font-weight:900}
.intro-hero .qmark{position:absolute;right:16px;top:14px;font-size:100px;opacity:.14;line-height:1}
.intro-card{margin:14px 16px;background:#fff;border-radius:0;padding:20px;box-shadow:0 3px 14px rgba(25,35,70,.05)}
.themed .intro-card{background:var(--card);color:var(--tx)}
.meta-row{display:flex;text-align:center;margin:16px 0 6px}
.meta-row div{flex:1}
.meta-row b{display:block;font-size:21px}
.meta-row span{font-size:12.5px;color:var(--sub)}
.meta-row i{width:1px;background:var(--line);display:block}
.intro-card h3{font-size:16.5px;margin:14px 0 8px;font-weight:800}
.intro-card p{font-size:15px;line-height:1.85;color:inherit;opacity:.88}
.note{font-size:13px;line-height:1.75;padding:12px 14px;border-radius:0;background:rgba(240,180,60,.14);color:#a87712;margin:12px 0}
.themed .note{background:rgba(240,200,110,.14);color:var(--acc)}
/* 介绍页主题装饰 */
.th-persona-archive .intro-hero{background:linear-gradient(160deg,#232c47,#141a2e)}
.th-persona-archive .intro-hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 18px,rgba(212,175,106,.07) 18px 19px)}
.th-tarot-night .intro-hero{background:radial-gradient(120% 90% at 80% 0,#3a2a72 0,#241a49 55%,#171133 100%)}
.th-office-comic .intro-hero{border:3px solid #222;box-shadow:7px 7px 0 #222;background:#fffdf2}
.th-love-letter .intro-hero{box-shadow:inset 0 0 0 1px #ffd9e3}
.th-chat-bubble .intro-hero::after{content:"";position:absolute;left:24px;bottom:-12px;width:24px;height:24px;background:var(--card);transform:rotate(45deg)}
/* ============ 答题页 ============ */
.quiz-wrap{padding:8px 18px 12px}
.qprog{display:flex;align-items:center;gap:12px;padding:12px 4px}
.qprog .bar{flex:1;height:8px;border-radius:0;background:rgba(0,0,0,.08);overflow:hidden}
.themed .qprog .bar{background:rgba(255,255,255,.14)}
.qprog .bar i{display:block;height:100%;border-radius:0;background:var(--pri);transition:width .3s}
.qprog span{font-size:13px;color:var(--sub);font-weight:700}
.qcard{background:var(--card);border-radius:0;padding:30px 22px;min-height:320px;position:relative;box-shadow:0 6px 22px rgba(20,30,60,.07)}
.qcard h2{font-size:24px;line-height:1.6;font-weight:800;margin-bottom:24px}
.opt{display:block;width:100%;text-align:left;margin:14px 0;padding:17px 18px;border-radius:0;border:2px solid var(--line);background:transparent;color:var(--tx);font-size:16.5px;line-height:1.55;cursor:pointer;transition:all .18s}
.opt .k{display:inline-flex;width:28px;height:28px;border-radius:0;border:2px solid var(--sub);color:var(--sub);align-items:center;justify-content:center;font-size:13.5px;margin-right:12px;flex-shrink:0}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card));font-weight:700}
.opt.sel .k{background:var(--pri);color:var(--card);border-color:var(--pri)}
.th-office-comic .opt{border:2.5px solid #222;box-shadow:3px 3px 0 #222;border-radius:0}
.th-office-comic .opt.sel{background:#ffd93d;transform:translate(1px,1px);box-shadow:2px 2px 0 #222}
.th-chat-bubble .opt{border-radius:0;border:none;background:var(--acc)}
.th-chat-bubble .opt.sel{background:var(--pri);color:#fff}
.th-chat-bubble .opt.sel .k{background:#fff;color:var(--pri)}
.q-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.q-foot .prev{background:none;border:none;color:var(--sub);font-size:15px;padding:10px}
/* flip / swipe 动效 */
.anim-flip .qcard{animation:flipIn .32s ease}
@keyframes flipIn{from{transform:perspective(800px) rotateY(55deg);opacity:0}to{transform:none;opacity:1}}
.anim-slide .qcard{animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(70px);opacity:0}to{transform:none;opacity:1}}
/* 抽卡 */
.draw-stage{display:flex;flex-direction:column;align-items:center;padding-top:26px}
.tarot-card{width:250px;height:368px;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:58px;cursor:pointer;position:relative;transition:transform .5s}
.tarot-back{background:repeating-linear-gradient(45deg,#2c2158 0 12px,#241a49 12px 24px);border:2px solid var(--pri);color:var(--pri);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.tarot-back::after{content:"✦";position:absolute;font-size:100px;opacity:.5}
.tarot-reveal{animation:tarotFlip .55s ease}
@keyframes tarotFlip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
/* 对偶二选一 */
.dual-axis{text-align:center;font-size:14px;color:var(--sub);margin:8px 0 16px;letter-spacing:2px}
.dual-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dual-col{border-radius:0;padding:16px 12px;text-align:center;font-weight:800;font-size:15.5px;border:2px solid var(--line)}
.dual-col .pole{margin-bottom:12px;color:var(--pri2)}
.dual-col .opt{margin:9px 0;padding:14px 10px;font-size:15px;text-align:center;border-radius:0}
.dual-col .opt .k{display:none}
/* 一屏多题滚动 */
.scroll-q{background:var(--card);border-radius:0;padding:20px;margin:0 0 14px}
.scroll-q .qn{font-size:13px;color:var(--pri);font-weight:800;margin-bottom:10px}
.scroll-q h4{font-size:17.5px;line-height:1.6;margin-bottom:12px;font-weight:700}
.scroll-q .opt{margin:9px 0;padding:14px;font-size:15.5px}
.submit-bar{position:sticky;bottom:0;background:linear-gradient(0deg,var(--bg) 70%,transparent);padding:14px 0 6px}
/* ============ 结果页 ============ */
.res-hero{margin:10px 16px 0;border-radius:0;padding:32px 24px;background:var(--card);position:relative;overflow:hidden;text-align:center;box-shadow:0 6px 22px rgba(20,30,60,.07)}
.res-hero .rkicker{font-size:12.5px;letter-spacing:4px;opacity:.65;font-weight:700}
.res-hero h1{font-size:34px;font-weight:900;margin:12px 0 10px;line-height:1.28}
.res-hero p{font-size:15.5px;line-height:1.75;opacity:.88}
.res-hero .bigico{font-size:68px;margin-bottom:8px}
.reveal-pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.th-tarot-night .res-hero{box-shadow:0 0 60px rgba(154,122,224,.35) inset}
.chart-card,.res-card{margin:14px 16px;background:#fff;border-radius:0;padding:20px 22px;box-shadow:0 3px 14px rgba(25,35,70,.05)}
.themed .chart-card,.themed .res-card{background:var(--card);color:var(--tx);box-shadow:none}
.chart-card h3,.res-card h3{font-size:16.5px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.res-card p{font-size:15.5px;line-height:1.9;opacity:.9}
.traits{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.traits span{padding:7px 16px;border-radius:0;font-size:14px;background:color-mix(in srgb,var(--pri) 14%,var(--card));color:var(--pri);border:1px solid color-mix(in srgb,var(--pri) 35%,transparent);font-weight:700}
.growth{margin-top:14px;padding:14px 16px;border-radius:0;background:color-mix(in srgb,var(--pri) 8%,var(--card));font-size:15px;line-height:1.8}
/* 条形图 */
.barrow{display:flex;align-items:center;gap:12px;margin:11px 0;font-size:14px}
.barrow .nm{width:80px;text-align:right;flex-shrink:0;opacity:.85}
.barrow .tk{flex:1;height:15px;border-radius:0;background:rgba(128,128,128,.13);overflow:hidden}
.barrow .tk i{display:block;height:100%;border-radius:0;background:var(--pri2);transition:width .6s}
.barrow.win .tk i{background:var(--pri)}
.barrow .vv{width:26px;font-weight:800}
/* 档位仪表 */
.gauge{margin:16px 4px 8px}
.gauge .track{display:flex;height:18px;border-radius:0;overflow:hidden;border:1px solid var(--line)}
.gauge .track i{display:block;height:100%}
.gauge .mk{position:relative;height:0}
.gauge .mk i{position:absolute;top:-10px;width:2px;height:34px;background:var(--ink)}
.themed .gauge .mk i{background:var(--acc)}
.gauge-lb{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:10px}
.gauge-total{text-align:center;font-size:14px;margin-top:12px;color:var(--sub)}
.gauge-total b{font-size:30px;color:var(--pri)}
/* 多维轴 */
.axisrow{margin:16px 0}
.axisrow .an{font-size:13px;color:var(--sub);margin-bottom:8px;text-align:center}
.axisrow .line{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:9px;font-size:14px}
.axisrow .line .l{text-align:right;opacity:.8}
.axisrow .line .r{opacity:.8}
.axisrow .mid{position:relative;height:9px;border-radius:0;background:rgba(128,128,128,.15)}
.axisrow .mid i{position:absolute;top:-4.5px;width:18px;height:18px;border-radius:0;background:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 25%,transparent)}
/* 双环 */
.rings{display:flex;align-items:center;justify-content:center;gap:20px;margin:10px 0}
.ring{width:132px;height:132px;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:34px;line-height:1}
.ring span{font-size:12px;opacity:.8;margin-top:4px}
.ring.small{width:84px;height:84px}
.ring.small b{font-size:21px}
.divlist{margin-top:12px}
.divlist div{font-size:14.5px;line-height:1.75;padding:10px 14px;background:rgba(128,128,128,.07);border-radius:0;margin:7px 0}
/* AI 区 */
.ai-mask{margin:14px 16px;border-radius:0;padding:30px 22px;text-align:center;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(130deg,#3b2f7a,#6d4fb8 55%,#b46ad1)}
.ai-mask .spark{font-size:38px}
.ai-mask h4{margin:10px 0 8px;font-size:19px}
.ai-mask p{font-size:14px;line-height:1.75;opacity:.85;margin-bottom:16px}
.ai-mask .watch{background:#fff;color:#5b3aa0;border:none;padding:14px 30px;border-radius:0;font-size:16px;font-weight:800}
.ai-gen{display:flex;gap:10px;align-items:center;font-size:14px;justify-content:center;padding:10px;color:#7d62c9}
.spinner{width:18px;height:18px;border:3px solid #d9ccf5;border-top-color:#7a55d6;border-radius:0;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-body .sec{margin:16px 0}
.ai-body .sec h5{font-size:15px;margin-bottom:8px;color:#7a55d6}
.ai-body .sec p{font-size:15.5px;line-height:1.95;color:var(--ink)}
.themed .ai-body .sec p{color:var(--tx)}
.ai-echo{background:#f6f2ff;border-radius:0;padding:12px 14px;font-size:14.5px;line-height:1.75;color:#6c52ad;margin:8px 0}
.cached-tip{font-size:12px;color:#9aa0b2;text-align:center;margin-top:8px}
/* ============ 海报页 ============ */
.poster-stage{padding:22px 16px 8px;display:flex;flex-direction:column;align-items:center}
.poster-stage canvas{width:300px;height:533px;border-radius:0;box-shadow:0 18px 44px rgba(15,20,50,.3);background:#fff}
.poster-tip{font-size:13px;color:var(--sub);margin-top:12px}
a.dl{text-decoration:none;background:#0fae66;color:#fff;padding:14px 34px;border-radius:0;font-size:16px;font-weight:800;margin-top:14px;display:inline-block;box-shadow:0 8px 22px rgba(15,174,102,.3)}
/* ============ 历史 ============ */
.his-head{padding:22px 20px 6px;display:flex;justify-content:space-between;align-items:center}
.his-head b{font-size:25px;font-weight:900}
.his-head button{background:none;border:2px solid #ffb9b9;color:#e26363;border-radius:0;font-size:13px;padding:7px 16px;font-weight:600}
.his-item{background:#fff;border-radius:0;margin:12px 16px;padding:16px 18px;display:flex;gap:14px;align-items:center;cursor:pointer;position:relative;box-shadow:0 3px 14px rgba(25,35,70,.06)}
.his-item .bar{width:6px;align-self:stretch;border-radius:0}
.his-item .info{flex:1;min-width:0}
.his-item .info b{font-size:17px;display:block}
.his-item .info span{font-size:13.5px;color:#98a0ae;display:block;margin-top:5px}
.his-item .info .tags{margin-top:7px;display:flex;gap:7px}
.his-item .info .tags i{font-style:normal;font-size:11.5px;padding:3px 10px;border-radius:0;background:#f1f3f8;color:#7a839a}
.his-item .del{width:34px;height:34px;border-radius:0;border:none;background:#fdeeee;color:#e36b6b;font-size:16px;flex-shrink:0}
.empty{text-align:center;padding:100px 30px;color:#a8aebb}
.empty .eico{font-size:64px;margin-bottom:16px}
.empty p{font-size:14.5px;line-height:1.8;margin-bottom:20px}
.empty button{background:var(--brand);color:#fff;border:none;padding:13px 32px;border-radius:0;font-size:15.5px;font-weight:700;box-shadow:0 8px 22px rgba(59,91,219,.3)}
/* ============ 双人邀请 ============ */
.invite-card{margin:14px 16px;background:#fff;border-radius:0;padding:28px 22px;text-align:center;box-shadow:0 4px 18px rgba(25,35,70,.06)}
.invite-card .hearts{font-size:52px}
.invite-card h2{font-size:23px;margin:14px 0 10px;font-weight:900}
.invite-card p{font-size:15px;line-height:1.85;color:#666}
.fakeqr{width:184px;height:184px;margin:18px auto 10px;border-radius:0;border:9px solid #fff;box-shadow:0 8px 26px rgba(0,0,0,.13)}

<script>
const DATA = {"cats":[{"name":"人格认知","ico":"🧠","theme":"persona-archive"},{"name":"情感关系","ico":"💗","theme":"love-letter"},{"name":"职场成长","ico":"💼","theme":"office-comic"},{"name":"社交人际","ico":"👥","theme":"chat-bubble"},{"name":"情绪状态","ico":"🌊","theme":"wave-healing"},{"name":"生活消费","ico":"🛍️","theme":"zine-collage"},{"name":"兴趣审美","ico":"🎨","theme":"gallery-aesthetic"},{"name":"玄学脑洞","ico":"🔮","theme":"tarot-night"}],"hot":[5,9,11,7,2,24,1,50],"info":[{"id":1,"shortName":"MBTI 16型人格","cat":"人格认知","theme":"persona-archive","tags":["人格","社交货币","最强裂变","双人可玩"],"qc":12,"rc":16,"est":2,"desc":"MBTI 依据荣格心理类型理论，用四个维度把人格分成 16 种类型：能量指向（E/I）、信息获取（S/N）、决策方式（T/F）、生活态度（J/P）。它是全球流传最广的人格分类语言，也是社交平台上最强的自我标签之一。","model":"dimension"},{"id":2,"shortName":"恋爱依恋类型","cat":"情感关系","theme":"love-letter","tags":["恋爱","依恋","关系模式","双人可玩"],"qc":8,"rc":4,"est":2,"desc":"从亲密关系中的安全感需求与距离偏好两个方向，看看你更常用哪种恋爱相处模式。结果适合自我观察，也可以和伴侣互测聊聊。","model":"dimension"},{"id":3,"shortName":"灵魂色彩","cat":"人格认知","theme":"persona-archive","tags":["人格","视觉","色彩卡片","易晒"],"qc":6,"rc":4,"est":3,"desc":"四色人格把人的核心气质分成四种颜色：蓝（情感与意义）、金（秩序与责任）、橙（行动与自由）、绿（分析与独立）。每个人都是四色的混合，只是配比与主导色不同。色彩卡片天然适合生成可晒的视觉结果。","model":"category"},{"id":4,"shortName":"前世身份","cat":"玄学脑洞","theme":"tarot-night","tags":["玄学","脑洞","古风","趣味身份"],"qc":12,"rc":6,"est":3,"desc":"把你的日常偏好投进一台古风时光机，看看哪种前世身份最像你的隐藏设定。纯属娱乐，主打一个有画面感。","model":"category"},{"id":5,"shortName":"职场人设","cat":"职场成长","theme":"office-comic","tags":["职场","打工人","办公室","人设"],"qc":10,"rc":5,"est":2,"desc":"从会议、群聊、午休到下班倒计时，鉴定你在办公室里最稳定输出的那套人设。没有好坏，只有打工姿势不同。","model":"category"},{"id":6,"shortName":"气质香调","cat":"兴趣审美","theme":"gallery-aesthetic","tags":["香水","审美","气质","氛围感"],"qc":8,"rc":4,"est":2,"desc":"从天气、穿搭、空间和日常偏好中提取你的氛围关键词，匹配一种最像你的气质香调。","model":"category"},{"id":7,"shortName":"双人契合度","cat":"情感关系","theme":"love-letter","tags":["恋爱","默契","契合度","双人"],"qc":10,"rc":4,"est":3,"desc":"从沟通、分享、冲突处理、共同体验与未来感几个场景，看看你和 TA 当前的相处默契落在哪一档。","model":"threshold"},{"id":8,"shortName":"心态段位","cat":"情绪状态","theme":"wave-healing","tags":["心态","段位","日常","趣味"],"qc":8,"rc":4,"est":2,"desc":"用外卖迟到、临时改需求、排队堵车等日常小副本，看看你的心态恢复力目前是什么趣味段位。","model":"threshold"},{"id":9,"shortName":"朋友圈人设","cat":"社交人际","theme":"chat-bubble","tags":["朋友圈","社交","人设","内容偏好"],"qc":10,"rc":5,"est":2,"desc":"从九宫格、定位、配文到发布频率，看看你的朋友圈最稳定输出哪一种互联网人设。","model":"category"},{"id":10,"shortName":"内在小孩类型","cat":"人格认知","theme":"persona-archive","tags":["内在小孩","自我观察","成长","趣味分类"],"qc":10,"rc":5,"est":3,"desc":"用轻松的生活场景观察你心里那个“小小的自己”更常以哪种方式出现，结果用于自我理解与趣味表达。","model":"category"},{"id":11,"shortName":"恋爱脑等级","cat":"情感关系","theme":"love-letter","tags":["恋爱","恋爱脑","上头","趣味等级"],"qc":10,"rc":5,"est":2,"desc":"从回消息、改计划、礼物预算和朋友圈互动等恋爱日常，测测你的“上头浓度”目前落在哪一档。","model":"threshold"},{"id":12,"shortName":"九型人格","cat":"人格认知","theme":"persona-archive","tags":["人格","经典","社交货币","深度向"],"qc":12,"rc":9,"est":4,"desc":"九型人格按「核心动机与核心恐惧」把人分成九种类型：1 完美型、2 助人型、3 成就型、4 艺术型、5 理智型、6 忠诚型、7 活跃型、8 领袖型、9 和平型。它比其他分类更关注「你为什么这么做」，而不只是「你做了什么」。","model":"category"},{"id":13,"shortName":"拖延症流派","cat":"职场成长","theme":"office-comic","tags":["拖延","自我成长","效率","打工人","时间管理"],"qc":10,"rc":5,"est":2,"desc":"同样是拖，有人拖在完美主义，有人拖在不敢开始，还有人专门等到最后一刻才上线手感。测出你的拖延流派，顺便带走一份能立刻用的破解法。","model":"category"},{"id":14,"shortName":"今日运势","cat":"玄学脑洞","theme":"tarot-night","tags":["玄学","运势","幸运色","幸运数字","每日"],"qc":10,"rc":5,"est":2,"desc":"从起床状态、外卖手气到睡前心情，给今天算一笔流水账，顺带领取你的专属幸运色和幸运数字。玄学仅供娱乐，好运还得靠自己出门。","model":"category"},{"id":15,"shortName":"朋友类型","cat":"社交人际","theme":"chat-bubble","tags":["社交","朋友","朋友圈","人设","聚会"],"qc":10,"rc":5,"est":2,"desc":"在朋友圈里，总有一个位置是非你莫属的：有人负责组局，有人负责接住深夜的情绪，有人负责把群聊盘活。十道题，测出你在友谊里的固定工位。","model":"category"},{"id":16,"shortName":"抗压体质","cat":"情绪状态","theme":"wave-healing","tags":["抗压","韧性","职场","情绪","打工人"],"qc":10,"rc":4,"est":2,"desc":"同样是被甲方改稿、被临时插单、被周一早会砸中，有人当场弹回来，有人要缓三天。测测你属于哪种抗压体质：橡皮人、玻璃人、弹簧人还是海绵人。纯属娱乐，别给自己贴标签。","model":"category"},{"id":17,"shortName":"审美人格","cat":"兴趣审美","theme":"gallery-aesthetic","tags":["审美","穿搭","风格","生活方式","品味"],"qc":10,"rc":5,"est":2,"desc":"从衣柜、手机壳到朋友圈的构图，你的审美其实早就有固定答案了。十道题，测出你属于哪一种风格人格，顺便看看你的审美基因长什么样。","model":"category"},{"id":18,"shortName":"决策风格","cat":"人格认知","theme":"persona-archive","tags":["决策","职场","思维方式","选择困难","效率"],"qc":10,"rc":5,"est":2,"desc":"从点外卖到换工作，每个人按下决定的方式都不一样：有人列 Excel，有人凭第六感，有人等别人先表态。十道题，测出你的决策风格属于哪一派。","model":"category"},{"id":19,"shortName":"孤独感画像","cat":"情绪状态","theme":"wave-healing","tags":["孤独","独处","情绪","社交","自我观察"],"qc":10,"rc":4,"est":2,"desc":"独处不等于孤独，热闹也不等于不孤独。十道题，看看你现在的社交状态更像哪一幅画：是自得其乐，还是偶尔空落，还是正悄悄等着谁来敲门。结果仅供娱乐参考。","model":"threshold"},{"id":20,"shortName":"重启力等级","cat":"职场成长","theme":"office-comic","tags":["重启力","反脆弱","韧性","自我成长","恢复力"],"qc":10,"rc":4,"est":2,"desc":"被生活按在地上摩擦之后，有人要缓三个月，有人第二天就满血上线，还有人被打一拳反而长出新肌肉。十道题，测测你的重启力等级，看看你离“反脆弱”还有几步。","model":"threshold"},{"id":21,"shortName":"网络人设","cat":"社交人际","theme":"chat-bubble","tags":["网络","冲浪","评论区","表情包","社交"],"qc":10,"rc":5,"est":2,"desc":"从热点吃到深夜，从潜水到舌战评论区，每个网民都有自己在网上的固定工位。十道题，鉴定你的网络人设：冲浪达人、潜水员、树洞君、表情包战士还是评论区战神。","model":"category"},{"id":22,"shortName":"躺平指数","cat":"职场成长","theme":"office-comic","tags":["躺平","内卷","打工人","反内耗","生活方式"],"qc":10,"rc":4,"est":2,"desc":"从群消息、加班、待办清单到周末作息，测一测你目前的躺平浓度落在哪一档。躺平不是摆烂，很多时候只是把力气收回来的一种选择。","model":"threshold"},{"id":23,"shortName":"恋人类型","cat":"情感关系","theme":"love-letter","tags":["恋爱","亲密关系","依恋","爱情三元论","情感"],"qc":10,"rc":5,"est":3,"desc":"同样是谈恋爱，有人把日子过成偶像剧，有人把关系经营成合伙制。从回应方式、吵架现场到未来规划，看看你在亲密关系里最稳定的那套打法。","model":"category"},{"id":24,"shortName":"消费人格","cat":"生活消费","theme":"zine-collage","tags":["消费","剁手","双十一","省钱","生活方式"],"qc":10,"rc":5,"est":2,"desc":"从双十一、外卖、衣柜到工资到账那一刻，看清你的钱到底为什么花出去。五种消费人格，没有对错，只有花钱姿势不同。","model":"category"},{"id":25,"shortName":"旅行人格","cat":"生活消费","theme":"zine-collage","tags":["旅行","小长假","特种兵","打卡","生活方式"],"qc":10,"rc":5,"est":2,"desc":"同样是三天小长假，有人日均两万步打卡八个点，有人在酒店阳台坐到日落。测测你是哪种旅行人格，下次出门前先把队友选对。","model":"category"},{"id":26,"shortName":"睡眠类型","cat":"情绪状态","theme":"wave-healing","tags":["睡眠","作息","晨型","夜型","趣味"],"qc":10,"rc":4,"est":2,"desc":"有人天亮就精神，有人凌晨才上线。这是一份纯娱乐的作息偏好测试，看看你更接近云雀、猫头鹰，还是介于两者之间。它只描述你的日常节奏，不评价睡眠质量，也不作任何判断。","model":"category"},{"id":27,"shortName":"火锅性格","cat":"生活消费","theme":"zine-collage","tags":["火锅","川渝","蘸料","麻酱","美食地域梗"],"qc":10,"rc":5,"est":2,"desc":"一口锅能测出一个人的性格：锅底、涮法、蘸料，全是立场问题。你是牛油九宫格派，还是麻酱至上的铜锅党？测完记得约上相反类型的人一起吃鸳鸯锅。","model":"category"},{"id":28,"shortName":"饮品人格","cat":"生活消费","theme":"zine-collage","tags":["饮品","咖啡","奶茶","喝茶","打工人"],"qc":10,"rc":4,"est":2,"desc":"咖啡、茶、奶茶还是白开水——你手里那杯东西，基本写明了你是怎么过一天的。四杯见人格，测完看看你办公室里的队友都是哪一派。","model":"category"},{"id":29,"shortName":"猫狗主人人格","cat":"生活消费","theme":"zine-collage","tags":["宠物","猫系","狗系","云吸","铲屎官"],"qc":10,"rc":4,"est":2,"desc":"猫系、狗系、猫狗双全，还是靠刷视频云吸过日子？从相册、遛弯、拆家现场到你给它的定位，看看你和毛孩子之间的关系到底是哪一型。没养宠也能测，云吸派同样有姓名。","model":"category"},{"id":30,"shortName":"二次元浓度","cat":"兴趣审美","theme":"gallery-aesthetic","tags":["二次元","追番","圈层","手办","兴趣爱好"],"qc":10,"rc":5,"est":2,"desc":"从追番、壁纸、周边的钱包出血量，到输入法里有没有特殊词库，测测你的二次元浓度落在哪一档。圈内人自测图一乐，圈外人也能看懂个热闹。","model":"threshold"},{"id":31,"shortName":"知识焦虑等级","cat":"职场成长","theme":"office-comic","tags":["知识焦虑","囤课","自我提升","网课","收藏夹"],"qc":10,"rc":4,"est":2,"desc":"从收藏夹、网盘、通勤十五分钟到深夜刷到转行帖，测一测你的「知识焦虑浓度」落在哪一档。买课不是错，只是有些课可能永远停在第一集。","model":"threshold"},{"id":32,"shortName":"社恐社牛程度","cat":"社交人际","theme":"chat-bubble","tags":["社恐","社牛","社交","电量","聚会"],"qc":10,"rc":5,"est":2,"desc":"从电梯遇到半熟同事、陌生电话、团建上台到聚会散场，测一测你的社交电量到底是多少格。社恐和社牛只是充电方式不同，没有高低之分。","model":"threshold"},{"id":33,"shortName":"emo 频率","cat":"情绪状态","theme":"wave-healing","tags":["emo","情绪","治愈","深夜","充电"],"qc":10,"rc":4,"est":2,"desc":"从深夜刷手机、单曲循环到发完又秒删的动态，测一测你的 emo 来得有多勤，以及哪一种治愈方式最适合你。情绪掉电很正常，找到充电口更重要。","model":"threshold"},{"id":34,"shortName":"人生BGM","cat":"兴趣审美","theme":"gallery-aesthetic","tags":["音乐","BGM","脑洞","氛围感","歌单"],"qc":10,"rc":5,"est":2,"desc":"如果人生是一部电影，总得有条配乐。从清晨闹钟、通勤地铁到周末深夜，测一测你的专属 BGM 属于哪一种曲风。","model":"category"},{"id":35,"shortName":"幸运守护兽","cat":"玄学脑洞","theme":"tarot-night","tags":["玄学","守护兽","瑞兽","运势","脑洞"],"qc":12,"rc":6,"est":3,"desc":"白虎、青龙、朱雀、玄武、麒麟、白泽，六只瑞兽各守一种气质。从你面对麻烦、选择朋友到发朋友圈的习惯，看看哪一只正在默默给你撑腰。纯属娱乐，图个好彩头。","model":"category"},{"id":36,"shortName":"时间人格","cat":"职场成长","theme":"office-comic","tags":["时间管理","拖延","作息","效率","chronotype"],"qc":10,"rc":4,"est":2,"desc":"从闹钟、待办清单、周末作息到截止日前的那三天，看看你和时间到底是什么关系。有人把时间切成块，有人和时间谈恋爱，也有人一直跟它躲猫猫。","model":"category"},{"id":37,"shortName":"吵架风格","cat":"情感关系","theme":"love-letter","tags":["关系","职场","共鸣","实用向"],"qc":10,"rc":5,"est":3,"desc":"TKI 用两个维度描述人在冲突中的反应：你有多想坚持自己（坚持度），以及你有多想顾及对方（合作度）。两轴交叉出五种典型模式：竞争、协作、妥协、回避、迁就。没有哪一种绝对更好，关键是你是否知道自己在用哪一种。","model":"category"},{"id":38,"shortName":"饭局人格","cat":"社交人际","theme":"chat-bubble","tags":["饭局","聚餐","社交","职场","中国人情"],"qc":10,"rc":5,"est":2,"desc":"从点菜、敬酒、转桌到散场，饭局是中国人最微妙的社交场。测一测你在饭桌上最稳定的生存姿势是哪一种。","model":"category"},{"id":39,"shortName":"毕业生存图鉴","cat":"职场成长","theme":"office-comic","tags":["毕业","考研","考公","求职","gap year"],"qc":10,"rc":5,"est":2,"desc":"毕业季一到，人生选项突然变多：考研、考公、搞钱、gap、出国。从你的焦虑来源、时间分配到深夜搜索记录，看看你属于哪一本生存图鉴。哪条路都不容易，选了就先走稳。","model":"category"},{"id":40,"shortName":"松弛感等级","cat":"情绪状态","theme":"wave-healing","tags":["松弛感","反内耗","生活方式","打工人","自我成长"],"qc":10,"rc":4,"est":2,"desc":"松弛感不是躺平，是事情来了也不把自己绷断。从突发状况、别人的评价到周末安排，测一测你的松弛浓度落在哪一档。","model":"threshold"},{"id":41,"shortName":"信息茧房类型","cat":"社交人际","theme":"chat-bubble","tags":["信息茧房","算法推荐","刷短视频","热搜","认知习惯"],"qc":10,"rc":5,"est":2,"desc":"每天刷到的内容，其实早就悄悄划分了你的信息口味。10 道题鉴定你被困在哪一层茧里：是算法把你养得舒服，还是你自己主动剪开了一个口子。","model":"category"},{"id":42,"shortName":"星际人格","cat":"兴趣审美","theme":"gallery-aesthetic","tags":["脑洞","外星人","星际","人设","趣味"],"qc":10,"rc":5,"est":2,"desc":"如果地球只是你的暂住证，你老家究竟在哪片星区？10 道题给你安排一个外星种族身份，附赠族徽性格、舱室审美和社交方式。科学含量为 0，快乐含量拉满。","model":"category"},{"id":43,"shortName":"理财脑回路","cat":"生活消费","theme":"zine-collage","tags":["消费观","存钱","打工人","记账","金钱态度"],"qc":10,"rc":4,"est":2,"desc":"同样是一笔钱，有人先存起来，有人先花掉，有人先算三遍。10 道题鉴定你的金钱脑回路属于哪一派：储蓄、投机、月光还是精算。这里没有任何投资建议，只有花钱姿势的自我介绍。","model":"category"},{"id":44,"shortName":"运动人格","cat":"生活消费","theme":"zine-collage","tags":["运动","健身","办卡","躺平","朋友圈"],"qc":10,"rc":4,"est":2,"desc":"有人练到膝盖有话说，有人办卡即运动，有人把瑜伽垫铺成了防滑垫。10 道题鉴定你的运动人设，看看你和运动之间，到底是谁先动了心。","model":"category"},{"id":45,"shortName":"追剧人格","cat":"生活消费","theme":"zine-collage","tags":["追剧","倍速","片单","弃剧","会员"],"qc":10,"rc":4,"est":2,"desc":"同样一部剧，有人一晚上刷完，有人看十分钟就弃，有人收藏了两年还没点开。10 道题鉴定你的追剧人格：倍速党、沉浸党、弃剧王还是囤剧党。","model":"category"},{"id":46,"shortName":"团队角色","cat":"职场成长","theme":"office-comic","tags":["职场","团队","自我认知","转发向"],"qc":10,"rc":9,"est":5,"desc":"贝尔宾认为，高效团队不是由「最优秀的人」组成，而是由「角色互补的人」组成。他把团队成员分为九种角色：协调者、推动者、创新者、资源调查者、监控评估者、团队工作者、执行者、完成者、专家。每种角色都有其贡献，也有被允许的弱点。","model":"category"},{"id":47,"shortName":"讨好人格指数","cat":"情感关系","theme":"love-letter","tags":["人际","拒绝","老好人","边界感","打工人"],"qc":10,"rc":4,"est":2,"desc":"「都行」「我来吧」「没事没事」——这些话你说过多少遍？10 道题测一测你在人际关系里的迁就指数。纯属娱乐自查，用来认识自己的相处习惯，不用于任何判断。","model":"threshold"},{"id":48,"shortName":"好奇心人格","cat":"人格认知","theme":"persona-archive","tags":["好奇心","探索","开放性","自我成长","新鲜感"],"qc":10,"rc":4,"est":2,"desc":"同样是周末、同样是一条路、同样一个陌生词，有人照旧，有人绕路，有人当场搜索半小时。10 道题测测你的好奇心浓度，看看你属于安稳守成还是探索狂人。","model":"threshold"},{"id":49,"shortName":"手机依赖人格","cat":"生活消费","theme":"zine-collage","tags":["手机","刷短视频","屏幕时间","微信","打工人"],"qc":10,"rc":4,"est":2,"desc":"一天里你拿起手机多少次？电量低于 20% 时心跳有没有加速？10 道题娱乐化测一测你和手机的黏合度。纯属自嘲向盘点，不是任何形式的评估。","model":"threshold"},{"id":50,"shortName":"年度关键词","cat":"玄学脑洞","theme":"tarot-night","tags":["年终总结","年度关键词","朋友圈","仪式感","梗"],"qc":12,"rc":8,"est":3,"desc":"又到了写年终总结的时候。12 道题帮你从一堆混乱的日常里，捞出那个最贴切的年度关键词：重启、沉淀、破局、治愈、折腾、稳定、断舍离，还是出发？","model":"category"}],"tests":{"1":{"id":1,"title":"【商业版权·原题参考】16型人格速测（MBTI 精简版）","shortName":"MBTI 16型人格","category":"人格","tags":["人格","社交货币","最强裂变","双人可玩"],"copyrightStatus":"commercial","entertainment":true,"status":"pending_rederive","compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性人格分类，结果不代表任何心理评估或医学诊断，不作为职业或临床依据。","minorProtected":false},"source":{"theory":"Myers-Briggs Type Indicator（MBTI），I.B. Myers 与 K.C. Briggs 编制，理论源自 C.G. Jung《心理类型》","officialOwner":"The Myers-Briggs Company（原 CPP, Inc.）","sourceType":"commercial","licensing":"官方 Step I（93题）/ Step II（144题）及各类短表均由 The Myers-Briggs Company 授权发行；中国大陆有正版代理与认证施测师体系，商用须付费授权并持证施测。","verbatimNote":"官方逐字题面为专有资产，本文件所载为基于公开资料还原的代表性样题（对偶偏好题形式），非官方逐字原文；若需逐字商用须获授权。"},"description":"MBTI 依据荣格心理类型理论，用四个维度把人格分成 16 种类型：能量指向（E/I）、信息获取（S/N）、决策方式（T/F）、生活态度（J/P）。它是全球流传最广的人格分类语言，也是社交平台上最强的自我标签之一。","instructions":"共 12 题，每题两个陈述选更像你的一个，凭第一直觉作答，无对错之分，约 2 分钟。","estimatedMinutes":2,"questionCount":12,"scoringModel":"dimension","axes":[{"key":"EI","name":"能量指向","poles":[{"key":"E","label":"外向 E"},{"key":"I","label":"内向 I"}]},{"key":"SN","name":"信息获取","poles":[{"key":"S","label":"实感 S"},{"key":"N","label":"直觉 N"}]},{"key":"TF","name":"决策方式","poles":[{"key":"T","label":"思考 T"},{"key":"F","label":"情感 F"}]},{"key":"JP","name":"生活态度","poles":[{"key":"J","label":"判断 J"},{"key":"P","label":"知觉 P"}]}],"tieBreak":"某轴平票时默认取第二个 pole（如 EI 平票取 I）。","originalItemBank":{"structure":"官方 MBTI Step I 为 93 题对偶偏好题（forced choice），Step II 为 144 题；市面上另有 28 题、16 题等非官方短表。正版施测需认证施测师解读。","itemForm":"对偶偏好题：每题给出两个陈述，选更符合自己的一个；部分题形式为词对二选一。","note":"以下为还原的代表性样题（中文），用于理解原题出题逻辑与四个维度的操作化方式，非官方逐字原文。","items":[{"no":1,"stem":"在聚会中，你通常","options":[{"key":"A","text":"与许多人交谈，包括陌生人","maps":"EI/E"},{"key":"B","text":"只与少数几个熟悉的人深聊","maps":"EI/I"}]},{"no":2,"stem":"忙碌一周之后，你更想","options":[{"key":"A","text":"找人聚聚、聊聊天来充电","maps":"EI/E"},{"key":"B","text":"独处安静待着来恢复","maps":"EI/I"}]},{"no":3,"stem":"你的思考方式更像","options":[{"key":"A","text":"边说边想，说出来才清楚","maps":"EI/E"},{"key":"B","text":"想清楚了再说出口","maps":"EI/I"}]},{"no":4,"stem":"你更相信哪一类信息","options":[{"key":"A","text":"看得见、摸得着的事实与细节","maps":"SN/S"},{"key":"B","text":"直觉、灵感与背后的可能性","maps":"SN/N"}]},{"no":5,"stem":"学一样新东西时，你偏好","options":[{"key":"A","text":"按步骤边做边学","maps":"SN/S"},{"key":"B","text":"先弄懂原理和整体框架","maps":"SN/N"}]},{"no":6,"stem":"更容易说服你的是","options":[{"key":"A","text":"过往的实际经验","maps":"SN/S"},{"key":"B","text":"一个让人兴奋的新点子","maps":"SN/N"}]},{"no":7,"stem":"做一个决定时你更看重","options":[{"key":"A","text":"逻辑是否成立、是否公平","maps":"TF/T"},{"key":"B","text":"会不会伤到相关的人","maps":"TF/F"}]},{"no":8,"stem":"被别人评价时，你更在意","options":[{"key":"A","text":"他说得对不对","maps":"TF/T"},{"key":"B","text":"他说得会不会伤人","maps":"TF/F"}]},{"no":9,"stem":"你觉得自己更像","options":[{"key":"A","text":"讲原则、对事不对人的人","maps":"TF/T"},{"key":"B","text":"顾情面、重关系的人","maps":"TF/F"}]},{"no":10,"stem":"你的日程通常是","options":[{"key":"A","text":"提前安排好，按计划走","maps":"JP/J"},{"key":"B","text":"留白，到时候再说","maps":"JP/P"}]},{"no":11,"stem":"面对 deadline，你多半","options":[{"key":"A","text":"早早完成，心里才踏实","maps":"JP/J"},{"key":"B","text":"临门一脚，压力出活","maps":"JP/P"}]},{"no":12,"stem":"你更舒服的状态是","options":[{"key":"A","text":"事情定下来、有了结论","maps":"JP/J"},{"key":"B","text":"保留多种可能、随时能改","maps":"JP/P"}]}]},"questions":[{"no":1,"stem":"周末被拉去一个大半是陌生人的局，散场时你的真实状态是：","options":[{"key":"A","text":"聊了一晚上越聊越有劲，回家路上还在群里接梗","score":{"axis":"EI","pole":"E"}},{"key":"B","text":"中途就开始盘算几点能走，到家要一个人瘫很久回血","score":{"axis":"EI","pole":"I"}},{"key":"C","text":"只要气氛热，我能端着杯子把全场的人认识一遍","score":{"axis":"EI","pole":"E"}},{"key":"D","text":"在角落和唯一认识的人深聊，反而觉得今晚值了","score":{"axis":"EI","pole":"I"}}]},{"no":2,"stem":"忙了整整一周，最让你回血的周末安排是：","options":[{"key":"A","text":"约三五好友吃饭唱歌，人多才放松","score":{"axis":"EI","pole":"E"}},{"key":"B","text":"宅家点外卖刷剧，谁也别来找我","score":{"axis":"EI","pole":"I"}},{"key":"C","text":"临时起意参加个户外活动，认识点新朋友","score":{"axis":"EI","pole":"E"}},{"key":"D","text":"一个人去咖啡馆坐一下午，带本书或耳机","score":{"axis":"EI","pole":"I"}}]},{"no":3,"stem":"开会讨论方案时，你通常：","options":[{"key":"A","text":"边说边想，说着说着思路就出来了","score":{"axis":"EI","pole":"E"}},{"key":"B","text":"先在脑子里过几遍，想清楚了才开口","score":{"axis":"EI","pole":"I"}},{"key":"C","text":"喜欢头脑风暴，大家一起抛想法最来劲","score":{"axis":"EI","pole":"E"}},{"key":"D","text":"会后整理成文字发群里，表达得更完整","score":{"axis":"EI","pole":"I"}}]},{"no":4,"stem":"看完一部电影，你更容易记住的是：","options":[{"key":"A","text":"具体的台词、画面和那个戳到你的细节","score":{"axis":"SN","pole":"S"}},{"key":"B","text":"它到底在隐喻什么，散场后还在想世界观","score":{"axis":"SN","pole":"N"}},{"key":"C","text":"服化道和场景是否真实、有没有穿帮","score":{"axis":"SN","pole":"S"}},{ ":8,"stem":"关于恋爱里的个人空间，你更认同？","options":[{"key":"A","text":"关系再好，也别过多进入我的内心地盘","score":{"axis":"avoid","pole":"high"}},{"key":"B","text":"边界可以沟通，亲密和独立能同时存在","score":{"axis":"avoid","pole":"low"}},{"key":"C","text":"靠得太近容易麻烦，保持距离更轻松","score":{"axis":"avoid","pole":"high"}},{"key":"D","text":"我喜欢稳定靠近，也尊重彼此的小世界","score":{"axis":"avoid","pole":"low"}}]}],"results":[{"key":"secure","name":"安全型","match":{"anxiety":"low","avoid":"low"},"summary":"能靠近也能独立，恋爱频道信号稳定。","detail":"你通常相信自己值得被喜欢，也愿意相信对方的善意。需要陪伴时能开口，想独处时也能说明，不太会把一次晚回微信脑补成关系大结局。遇到分歧，你更倾向于把问题放到桌面上谈，在亲密与个人空间之间找到舒服的弹性。","traits":["稳定沟通","信任感","边界清晰"],"growthTip":"保持直接表达，也别把自己的稳定当成对方一定懂你的理由。","shareCard":"我的恋爱依恋类型是安全型：能黏也能各忙各的。你呢？","adSlot":"result_page"},{"key":"anxious","name":"焦虑型（痴迷型）","match":{"anxiety":"high","avoid":"low"},"summary":"爱意接收器灵敏，最怕信号突然掉线。","detail":"你很重视亲密和回应，对关系里的细小变化格外敏锐。对方语气短一点、消息慢一点，都可能让你的脑内弹幕提前开播。你的投入和热情很珍贵，只是偶尔会把确认爱意变成高频刷新。关系更舒服的关键，是把猜测换成具体提问，也给自己留一块稳定的生活主场。","traits":["投入热烈","感受敏锐","需要回应"],"growthTip":"想确认时说需求，不用用试探题考验对方，也别暂停自己的生活。","shareCard":"我的恋爱依恋类型是焦虑型，爱意雷达全天在线。你呢？","adSlot":"share_card"},{"key":"avoidant","name":"回避型（疏离型）","match":{"anxiety":"low","avoid":"high"},"summary":"独立值拉满，亲密靠近时会先看安全距离。","detail":"你习惯自己处理事情，也很看重个人空间。面对高浓度表达或连续追问，你可能本能地后退一步，用忙碌、讲道理或沉默恢复掌控感。这不代表你不在乎，更多时候只是你更相信行动和自理。若愿意多说一句真实感受，让对方不用全靠猜，亲密关系会少很多误读。","traits":["独立自主","冷静克制","重视空间"],"growthTip":"不必一次说很多，先练习用一句话交代感受和你需要的距离。","shareCard":"我的恋爱依恋类型是回避型，独处电量必须保住。你呢？","adSlot":"info_feed"},{"key":"fearful","name":"恐惧型（矛盾型）","match":{"anxiety":"high","avoid":"high"},"summary":"想靠近又怕受伤，恋爱按钮偶尔反复横跳。","detail":"你既期待被坚定选择，又会在关系升温时担心失去主动，于是可能一边想要回应，一边把真正需求藏起来。靠近让你心动，距离又让你暂时松口气，这种拉扯容易让双方都猜题。你真正需要的不是强行勇敢，而是更可预测的沟通节奏和一点点建立起来的信任。","traits":["内心细腻","谨慎靠近","重视安全感"],"growthTip":"把忽冷忽热换成提前说明，从小事开始练习稳定表达。","shareCard":"我的恋爱依恋类型是恐惧型，靠近和退后都很认真。你呢？","adSlot":"result_page"}]},"3":{"id":3,"title":"【商业版权·原题参考】你的灵魂色彩（四色人格）","shortName":"灵魂色彩","category":"人格","tags":["人格","视觉","色彩卡片","易晒"],"copyrightStatus":"commercial","entertainment":true,"stat "选项过载","谨慎犹豫"],"growthTip":"破解法：给自己设“思考预算”——调研不超过 30 分钟，最多比较 3 个方案，然后强制选一个并记录理由。小决定（吃什么、穿什么）直接随机或听第一个念头，把决策力省给真正重要的选择。","shareCard":"拖延症流派鉴定：我是决策瘫痪型，卡在“选哪个”。你呢？","adSlot":"result_page"},{"key":"lowenergy","categoryKey":"lowenergy","name":"能量不足型","summary":"不是不上进，是电池真的只剩百分之几。","detail":"你的拖延最诚实：脑子想干活，身体已经关机。长期睡眠不足、连轴转、信息过载，会把意志力消耗殆尽，这时候再谈自律就是空谈。你看起来是在“摆烂”，其实是在被动节能。与其责备自己，不如先把电量充回来——很多任务不是难，只是你太累了。","traits":["电量告急","需要恢复","节奏偏慢"],"growthTip":"破解法：先补基础电量——固定睡够、白天晒十分钟太阳、喝水吃饭别省。任务安排改成“高峰做难事、低谷做杂事”，并把一天中最重要的工作压缩成 90 分钟一段。状态差时只做最低限度版本，把完整版留给状态好的那天。","shareCard":"拖延症流派鉴定：我是能量不足型，脑子在线但身体已关机。你呢？","adSlot":"share_card"}]},"14":{"id":14,"title":"今日运势与幸运色鉴定","shortName":"今日运势","category":"玄学","tags":["玄学","运势","幸运色","幸运数字","每日"],"copyrightStatus":"internet_native","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性趣味测算，结果不代表任何心理评估或医学诊断。","minorProtected":false},"source":{"theory":"无权威来源，互联网原生趣味测评","sourceType":"internet_native","reference":"本测题为原创自编"},"description":"从起床状态、外卖手气到睡前心情，给今天算一笔流水账，顺带领取你的专属幸运色和幸运数字。玄学仅供娱乐，好运还得靠自己出门。","instructions":"共 10 题，请按今天的真实体感作答，凭第一直觉选，别回头改。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"great","name":"大吉"},{"key":"good","name":"小吉"},{"key":"steady","name":"平稳"},{"key":"bumpy","name":"小波折"},{"key":"recharge","name":"需充电"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"今天早上醒来的第一感觉是？","options":[{"key":"A","text":"神清气爽，像提前充满电","score":{"cat":"great","points":1}},{"key":"B","text":"还不错，感觉今天会挺顺","score":{"cat":"good","points":1}},{"key":"C","text":"就那样，一个普通的日子","score":{"cat":"steady","points":1}},{"key":"D","text":"有点沉，哪里不太对劲","score":{"cat":"bumpy","points":1}}]},{"no":2,"stem":"出门前挑衣服，你今天的手气是？","options":[{"key":"A","text":"随手一抓就是最搭的一套","score":{"cat":"great","points":1}},{"key":"B","text":"试了两套，第二套很满意","score":{"cat":"good","points":1}},{"key":"C","text":"穿了最常穿的那件","score":{"cat":"steady","points":1}},{"key":"D","text":"纠结半天，最后想早点睡觉","score":{"cat":"recharge","poi "points":1}},{"key":"B","text":"临时多出一笔计划外开销","score":{"cat":"bumpy","points":1}},{"key":"C","text":"冲动下单了其实不需要的东西","score":{"cat":"recharge","points":1}},{"key":"D","text":"正常消费，没什么波动","score":{"cat":"steady","points":1}}]},{"no":10,"stem":"睡前回看今天，你的总结是？","options":[{"key":"A","text":"踩了几个坑，明天得小心点","score":{"cat":"bumpy","points":1}},{"key":"B","text":"平平淡淡，也算过关","score":{"cat":"steady","points":1}},{"key":"C","text":"有几个还不错的小瞬间","score":{"cat":"good","points":1}},{"key":"D","text":"电量耗尽，需要早点睡","score":{"cat":"recharge","points":1}}]}],"results":[{"key":"great","categoryKey":"great","name":"大吉","summary":"今天的运气像开了加速，宜主动出击。","detail":"今天的你像是被好运追着跑：事情推进顺、消息来得及时，连外卖都比平时快一步。这种日子最怕浪费在犹豫上，适合把一直拖着的那件事摆上台面，去谈、去问、去提交。运气只是顺风，真正让今天变成好日子的，是你敢顺着这股风往前迈了一大步。","traits":["运势在线","行动力满格","贵人缘旺"],"growthTip":"趁手气好，把最难开口的那件事今天说出口；顺手给久未联系的人发句问候，说不定就接上了新机会。","shareCard":"今日运势：我是大吉，今天适合主动出击。你呢？","luckyColor":"正红","luckyNumber":8,"adSlot":"share_card"},{"key":"good","categoryKey":"good","name":"小吉","summary":"稳中有喜，小确幸来得刚刚好。","detail":"今天不算惊天动地的好，但处处有点甜：事情按计划走，偶尔冒出一句夸奖、一个邀约、一顿合口的饭。这种运势最养人，因为它不靠运气爆棚，而是靠你把普通的一天过得有滋有味。别小看这些小确幸，攒起来就是一个很不错的月份。","traits":["小确幸不断","节奏舒服","人和气顺"],"growthTip":"把今天让你开心的小事记下来，攒成一份“好运清单”；状态不错的话，可以顺手推进一件中等难度的事。","shareCard":"今日运势：我是小吉，稳中有喜的一天。你呢？","luckyColor":"暖橙","luckyNumber":6,"adSlot":"result_page"},{"key":"steady","categoryKey":"steady","name":"平稳","summary":"没有大风大浪，就是最好的一天。","detail":"今天的关键词是“正常”：没有惊喜，也没有意外，事情一件件按序完成，情绪像一条平缓的线。很多人嫌平淡，但平稳其实是稀缺资源——它意味着没有坑要填、没有火要救，你可以把注意力留给真正想做的事。把今天当成攒弹药的日子，一点都不亏。","traits":["节奏稳定","无惊无喜","适合沉淀"],"growthTip":"给自己安排一件“慢而有回报”的事，比如读几十页书、整理一份资料；平稳日最适合打地基。","shareCard":"今日运势：我是平稳，风平浪静也是好日子。你呢？","luckyColor":"米白","luckyNumber":3,"adSlot":"info_feed"},{"key":"bumpy","categoryKey":"bumpy","name":"小波折","summary":"有点磕绊，但都是能绕过去的小坎。","detail":"今天时不时冒出点小状况：返工、误解、临时插单，节奏被打得有点碎。好在这些都不是大事，多半是沟通误差或时间撞车造成的。处理这种日子的诀窍是别硬刚——先分清哪些必须今天解决、哪些可以明天再说，把力气留给真正紧急的那一件。","traits":["偶有返工","节奏被打断","需要耐心"],"growthTip":"遇到卡点先停十秒再回应，避免情绪上头；把今天没解决的问题写清楚，明天一早状态好时优先处理。","shareCard":"今日运势：我是小波折，今天的小坑我绕过去了。你呢？","luckyColor":"雾霾蓝","luckyNumber":4,"adSlot":"result_page"},{"key":"recharge","categoryKey":"recharge","name":"需充电","summary":"电量偏低，今天的主线任务是照顾好自己。","detail":"今天你的电池可能只剩百分之十几：提不起劲、容易犯困、做决定也格外费劲。这不是你不行，是你真的需要休息。硬撑着冲效率，往往换来更差的产出和更差的心情。把今天的目标调低一档，完成最低限度的事，剩下的时间用来补觉、吃点好的、早点收工。","traits":["电量偏低","需要休息","不宜硬撑"],"growthTip":"今晚提前半小时放下手机，喝杯热水早点睡；明天只安排三件最重要的事，其余全部往后排。","shareCard":"今日运势：我是需充电，今天先把自己充满。你呢？","luckyColor":"薄荷绿","luckyNumber":2,"adSlot":"share_card"}]},"15":{"id":15,"title":"你是哪种朋友","shortName":"朋友类型","category":"社交","tags":["社交","朋友","朋友圈","人设","聚会"],"copyrightStatus":"internet_native","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性社交风格分类，结果不代表任何心理评估或医学诊断。","minorProtected":false},"source":{"theory":"无权威来源，互联网原生趣味测评","sourceType":"internet_native","reference":"本测题为原创自编"},"description":"在朋友圈里，总有一个位置是非你莫属的：有人负责组局，有人负责接住深夜的情绪，有人负责把群聊盘活。十道题，测出你在友谊里的固定工位。","instructions":"共 10 题，请按你在朋友面前的真实反应作答，别按理想人设选。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"organizer","name":"饭局组织者"},{"key":"listener","name":"深夜倾听者"},{"key":"memelord","name":"梗王"},{"key":"vibe","name":"气氛组"},{"key":"logistic","name":"靠谱后勤"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"朋友群里有人发了句“好无聊啊”，你的第一反应是？","options":[{"key":"A","text":"立刻开组：今晚吃啥，我来定","score":{"cat":"organizer","points":1}},{"key":"B","text":"私聊问一句：怎么了，要不要聊聊","score":{"cat":"listener","points":1}},{"key":"C","text":"甩一张梗图，群里秒活","score":{"cat":"memelord","points":1}},{"key":"D","text":"连发几个表情把气氛撑起来","score":{"cat":"vibe","points":1}}]},{"no":2,"stem":"朋友过生日，你最可能负责什么？","options":[{"key":"A","text":"订餐厅、定时间、拉群通知一条龙","score":{"cat":"organizer","points":1}},{"key":"B","text":"写一段只有你们才懂的祝福","score":{"cat":"listener","points":1}},{"key":"C","text":"做一张丑到离谱的祝福图","score":{"cat":"memelord","points":1}},{"key":"D","text":"提前买好蛋糕礼物并准时送到","score":{"cat":"logistic","points":1}}]},{"no":3,"stem":"朋友半夜发来一句“在吗”，你会？","options":[{"key":"A","text":"秒回“在，说吧”，陪他聊到困","score":{"cat":"listener","points":1}},{"key":"B","text":"发个抱抱表情，让他先缓缓","score":{"cat":"vibe","points":1}},{"key":"C","text":"问清情况，第二天帮他落实方案","score":{"cat":"logistic","points":1}},{"key":"D","text":"直接问：“要不要现在出来坐会儿”","score":{"cat":"organizer","points":1}}]},{"no":4,"stem":"一桌人聚会，你通常坐在哪、在干什么？","options":[{"key":"A","text":"中间位，负责点菜和控流程","score":{"cat":"organizer","points":1}},{"key":"B","text":"角落里那个负责制造笑点的人","score":{"cat":"memelord","points":1}},{"key":"C","text":"哪桌冷了就去哪桌补气氛","score":{"cat":"vibe","points":1}},{"key":"D","text":"靠门口，方便买单、叫车、收尾","score":{"cat":"logistic","points":1}}]},{"no":5,"stem":"朋友发来一条 60 秒的吐槽语音，你会？","options":[{"key":"A","text":"认真听完，一条条回应","score":{"cat":"listener","points":1}},{"key":"B","text":"听完总结一句精辟吐槽","score":{"cat":"memelord","points":1}},{"key":"C","text":"边听边发表情，让他知道有人在","score":{"cat":"vibe","points":1}},{"key":"D","text":"听完直接给一套可操作的建议","score":{"cat":"logistic","points":1}}]},{"no":6,"stem":"周末被朋友临时放鸽子，你的反应是？","options":[{"key":"A","text":"立刻启动备选方案，转手再约别人","score":{"cat":"organizer","points":1}},{"key":"B","text":"先关心对方是不是出了状况","score":{"cat":"listener","points":1}},{"key":"C","text":"发个自嘲段子，然后安心刷剧","score":{"cat":"memelord","points":1}},{"key":"D","text":"顺势在群里喊一嗓子，把局续上","score":{"cat":"vibe","points":1}}]},{"no":7,"stem":"朋友搬家求助，你最可能是那个？","options":[{"key":"A","text":"拉时间表，安排人手和车","score":{"cat":"organizer","points":1}},{"key":"B","text":"提前到场，边打包边听他吐槽","score":{"cat":"listener","points":1}},{"key":"C","text":"人到就行，顺便承包整场笑料","score":{"cat":"memelord","points":1}},{"key":"D","text":"带齐胶带、纸箱和矿泉水","score":{"cat":"logistic","points":1}}]},{"no":8,"stem":"群聊冷场三小时，你会怎么做？","options":[{"key":"A","text":"抛个新话题：这周末去哪玩","score":{"cat":"organizer","points":1}},{"key":"B","text":"私聊问问大家最近状态如何","score":{"cat":"listener","points":1}},{"key":"C","text":"发个小红包把人炸出来","score":{"cat":"vibe","points":1}},{"key":"D","text":"把之前说好的计划整理同步一遍","score":{"cat":"logistic","points":1}}]},{"no":9,"stem":"朋友之间闹了点小别扭，你通常怎么处理？","options":[{"key":"A","text":"把大家叫出来当面说清楚","score":{"cat":"organizer","points":1}},{"key":"B","text":"用一句玩笑先把尴尬化掉","score":{"cat":"memelord","points":1}},{"key":"C","text":"先把气氛缓回来，再慢慢聊","score":{"cat":"vibe","points":1}},{"key":"D","text":"分别了解情况，给个实在方案","score":{"cat":"logistic","points":1}}]},{"no":10,"stem":"朋友对你的固定印象，最可能是哪句？","options":[{"key":"A","text":"“有心事第一个想到的就是他”","score":{"cat":"listener","points":1}},{"key":"B","text":"“他的表情包我存了一整个相册”","score":{"cat":"memelord","points":1}},{"key":"C","text":"“有他在场，就不会尴尬”","score":{"cat":"vibe","points":1}},{"key":"D","text":"“交代他的事，从没掉过链子”","score":{"cat":"logistic","points":1}}]}],"results":[{"key":"organizer","categoryKey":"organizer","name":"饭局组织者","summary":"没有你，这顿饭大概率聊到一半就散了。","detail":"你是朋友圈里的发动机：定时间、选餐厅、拉群、催到场，一条龙服务从不喊累。你享受把人聚在一起的成就感，也确实擅长让不同性格的人坐在同一张桌子上不尴尬。唯一要留意的，是别让“我来安排”变成“我来兜底”——组织者也有权只负责吃饭。","traits":["组局达人","执行力强","人脉枢纽"],"growthTip":"试着把订位、买单这类琐事轮流交给别人，你只负责出主意；聚会前也给自己留一句“今天我也可以什么都不安排”。","shareCard":"你是哪种朋友：我是饭局组织者，没有我这顿饭多半黄了。你呢？","adSlot":"result_page"},{"key":"listener","categoryKey":"listener","name":"深夜倾听者","summary":"别人的心事，总在你这里找到落点。","detail":"你是那种凌晨一点也会回消息的人。你不急着给建议，也不随便评判，只是认真听完，再轻轻回一句“我在”。这种稳定而安静的陪伴非常珍贵，很多人正是因为你在，才敢把话说出口。只是长期承接别人的情绪也会耗电，记得倾听不该以掏空自己为代价。","traits":["共情力强","守口如瓶","稳得住"],"growthTip":"给倾听设个边界：太晚的消息可以第二天回，超负荷时直接说“我今天电量不太够”。你也值得被人认真听一次。","shareCard":"你是哪种朋友：我是深夜倾听者，凌晨一点也在线。你呢？","adSlot":"share_card"},{"key":"memelord","categoryKey":"memelord","name":"梗王","summary":"你的表情包库存，够撑起整个群的社交生活。","detail":"你总能在最合适的时间甩出最离谱的那张图，一句话把沉闷的空气戳破。你的幽默不是硬凹，而是对生活和热点的敏锐捕捉，别人还在反应，你已经接上第二层笑点。梗王的隐藏技能是解压——你让朋友在面对烂事时还能笑出来，这本身就是一种高级的善意。","traits":["笑点密集","反应快","自带喜感"],"growthTip":"玩笑开到七分最好，遇到朋友真的难过时，记得切换成认真模式；偶尔也把梗用在自己身上，会更讨喜。","shareCard":"你是哪种朋友：我是梗王，我的表情包养活了整个群。你呢？","adSlot":"info_feed"},{"key":"vibe","categoryKey":"vibe","name":"气氛组","summary":"有你在的地方，空气都是流动的。","detail":"你天生会读空气：谁被冷落了、哪里快冷场了、什么时候该递个台阶，你都能第一时间补位。你不一定是最会讲段子的那个，但你一定是让每个人都参与进来的那个。朋友聚会因为有你而变得松弛，这种暖场能力看起来轻松，其实很花心思，也请珍惜自己的那份热乎劲。","traits":["会暖场","体贴周到","感染力强"],"growthTip":"不用每次都把气氛扛在自己肩上，冷场也可以冷一会儿；给自己留点不说话、纯享受聚会的空间。","shareCard":"你是哪种朋友：我是气氛组，有我在场就不会冷。你呢？","adSlot":"share_card"},{"key":"logistic","categoryKey":"logistic","name":"靠谱后勤","summary":"交代给你的事，从来不需要再问第二遍。","detail":"你是朋友圈里的定心丸：证件带没带、车叫了没、东西收好没，你都提前想好了。你不太爱抢风头，却在关键时刻总能拿出胶带、充电宝、雨伞和备用方案。这种可靠的背后是极强的责任心，但也容易变成“大家默认你来收拾”。靠谱很值钱，前提是别让它变成无限责任。","traits":["极度靠谱","未雨绸缪","细节到位"],"growthTip":"学会把任务明确分出去，比如直接点名“这次充电宝你带”；做完之后也别急着隐身，让朋友知道你付出了什么。","shareCard":"你是哪种朋友：我是靠谱后勤，交代我的事从没掉过链子。你呢？","adSlot":"result_page"}]},"16":{"id":16,"title":"抗压体质类型鉴定","shortName":"抗压体质","category":"轻职场/情绪","tags":["抗压","韧性","职场","情绪","打工人"],"copyrightStatus":"public_domain","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"娱乐性质，不代表专业心理评估；本测试仅描述日常压力应对风格，不代表任何心理评估或医学诊断。","minorProtected":false},"source":{"theory":"BRS 心理韧性量表（Smith 2008，公共领域）与 CD-RISC","sourceType":"public_domain","reference":"本测题为基于公开学术量表结构的娱乐化原创自编改编，非官方逐字题面"},"description":"同样是被甲方改稿、被临时插单、被周一早会砸中，有人当场弹回来，有人要缓三天。测测你属于哪种抗压体质：橡皮人、玻璃人、弹簧人还是海绵人。纯属娱乐，别给自己贴标签。","instructions":"共 10 题，请按你最近三个月的真实反应作答，凭第一直觉选。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"rubber","name":"橡皮人"},{"key":"glass","name":"玻璃人"},{"key":"spring","name":"弹簧人"},{"key":"sponge","name":"海绵人"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"方案快做完时被要求推翻重来，你的第一反应是？","options":[{"key":"A","text":"没事，改就是了，扛得住","score":{"cat":"rubber","points":1}},{"key":"B","text":"心里一沉，会反复想是不是我的问题","score":{"cat":"glass","points":1}},{"key":"C","text":"先愣一下，马上开始想怎么补救","score":{"cat":"spring","points":1}},{"key":"D","text":"先不做反应，让信息沉一沉","score":{"cat":"sponge","points":1}}]},{"no":2,"stem":"在会议上被当众点名说了一句，你会？","options":[{"key":"A","text":"听完就过，不太往心里去","score":{"cat":"rubber","points":1}},{"key":"B","text":"一整天都在回味那句话","score":{"cat":"glass","points":1}},{"key":"C","text":"当下难受，晚上自己复盘完就翻篇","score":{"cat":"spring","points":1}},{"key":"D","text":"表面平静，心里慢慢消化","score":{"cat":"sponge","points":1}}]},{"no":3, ,"text":"“特别扛事，什么都能接住”","score":{"cat":"rubber","points":1}},{"key":"B","text":"“细腻敏感，很会察觉情绪”","score":{"cat":"glass","points":1}},{"key":"C","text":"“摔了自己能爬起来”","score":{"cat":"spring","points":1}},{"key":"D","text":"“沉稳慢热，但很通透”","score":{"cat":"sponge","points":1}}]},{"no":10,"stem":"你的回血方式更接近哪一种？","options":[{"key":"A","text":"不用特别充，睡一觉就行","score":{"cat":"rubber","points":1}},{"key":"B","text":"需要安静、少打扰的环境","score":{"cat":"glass","points":1}},{"key":"C","text":"主动安排能让自己开心的事","score":{"cat":"spring","points":1}},{"key":"D","text":"给自己留白，慢慢消化","score":{"cat":"sponge","points":1}}]}],"results":[{"key":"rubber","categoryKey":"rubber","name":"橡皮人","summary":"扛揍型选手，压力来了就接住，不太留痕。","detail":"你是办公室里的缓冲垫：方案被推翻、需求临时变、周一突然开会，你多半耸耸肩就继续干。这种钝感力让你在混乱里保持输出，也让你成为团队里最稳的那一环。不过橡胶再厚也有疲劳极限，长期硬扛容易把小磨损攒成大问题，适当给自己做做保养，比一直扛着更划算。","traits":["钝感力强","稳定输出","抗压扛造"],"growthTip":"别把“没事”当成默认回复，每周留一个能真正放空的时段；累的时候直接说出来，别人未必知道你也扛得辛苦。","shareCard":"抗压体质鉴定：我是橡皮人，扛揍这块我是专业的。你呢？","adSlot":"result_page"},{"key":"glass","categoryKey":"glass","name":"玻璃人","summary":"感知力拉满，别人一句话你能听出三层意思。","detail":"你对环境和情绪的分辨率极高：语气变化、表情细节、群聊里那句没说出口的话，你都能第一时间捕捉到。这份敏感让你很会照顾人，也让你在创作、审美和沟通上有天然优势。代价是同样的刺激在你这里会被放大，一句无心的话能在脑子里循环一整天。敏感不是缺点，只是需要更好的过滤机制。","traits":["感受细腻","共情敏锐","容易回味"],"growthTip":"给信息设个“有效期”：别人的评价最多复盘一次就归档；睡前一小时远离工作群，把高敏感的精力留给喜欢的事。","shareCard":"抗压体质鉴定：我是玻璃人，感受力满格但容易被戳到。你呢？","adSlot":"share_card"},{"key":"spring","categoryKey":"spring","name":"弹簧人","summary":"会被压下去，但每次都能弹得更高一点。","detail":"你不是不受影响，而是恢复得快：被打击时会明显下沉，但你能很快启动自我修复——找人聊、出门走、复盘总结，然后带着新经验回到场上。你的韧性来自主动，而不是天生免疫，这种能力是可以持续升级的。只要别把每次回弹都压到极限，你的弹性会越用越好。","traits":["恢复力强","主动自救","越挫越勇"],"growthTip":"把你的回弹流程写下来（聊天、运动、复盘三件套），状态差时照着做；同时给自己设个“不硬扛上限”，超过就暂停。","shareCard":"抗压体质鉴定：我是弹簧人，压下去还能弹回来。你呢？","adSlot":"info_feed"},{"key":"sponge","categoryKey":"sponge","name":"海绵人","summary":"吸收得慢，但都吸收成了自己的东西。","detail":"你面对冲击时反应不快，需要一段留白去慢慢消化。别人以为你还没走出来，其实你正在把这件事拆解、吸收、内化成经验。你复原的节奏偏慢，但一旦消化完就不容易再被同一件事绊倒。对你来说，最消耗的不是压力本身，而是被催着“快点好起来”——你需要的是时间，而不是方法。","traits":["慢热沉稳","善于内化","需要留白"],"gr core":{"cat":"street","points":1}},{"key":"D","text":"“你看起来好干净利落”","score":{"cat":"preppy","points":1}}]}],"results":[{"key":"minimal","categoryKey":"minimal","name":"极简主义","summary":"少即是多，你信奉“留白才是高级”。","detail":"你的审美核心是减法：颜色收敛、线条干净、物件能少一件就少一件。你不追逐流行，更在意一件东西能不能长期陪伴，能不能和衣柜里其他单品无缝搭配。这种克制让你看起来永远得体，也让你在信息过载的时代保住了一份清爽。偶尔加一点材质上的变化，会让你的极简更有温度。","traits":["克制干净","重质感","长期主义"],"growthTip":"在配色不变的前提下，试试不同材质的混搭（如棉麻配金属），用细节制造层次，避免整体过于冷淡。","shareCard":"你的审美人格：我是极简主义，少即是多。你呢？","adSlot":"result_page"},{"key":"french","categoryKey":"french","name":"法式松弛","summary":"看起来毫不费力，其实每处都刚刚好。","detail":"你追求的是 effortless：衣服像随手一穿，发型像随手一扎，但整体就是顺眼。你偏爱低饱和色、合身不紧绷的剪裁、有点旧感的皮具，也不太爱显眼的 logo。你的审美哲学是“风格要服务于人，而不是人服务于风格”。这份松弛感很迷人，也很容易被模仿得过头——记住，随意的前提是舒服，不是真的随便。","traits":["松弛自然","低饱和控","气质优先"],"growthTip":"保留松弛基调的同时，用一件有存在感的配饰（丝巾、耳饰）做视觉落点，让“随意”显得更有章法。","shareCard":"你的审美人格：我是法式松弛，随意但有分寸。你呢？","adSlot":"share_card"},{"key":"street","categoryKey":"street","name":"街头潮流","summary":"你的穿搭有自己的观点，不打算和别人撞。","detail":"你对潮流敏感，也愿意为态度和设计买单。宽松廓形、叠穿层次、球鞋和联名款是你的常用词汇，你享受把不同元素重组出个人标识的过程。你的审美带着一股鲜活劲儿，能在千篇一律的通勤穿搭里跳出来。要注意的是，风格不等于堆砌单品，主次分清才不会用力过猛。","traits":["敢穿敢搭","潮流敏锐","强调个性"],"growthTip":"每次造型只留一个视觉主角，其余单品退为背景；同时建立自己的“基础款底盘”，让亮点串得起来。","shareCard":"你的审美人格：我是街头潮流，穿搭自带观点。你呢？","adSlot":"info_feed"},{"key":"preppy","categoryKey":"preppy","name":"学院复古","summary":"干净、规矩，还带着一点书卷气。","detail":"你偏爱格纹、针织、衬衫这类经得起时间考验的经典元素，讲究整洁、合身和细节到位。你的审美里有一种秩序感，让人一看就觉得可靠、清爽、有教养。这种风格的好处是从不出错、适配场合广；挑战在于容易显得过于规矩。加一点复古小物或跳脱的配色，就能让经典变得年轻。","traits":["经典耐看","整洁得体","细节讲究"],"growthTip":"在经典框架里加入一件有年代感的小物（复古表、旧书包），或用一双亮色鞋打破整体的规整感。","shareCard":"你的审美人格：我是学院复古，干净利落还带点书卷气。你呢？","adSlot":"result_page"},{"key":"boho","categoryKey":"boho","name":"波西米亚","summary":"自由浪漫，你身上总像带着一段旅程。","detail":"你被色彩、图案和手作质感吸引：长裙、刺绣、流苏、绿植和各地淘来的小物，构成了你独有的审美叙事。你不追求整齐划一，而喜欢层层叠叠的生活痕迹，每一件东西背后都像有个故事。这种风格热情又有生命力，只要控制好色彩数量，就能既丰富又不杂乱。","traits":["浪漫自由","热爱色彩","故事感强"],"growthTip":"给造型定一个主色调，其余颜色都围绕它展开；配饰再多，也留一处“空白”让视觉有地方休息。","shareCard":"你的审美人格：我是波西米亚，身上总带着一段旅程。你呢？","adSlot":"share_card"}]},"18":{"id":18,"title":"决策风格测试","shortName":"决策风格","category":"职场","tags":["决策","职场","思维方式","选择困难","效率"],"copyrightStatus":"public_domain","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性决策风格分类，结果不代表任何心理评估或医学诊断。","minorProtected":false},"source":{"theory":"General Decision-Making Style（Scott & Bruce 1995）五维度：理性、直觉、依赖、回避、自发","sourceType":"public_domain","reference":"本测题为基于公开学术量表结构的原创自编改编，非官方逐字题面"},"description":"从点外卖到换工作，每个人按下决定的方式都不一样：有人列 Excel，有人凭第六感，有人等别人先表态。十道题，测出你的决策风格属于哪一派。","instructions":"共 10 题，请按你在真实情境中的习惯作答，别按“正确做法”选。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"rational","name":"理性分析型"},{"key":"intuitive","name":"直觉判断型"},{"key":"dependent","name":"依赖参考型"},{"key":"avoidant","name":"回避拖延型"},{"key":"spontaneous","name":"即兴冲动型"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"面对一个需要马上拍板的选择，你通常？","options":[{"key":"A","text":"列条件、比数据、算清楚利弊","score":{"cat":"rational","points":1}},{"key":"B","text":"凭第一感觉，跟着直觉走","score":{"cat":"intuitive","points":1}},{"key":"C","text":"先问问身边人怎么看","score":{"cat":"dependent","points":1}},{"key":"D","text":"能拖就拖，拖到有人替我定","score":{"cat":"avoidant","points":1}}]},{"no":2,"stem":"中午点外卖时，你的操作更像？","options":[{"key":"A","text":"看评分、销量和评价，比较后再点","score":{"cat":"rational","points":1}},{"key":"B","text":"凭当下最想吃的那口来选","score":{"cat":"intuitive","points":1}},{"key":"C","text":"先问同事点什么，跟着一起","score":{"cat":"dependent","points":1}},{"key":"D","text":"随便划到哪家就哪家","score":{"cat":"spontaneous","points":1}}]},{"no":3,"stem":"买一件单价不低的东西，你会？","options":[{"key":"A","text":"先做功课，参数全查一遍","score":{"cat":"rational","points":1}},{"key":"B","text":"摸到实物那一刻就知道要不要","score":{"cat":"intuitive","points":1}},{"key":"C","text":"一直在购物车里躺着没结算","score":{"cat":"avoidant","points":1}},{"key":"D","text":"看到心动当场就下单","score":{"cat":"spontaneous","points":1}}]},{"no":4,"stem":"会上被要求给方案意见，你一般？","options":[{"key":"A","text":"给出带数据和逻辑的明确结论","score":{"cat":"rational","points":1}},{"key":"B","text":"先听听领导和同事的倾向","score":{"cat":"dependent","points":1}},{"key":"C","text":"含糊带过，不轻易表态","score":{"cat":"avoidant","points":1}},{"key":"D","text":"当场拍脑袋先给个方向","score":{"cat":"spontaneous","points":1}}]},{"no":5,"stem":"朋友问“周末去哪玩”，你的回答更像？","options":[{"key":"A","text":"“跟着感觉走，到了再说”","score":{"cat":"intuitive","points":1}},{"key":"B","text":"“你们定，我都可以”","score":{"cat":"dependent","points":1}},{"key":"C","text":"“再说吧，临时再约”","score":{"cat":"avoidant","points":1}},{"key":"D","text":"“现在就走，我随时能出发”","score":{"cat":"spontaneous","points":1}}]},{"no":6,"stem":"回顾自己做过的重大决定，你觉得？","options":[{"key":"A","text":"多数经过论证，不太后悔","score":{"cat":"rational","points":1}},{"key":"B","text":"基本靠直觉，结果还不错","score":{"cat":"intuitive","points":1}},{"key":"C","text":"很多都是听了别人的建议","score":{"cat":"dependent","points":1}},{"key":"D","text":"不少是拖到最后被逼出来的","score":{"cat":"avoidant","points":1}}]},{"no":7,"stem":"两难选择里，你最难忍受的是？","options":[{"key":"A","text":"信息还没搞清楚就要下判断","score":{"cat":"rational","points":1}},{"key":"B","text":"违背自己心里那个声音","score":{"cat":"intuitive","points":1}},{"key":"C","text":"身边连个能商量的人都没有","score":{"cat":"dependent","points":1}},{"key":"D","text":"被流程绑住，不能马上行动","score":{"cat":"spontaneous","points":1}}]},{"no":8,"stem":"群里投票选聚餐地点，你会？","options":[{"key":"A","text":"先看哪家性价比最高","score":{"cat":"rational","points":1}},{"key":"B","text":"跟着大多数人选的那个","score":{"cat":"dependent","points":1}},{"key":"C","text":"随便投一个，懒得再想","score":{"cat":"avoidant","points":1}},{"key":"D","text":"直接跳出来说“就这家，走”","score":{"cat":"spontaneous","points":1}}]},{"no":9,"stem":"做完一个决定之后，你更常？","options":[{"key":"A","text":"复盘整个过程，下次优化","score":{"cat":"rational","points":1}},{"key":"B","text":"相信这就是对的，不再回头看","score":{"cat":"intuitive","points":1}},{"key":"C","text":"还是会反复怀疑","score":{"cat":"avoidant","points":1}},{"key":"D","text":"立刻去做，做完再说","score":{"cat":"spontaneous","points":1}}]},{"no":10,"stem":"别人评价你的决策方式更像哪句？","options":[{"key":"A","text":"“他第六感挺准的”","score":{"cat":"intuitive","points":1}},{"key":"B","text":"“他挺愿意听建议的”","score":{"cat":"dependent","points":1}},{"key":"C","text":"“他做决定有点慢”","score":{"cat":"avoidant","points":1}},{"key":"D","text":"“他想到什么就干什么”","score":{"cat":"spontaneous","points":1}}]}],"results":[{"key":"rational","categoryKey":"rational","name":"理性分析型","summary":"决策之前先建模型，你相信数据比感觉靠谱。","detail":"你做决定前习惯收集信息、列条件、比较方案，甚至会默默给各选项打分。这种方式让你在大额消费和职业选择上很少踩坑，也让你成为团队里那个“说得出为什么”的人。需要注意的是，理性也有成本：信息永远收集不完，过度分析会把机会拖没。给重要的决定设一个截止时间，比追求完美答案更实用。","traits":["逻辑清晰","重视依据","结论可靠"],"growthTip":"给分析设时间盒：重要决定最多调研两天，然后强制进入决策环节；小事上刻意练习“三十秒决断”，把分析力留给真正的大事。","shareCard":"决策风格测试：我是理性分析型，先列 Excel 再说话。你呢？","adSlot":"result_page"},{"key":"intuitive","categoryKey":"intuitive","name":"直觉判断型","summary":"第六感在线，你常常说不出理由但就是知道。","detail":"你下判断的速度很快，往往在别人还在列清单时，你心里已经有了答案。这种直觉不是凭空来的，而是过往经验被大脑快速压缩后的结果，在信息不全、时间紧迫的场景里尤其好用。你的优势是果断、不内耗，值得留意的是别把直觉用在不熟悉的领域——那更可能是偏见。","traits":["判断迅速","相信感觉","不内耗"],"growthTip":"重要决定上给直觉配一道“复核”：写下三个支持理由，看看是否站得住；陌生领域则主动多查资料，别让手感代替事实。","shareCard":"决策风格测试：我是直觉判断型，说不出理由但就是知道。你呢？","adSlot":"share_card"},{"key":"dependent","categoryKey":"dependent","name":"依赖参考型","summary":"先听听大家怎么说，你再做自己的决定。","detail":"你习惯在决策前收集他人的意见：问朋友、看评价、参考前辈的经验。这让你少走弯路，也让你在团队中显得合作、好沟通。你擅长的其实是整合信息，而不是没主见。需要留意的是，别人的经验有各自的处境，照搬可能水土不服，最后拿主意的人还是你自己。","traits":["善于请教","整合力强","合作度高"],"growthTip":"征求意见时同步说明自己的处境，让建议更对症；收集完后留出十分钟独自判断，写下“我真正想要的是什么”，再做最终决定。","shareCard":"决策风格测试：我是依赖参考型，先听听大家怎么说。你呢？","adSlot":"info_feed"},{"key":"avoidant","categoryKey":"avoidant","name":"回避拖延型","summary":"能晚点决定就晚点决定，最好有人替你定。","detail":"你不是不会选，而是不太喜欢做选择这件事本身：选错了要负责，选之前要纠结，干脆先放着。短期确实省心，长期却会让机会溜走，也会让小问题攒成大问题。好消息是，回避往往来自对后果的过度放大，只要把决定的代价拆小，你会发现多数选择没那么可怕。","traits":["谨慎保守","不爱担责","容易搁置"],"growthTip":"把“要不要做”换成“先做哪一步”：给每个悬而未决的事设一个截止日，到点必须给个方向；同时告诉自己，多数决定是可以修正的。","shareCard":"决策风格测试：我是回避拖延型，能明天定就明天定。你呢？","adSlot":"result_page"},{"key":"spontaneous","categoryKey":"spontaneous","name":"即兴冲动型","summary":"想做就做，你的行动速度经常快过思考。","detail":"你是那种说走就走的人：看到心动就下单，想到点子就开干，讨厌被流程和等待拖住。这种即兴让你抓住了不少别人还在犹豫的机会，也让生活充满新鲜感。需要平衡的是，冲动的另一面是返工率——在不可逆的决定上多停三秒，你的效率会真正转化为成果。","traits":["行动迅速","敢试敢闯","讨厌等待"],"growthTip":"给自己设一条“不可逆清单”（辞职、大额消费、签约），清单内的事强制冷却一晚；清单外的小事继续保持你的速度优势。","shareCard":"决策风格测试：我是即兴冲动型，想到就干不等明天。你呢？","adSlot":"share_card"}]},"19":{"id":19,"title":"孤独感画像（趣味版）","shortName":"孤独感画像","category":"轻情绪","tags":["孤独","独处","情绪","社交","自我观察"],"copyrightStatus":"public_domain","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"娱乐性质，不代表专业心理评估；本测题为 UCLA 孤独量表第三版（Russell 1978，公共领域）的娱乐化改编，不代表任何心理评估或医学诊断。","minorProtected":false},"source":{"theory":"UCLA 孤独量表第三版（Russell 1978，公共领域），本测题为娱乐化改编","sourceType":"public_domain","reference":"本测题为基于公开学术量表的娱乐化原创自编改编，非官方逐字题面"},"description":"独处不等于孤独，热闹也不等于不孤独。十道题，看看你现在的社交状态更像哪一幅画：是自得其乐，还是偶尔空落，还是正悄悄等着谁来敲门。结果仅供娱乐参考。","instructions":"共 10 题，请按最近一个月的真实感受作答，凭直觉选，别想太久。","estimatedMinutes":2,"questionCount":10,"scoringModel":"threshold","bands":[{"key":"solitude","name":"享受独处型","min":10,"max":17},{"key":"occasional","name":"偶尔空落型","min":18,"max":25},{"key":"often","name":"时常孤独型","min":26,"max":32},{"key":"longing","name":"渴望连接型","min":33,"max":40}],"tieBreak":"分数落在区间边界时取高一级。","questions":[{"no":1,"stem":"周末一整天都没人约你，你的感受更像？","options":[{"key":"A","text":"太爽了，这一天终于属于我自己","score":{"points":1}},{"key":"B","text":"挺自在，偶尔也想找人说两句","score":{"points":2}},{"key":"C","text":"有点空，会不自觉地一直刷手机","score":{"points":3}},{"key":"D","text":"挺难熬，好像一直在等消息","score":{"points":4}}]},{"no":2,"stem":"刷到朋友圈里别人聚会的照片，你会？","options":[{"key":"A","text":"替他们开心，然后继续干自己的事","score":{"points":1}},{"key":"B","text":"点个赞，没什么特别的感觉","score":{"points":2}},{"key":"C","text":"会想一下自己怎么没被叫上","score":{"points":3}},{"key":"D","text":"心里有点酸，还会反复翻看好几遍","score":{"points":4}}]},{"no":3,"stem":"晚上一个人吃饭时，你更常是？","options":[{"key":"A","text":"享受这份安静，配个剧特别舒服","score":{"points":1}},{"key":"B","text":"无所谓，吃饱就行","score":{"points":2}},{"key":"C","text":"会想找个人聊聊天","score":{"points":3}},{"key":"D","text":"觉得这顿饭有点难以下咽","score":{"points":4}}]},{"no":4,"stem":"遇到一件特别想分享的开心事，你会？","options":[{"key":"A","text":"发条朋友圈就够了，回不回复都行","score":{"points":1}},{"key":"B","text":"发给一两个亲近的人看看","score":{"points":2}},{"key":"C","text":"翻一遍通讯录，不太确定发给谁","score":{"points":3}},{"key":"D","text":"想了很久，最后什么都没发出去","score":{"points":4}}]},{"no":5,"stem":"有人约你出门，你的第一反应是？","options":[{"key":"A","text":"先看自己想不想，不想就直接拒绝","score":{"points":1}},{"key":"B","text":"看情况，状态好就去","score":{"points":2}},{"key":"C","text":"多半会去，怕错过点什么","score":{"points":3}},{"key":"D","text":"一定去，哪怕其实已经很累了","score":{"points":4}}]},{"no":6,"stem":"独处的时间对你来说意味着？","options":[{"key":"A","text":"是充电，越多越好","score":{"points":1}},{"key":"B","text":"挺舒服，但也需要适量社交","score":{"points":2}},{"key":"C","text":"有点长，容易开始胡思乱想","score":{"points":3}},{"key":"D","text":"很难熬，会不停找事情把时间填满","score":{"points":4}}]},{"no":7,"stem":"在微信群里聊天时，你通常是？","options":[{"key":"A","text":"想说才说，不刻意刷存在感","score":{"points":1}},{"key":"B","text":"偶尔接上几句","score":{"points":2}},{"key":"C","text":"会努力跟上大家的话题","score":{"points":3}},{"key":"D","text":"挺在意有没有人回应我","score":{"points":4}}]},{"no":8,"stem":"遇到一件不太好受的事，你更可能？","options":[{"key":"A","text":"自己消化，也没觉得有什么不妥","score":{"points":1}},{"key":"B","text":"自己处理，需要时再找人聊聊","score":{"points":2}},{"key":"C","text":"想找人，但不太确定找谁","score":{"points":3}},{"key":"D","text":"很希望有人能主动来问问我","score":{"points":4}}]},{"no":9,"stem":"你对“认识新朋友”这件事的态度是？","options":[{"key":"A","text":"随缘就好，不强求","score":{"points":1}},{"key":"B","text":"有机会的话挺好的","score":{"points":2}},{"key":"C","text":"挺想的，但不太会主动","score":{"points":3}},{"key":"D","text":"非常想，总盼着能快点遇到","score":{"points":4}}]},{"no":10,"stem":"用一个画面形容你最近的社交状态，更像？","options":[{"key":"A","text":"一个人在家，舒服又充实","score":{"points":1}},{"key":"B","text":"偶尔聚一聚，节奏刚刚好","score":{"points":2}},{"key":"C","text":"通讯录很长，能说话的没几个","score":{"points":3}},{"key":"D","text":"热闹散场后，回到房间更空了","score":{"points":4}}]}],"results":[{"key":"solitude","name":"享受独处型","summary":"一个人也能过得很热闹，你自带完整小世界。","detail":"你很会和自己相处：一本书、一顿饭、一部剧，就能把一天填得满满当当。你不是不需要朋友，而是不依赖社交来证明自己的存在感。这种稳定的内在节奏很难得，它让你在人群散场后依然充实，也让你在独处时反而长出更多想法。继续保持就好，偶尔记得把这份舒服分享给在乎你的人。","traits":["自得其乐","内在稳定","边界清晰"],"growthTip":"独处是本事，连接是调味。挑一个你信任的人，偶尔主动分享一件小事，让关系保持温度。","shareCard":"孤独感画像：我是享受独处型，一个人也能过得很热闹。你呢？","adSlot":"result_page"},{"key":"occasional","name":"偶尔空落型","summary":"大多数时候挺好，只是偶尔会有一阵空。","detail":"你的社交状态总体是健康的：该聚的时候能聚，该独处的时候也自在。只是偶尔在某些瞬间——比如热闹过后的深夜、刷到别人成群结队的照片——会有一阵说不清的空落。这很正常，它更像是一个提醒：你最近可能有点忙，或者少了点高质量的交流。补上那一两场真正聊得来的对话，空落就散了。","traits":["节奏平衡","偶有空落","重视质量"],"growthTip":"与其扩大社交圈，不如维护好两三段能深聊的关系；定期约一次不赶时间的见面，比频繁点赞更管用。","shareCard":"孤独感画像：我是偶尔空落型，大部分时候都挺好。你呢？","adSlot":"share_card"},{"key":"often","name":"时常孤独型","summary":"通讯录挺长，能说真心话的人却不多。","detail":"你身边并不缺人，缺的是那种能接住你话的关系。很多时刻你都在人群里，却觉得自己像个旁观者：话说了一半就收回去，情绪来了自己消化。这往往不是因为你不够好，而是因为你的表达习惯偏含蓄，加上大家都忙，连接就慢慢变浅了。好消息是，深度关系是可以主动搭建的，从一次真实的自我暴露开始。","traits":["连接偏浅","习惯隐藏","渴望被懂"],"growthTip":"试着把“我很好”换成一句更具体的话，比如“这周有点累”；再挑一个你觉得安全的人，主动发起一次不赶时间的见面。","shareCard":"孤独感画像：我是时常孤独型，通讯录长但能聊的不多。你呢？","adSlot":"info_feed"},{"key":"longing","name":"渴望连接型","summary":"你其实很想靠近别人，只是还没找到那扇门。","detail":"你心里对连接有着很明确的渴望：希望能有人懂你、主动找你、把你放进计划里。这份渴望本身很珍贵，它说明你重视关系，也愿意付出真心。眼下的落差多半来自时机和方式——越是把期待压在“别人先来”，越容易陷入等待。把主动权拿回来一点，哪怕只是一句“周末有空吗”，局面就可能不一样。","traits":["渴望连接","重视关系","期待被看见"],"growthTip":"把等待换成发起：这周主动约一个人，哪怕只是喝杯咖啡。同时给自己安排一件独处时也开心的事，让快乐不全押在别人身上。","shareCard":"孤独感画像：我是渴望连接型，正在等一扇打开的门。你呢？","adSlot":"result_page"}]},"20":{"id":20,"title":"重启力与反脆弱等级鉴定","shortName":"重启力等级","category":"自我成长","tags":["重启力","反脆弱","韧性","自我成长","恢复力"],"copyrightStatus":"public_domain","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"娱乐性质，不代表专业心理评估；本测试仅描述日常恢复与应对风格，不代表任何心理评估或医学诊断。","minorProtected":false},"source":{"theory":"BRS 心理韧性量表与 GSES 一般自我效能感量表（Schwarzer，公共领域）","sourceType":"public_domain","reference":"本测题为基于公开学术量表结构的娱乐化原创自编改编，非官方逐字题面"},"description":"被生活按在地上摩擦之后，有人要缓三个月，有人第二天就满血上线，还有人被打一拳反而长出新肌肉。十道题，测测你的重启力等级，看看你离“反脆弱”还有几步。","instructions":"共 10 题，请按你最近半年的真实反应作答，凭第一直觉选。","estimatedMinutes":2,"questionCount":10,"scoringModel":"threshold","bands":[{"key":"buffering","name":"需要缓冲期","min":10,"max":17},{"key":"steady","name":"稳步回血型","min":18,"max":25},{"key":"quick","n ey":"free","categoryKey":"free","name":"自由型恋人","summary":"爱得松弛，不捆绑也不想被捆绑。","detail":"你需要的关系是“两个完整的人并肩站着”，而不是互相填满彼此的空缺。你不查手机、不追问行踪，也期待对方给你同样的呼吸空间。这份分寸感让相处很轻松，但也可能被误读成不够在意。自由型的关键功课不是学着黏人，而是把在乎表达得更明确一点：一句主动的报备、一次主动的邀约，就能让对方安心不少。","traits":["边界清晰","独立松弛","不喜束缚"],"growthTip":"主动分享一次你的日常，成本很低，但对方会记很久。","shareCard":"我是自由型恋人，最好的关系是各自站得稳。你呢？","adSlot":"info_feed"},{"key":"clingy","categoryKey":"clingy","name":"粘人型恋人","summary":"喜欢就要贴贴，被惦记是你最大的安全感来源。","detail":"你投入得又快又满，消息的节奏、对方的语气，都能直接牵动你一整天的情绪。你愿意为关系付出很多，也期待同等的回应，这份热烈本身就很有感染力。需要留意的是，安全感如果全部押在对方身上，会让自己长期处在不确定里。试着把一部分注意力放回朋友、爱好和目标上，你的喜欢会更有底气，也更让人想靠近。","traits":["投入度高","需要回应","情感细腻"],"growthTip":"给自己保留固定日程，让生活不只有一个重心。","shareCard":"我是粘人型恋人，喜欢就是要贴贴。你呢？","adSlot":"result_page"},{"key":"guardian","categoryKey":"guardian","name":"守护型恋人","summary":"话不多，但你永远是他那边的后盾。","detail":"你的爱很少用语言，更多落在行动上：记得他念叨过的东西、把晚饭和热水准备好、出事时第一个站出来兜底。你可靠、稳定、不轻易承诺但说到做到，是关系里最结实的那块地基。只是长期单方面扛事容易累，也会让对方习惯性忽略你的需要。偶尔示弱一次，说一句“这次我也需要你”，反而会让关系更近。","traits":["可靠兜底","行动派","话少事多"],"growthTip":"把需要说出口，被照顾也是关系里正当的权利。","shareCard":"我是守护型恋人，话不多但一直都在。你呢？","adSlot":"share_card"}]},"24":{"id":24,"title":"消费人格鉴定","shortName":"消费人格","category":"生活/消费","tags":["消费","剁手","双十一","省钱","生活方式"],"copyrightStatus":"theory","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性消费风格分类，结果不代表任何心理评估或医学诊断，也不构成理财建议。","minorProtected":false},"source":{"theory":"消费行为类型框架，参考 Money Attitude Scale（Yamauchi & Templer, 1982）","sourceType":"theory","reference":"本测题为基于公开学术理论框架的原创自编，非任何量表的逐字题面"},"description":"从双十一、外卖、衣柜到工资到账那一刻，看清你的钱到底为什么花出去。五种消费人格，没有对错，只有花钱姿势不同。","instructions":"共 10 题，请按你最近半年的真实消费习惯作答，别按“我以后会改”的版本选。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"hoarder","name":"囤货党"},{"key":"minimal","name":"极简党"},{"key":"impulse","name":"冲动党"},{"key":"bargain","name":"薅羊毛党"},{"key":"quality","name":"品质党"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"双十一前一周，你在忙什么？","options":[{"key":"A","text":"把去年囤的纸巾和洗衣液清点一遍","score": se","name":"冲动党","summary":"心动到下单一气呵成，拆快递是你的高光时刻。","detail":"你对喜欢的东西反应极快，直播间一句“最后三单”就能让你完成从种草到付款的全过程。你也不缺后悔的素材——吊牌还在的衣服、积灰的小家电，都是冲动的纪念品。好在你的快乐很直接，也不容易陷入长期纠结。想稍微收一收的话，给自己加一条二十四小时规则：非必需品先放购物车一天，第二天还想要再买。","traits":["行动力强","容易被种草","快乐来得快"],"growthTip":"给非必需品设一个冷静期，多数冲动会在第二天早上自动消退。","shareCard":"我是冲动党，手比脑子先付款。你呢？","adSlot":"info_feed"},{"key":"bargain","categoryKey":"bargain","name":"薅羊毛党","summary":"没有你找不到的券，省到就是赚到。","detail":"满减规则、叠加券、返利链接、历史低价曲线，这些在你眼里都是有解的数学题。你享受的不只是省下的钱，更是那种“系统被我摸透了”的成就感，朋友买大件前也常来问你。要留意的是时间和注意力的隐性成本：为了省二十块研究两小时，其实是另一笔账。把薅羊毛限定在大额和高频品类，性价比会高得多。","traits":["比价达人","规则通","省钱有成就感"],"growthTip":"只在金额超过阈值时启动比价模式，小钱不值得耗掉一小时。","shareCard":"我是薅羊毛党，没有我找不到的券。你呢？","adSlot":"result_page"},{"key":"quality","categoryKey":"quality","name":"品质党","summary":"宁可少买一件，也不愿将就一次。","detail":"你相信长期使用的东西值得多花钱，也更看重材质、做工和实际体验，而不是标签上的折扣力度。你的东西数量未必多，但每一件都顺手耐用，算下来单次使用成本反而更低。唯一要防的是把“贵”和“好”简单划等号——价签不是质量的唯一证据，多看真实评价和自己的使用习惯，才不会为好概念买单。","traits":["看重质感","长期主义","不为折扣动心"],"growthTip":"下单前问一句“我会用多久”，答案往往比价格更能决定值不值。","shareCard":"我是品质党，宁可少买一件也不将就。你呢？","adSlot":"share_card"}]},"25":{"id":25,"title":"旅行人格鉴定","shortName":"旅行人格","category":"生活","tags":["旅行","小长假","特种兵","打卡","生活方式"],"copyrightStatus":"internet_native","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性旅行风格分类，结果不代表任何心理评估或医学诊断。","minorProtected":false},"source":{"theory":"无权威来源，互联网原生趣味测评","sourceType":"internet_native","reference":"本测题为原创自编"},"description":"同样是三天小长假，有人日均两万步打卡八个点，有人在酒店阳台坐到日落。测测你是哪种旅行人格，下次出门前先把队友选对。","instructions":"共 10 题，请按你最近几次出行的真实做法作答，别按你最想晒的那版选。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"soldier","name":"特种兵"},{"key":"resort","name":"度假派"},{"key":"hotel","name":"躺酒店"},{"key":"foodie","name":"逛吃党"},{"key":"wander","name":"随缘漫游"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"三天小长假，你的行程大概长这样？","options":[{"key":"A","text":"打卡八个点，日均两万步起步","score":{"cat":"soldier","points":1}},{"key":"B","text":"找个海边或山里，行程只写两行","score":{"cat":"r at":"hotel","points":1}},{"key":"D","text":"淋着走，反正衣服会干","score":{"cat":"wander","points":1}}]},{"no":8,"stem":"回程前的最后一小时，你在？","options":[{"key":"A","text":"再冲一个没去成的点","score":{"cat":"soldier","points":1}},{"key":"B","text":"在酒店附近慢慢晃一圈","score":{"cat":"resort","points":1}},{"key":"C","text":"打包一份当地特产带上路","score":{"cat":"foodie","points":1}},{"key":"D","text":"找个地方坐着，等时间到","score":{"cat":"wander","points":1}}]},{"no":9,"stem":"你心里的旅行 KPI 是？","options":[{"key":"A","text":"去过多少地方","score":{"cat":"soldier","points":1}},{"key":"B","text":"睡得有多好","score":{"cat":"hotel","points":1}},{"key":"C","text":"吃过几家本地馆子","score":{"cat":"foodie","points":1}},{"key":"D","text":"有没有遇到计划外的惊喜","score":{"cat":"wander","points":1}}]},{"no":10,"stem":"别人问“那个地方好玩吗”，你会怎么答？","options":[{"key":"A","text":"挺舒服的，节奏很慢","score":{"cat":"resort","points":1}},{"key":"B","text":"没怎么出门，但酒店很棒","score":{"cat":"hotel","points":1}},{"key":"C","text":"好吃，其他没太注意","score":{"cat":"foodie","points":1}},{"key":"D","text":"说不上来，反正挺喜欢的","score":{"cat":"wander","points":1}}]}],"results":[{"key":"soldier","categoryKey":"soldier","name":"特种兵","summary":"两天逛完一座城，微信步数常年霸榜。","detail":"你的行程表精确到分钟，早上六点在山上看日出，中午已经出现在城市另一头的小馆子。你说服自己的理由也很合理：来都来了。这种密度确实让你在有限假期里装下了最多的内容，代价是回来那两天基本报废。下次可以试着每天只排一件必做的事，其余留白——真正记住的往往不是第十个景点，而是某个不赶时间的下午。","traits":["执行力爆表","攻略大师","体力惊人"],"growthTip":"每天留两小时空白，旅行的记忆点通常长在计划之外。","shareCard":"我是特种兵型旅行人格，两天逛完一座城。你呢？","adSlot":"result_page"},{"key":"resort","categoryKey":"resort","name":"度假派","summary":"旅行的意义是换个地方放松，不是换个地方赶路。","detail":"你出门是为了让身体和脑子同时休假，所以行程永远只写两行：住哪儿、去哪个方向待着。你擅长挑一个舒服的环境，然后把自己交出去——海风、山雾、一杯能喝一下午的东西，就够回本。偶尔也会被同伴拖去赶行程，回来后更加确信自己是对的。保持这个节奏，只是别把行程排得太空，留一件当地特色体验当记忆锚点。","traits":["会放松","节奏舒缓","环境敏感"],"growthTip":"安排一件只在这个地方能做的事，慢下来也不至于什么都没留下。","shareCard":"我是度假派，旅行就是换个地方放松。你呢？","adSlot":"share_card"},{"key":"hotel","categoryKey":"hotel","name":"躺酒店","summary":"出差与度假的共同点：先看床垫和浴袍。","detail":"你深谙一个道理：旅行体验的一半由住的地方决定。于是别人在看攻略，你在研究房型朝向、泳池时段和早餐供应到几点。你把酒店本身当成目的地，睡到自然醒、泡个澡、在阳台发呆，也算认真度过了这一天。这没什么不好，唯一建议是把早餐时间和退房时间设成闹钟，别让最贵的部分被睡过去。","traits":["重视睡眠","会挑住宿","享受独处"],"growthTip":"把早餐和泳池写进行程，让最贵的部分真正被用上。","shareCard":"我是躺酒店型，酒店就是我的目的地。你呢？","adSlot":"info_feed"},{"key":"foodie","categoryKey":"foodie","name":"逛吃党","summary":"景点是顺路的，馆子才是导航终点。","detail":"你的地图收藏夹里全是店名，排队一小时也愿意，因为那口东西别处吃不到。你相信一座城市的性格藏在它的小吃街里，也确实通过食物记住了不少地方。你的旅行永远不缺高光时刻，唯一的遗憾往往是照片全是菜。下次在两家馆子之间随便拐进一条巷子走走，可能会撞见比攻略更有趣的风景。","traits":["美食雷达","愿意排队","接地气"],"growthTip":"在两家店之间留一段步行路线，风景通常就在路上。","shareCard":"我是逛吃党，景点顺路，馆子才是终点。你呢？","adSlot":"result_page"},{"key":"wander","categoryKey":"wander","name":"随缘漫游","summary":"没有攻略，最好的部分是撞上的。","detail":"你几乎不做计划，落地后跟着直觉走：哪条路好看走哪条，哪家店顺眼就进去。你错过了不少必打卡点，却也遇到过攻略上永远不会写的场景——一场街头演出、一家没有招牌的小店。这种旅行方式自由度极高，代价是偶尔会踩空。给自己留一个极简框架：定住宿区域和一个大致方向，剩下的继续交给运气。","traits":["随机应变","心态松弛","不执着打卡"],"growthTip":"只需要定好住宿区域和大方向，其他继续交给直觉。","shareCard":"我是随缘漫游型，最好的部分都是撞上的。你呢？","adSlot":"share_card"}]},"26":{"id":26,"title":"你的睡眠类型","shortName":"睡眠类型","category":"健康趣味（非诊断）","tags":["睡眠","作息","晨型","夜型","趣味"],"copyrightStatus":"public_domain","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"娱乐性质，不代表专业心理评估，也不是任何睡眠状况的筛查或诊断工具，结果仅供了解日常作息偏好。","minorProtected":false},"source":{"theory":"晨夜型问卷 rMEQ（reduced Morningness-Eveningness Questionnaire，Adan 等）的简化娱乐改编","sourceType":"public_domain","reference":"本测题为基于公开学术量表结构的原创自编改编，非官方逐字题面"},"description":"有人天亮就精神，有人凌晨才上线。这是一份纯娱乐的作息偏好测试，看看你更接近云雀、猫头鹰，还是介于两者之间。它只描述你的日常节奏，不评价睡眠质量，也不作任何判断。","instructions":"共 10 题，按没有闹钟和工作安排时的自然状态作答。本测试仅供娱乐，不构成任何评估或建议。","estimatedMinutes":2,"questionCount":10,"scoringModel":"category","categories":[{"key":"lark","name":"晨型云雀"},{"key":"owl","name":"夜型猫头鹰"},{"key":"middle","name":"中间型"},{"key":"broken","name":"碎片化选手"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"没有任何安排的日子，你自然醒的时间大概是？","options":[{"key":"A","text":"六点左右，天一亮就醒","score":{"cat":"lark","points":1}},{"key":"B","text":"十点以后，越晚越香","score":{"cat":"owl","points":1}},{"key":"C","text":"八点多，正常人的时间","score":{"cat":"middle","points":1}},{"key":"D","text":"不确定，中间醒过好几次 虑等级：轻微焦虑，心动过但钱包还在。你呢？","adSlot":"share_card"},{"key":"hoarder","name":"中度囤课","summary":"课没听完几门，但买课的手速已进入专业级。","detail":"你的收藏夹是一座正在扩建的图书馆，网盘里躺着好几个 G 的未来。你很清楚哪些知识重要，也很舍得为自我提升花钱，只是执行常常输给新鲜感——每次都觉得新课更有意思，于是旧的就先放着。好消息是你不缺动力，缺的是筛选：把待学清单砍到三门，你会发现焦虑立刻少一半。","traits":["囤课达人","舍得投入","新鲜感驱动"],"growthTip":"先清完一门再开下一门，让「学完」的爽感替代「买到」的爽感。","shareCard":"知识焦虑等级：中度囤课，买课的手速比看课快十倍。你呢？","adSlot":"info_feed"},{"key":"severe","name":"重度焦虑","summary":"一天不学点新东西，就像手机没充上电。","detail":"你对「被落下」这件事格外敏感，别人的成长动态会直接触发你的补课开关。通勤听、睡前看、周末赶，学习已经从兴趣变成了任务。这份紧迫感确实让你积累得比同龄人快，但当充电变成还债，知识就不再是养分而是负担。你需要的不是再多一门课，而是允许自己有一段什么都不学的空白时间。","traits":["高度自律","危机感强","停不下来"],"growthTip":"把「今天必须学点什么」换成「这周最重要的是什么」，给大脑留白。","shareCard":"知识焦虑等级：重度焦虑，一天不充电就浑身难受。你呢？","adSlot":"result_page"}]},"32":{"id":32,"title":"社恐社牛程度测试（娱乐版）","shortName":"社恐社牛程度","category":"社交","tags":["社恐","社牛","社交","电量","聚会"],"copyrightStatus":"public_domain","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"娱乐性质，不代表专业心理评估。本测试仅测量日常社交中的趣味偏好与习惯，不涉及任何临床判断。","minorProtected":false},"source":{"theory":"概念参考 SAD 社交回避及苦恼量表（Watson & Friend, 1969，公共领域），仅借鉴「社交回避与主观苦恼」的日常化概念；本测题为自编娱乐版，不采用任何临床量表题面。","sourceType":"public_domain","reference":"本测题为原创自编娱乐版，仅作趣味社交风格分类，非量表施测。"},"description":"从电梯遇到半熟同事、陌生电话、团建上台到聚会散场，测一测你的社交电量到底是多少格。社恐和社牛只是充电方式不同，没有高低之分。","instructions":"共 10 题，请按日常真实反应作答。选最像你的那个，别选你羡慕的那个。","estimatedMinutes":2,"questionCount":10,"scoringModel":"threshold","bands":[{"key":"deep_shy","name":"深度社恐","min":0,"max":6},{"key":"light_shy","name":"轻度社恐","min":7,"max":12},{"key":"normal","name":"社交普通人","min":13,"max":18},{"key":"social_bull","name":"社牛","min":19,"max":24},{"key":"social_king","name":"社霸","min":25,"max":30}],"tieBreak":"总分按 bands 区间直接命中；若分数落在区间边界，取更高一档。","questions":[{"no":1,"stem":"电梯里遇到半熟的同事，你会？","options":[{"key":"A","text":"立刻低头，认真研究手机","score":{"points":0}},{"key":"B","text":"点头微笑，然后一起沉默","score":{"points":1}},{"key":"C","text":"打个招呼，聊两句天气","score":{"points":2}},{"key":"D","text":"主动开话题，顺便约个午饭","score":{"points":3}}]},{"no":2,"stem ore":{"points":2}},{"key":"D","text":"问完还能顺便唠两句","score":{"points":3}}]},{"no":10,"stem":"一场聚会的尾声，你通常是？","options":[{"key":"A","text":"第一个说要走的人","score":{"points":0}},{"key":"B","text":"已经偷偷看了八次手机时间","score":{"points":1}},{"key":"C","text":"跟着大部队一起散场","score":{"points":2}},{"key":"D","text":"张罗下一场的那个人","score":{"points":3}}]}],"results":[{"key":"deep_shy","name":"深度社恐","summary":"社交电量常年个位数，充电方式是独处。","detail":"你的人生理想状态大概是：没人 @ 我、没人打电话、外卖放门口。电梯里遇到熟人能让你瞬间进入省电模式，团建上台则是一次重大电量事故。但这不代表你不擅长社交，只是你的电量恢复靠独处而非聚会。你往往观察细致、说话有分量，真正熟起来之后反而是很可靠的那类朋友。给自己留够独处时间，比强迫社交有用得多。","traits":["独处充电","观察敏锐","低耗社交"],"growthTip":"不必勉强自己变外向，挑一两个舒服的小场合就够；需要开口时，提前想好第一句话会轻松很多。","shareCard":"社恐社牛程度：深度社恐，外卖请放门口谢谢。你呢？","adSlot":"result_page"},{"key":"light_shy","name":"轻度社恐","summary":"慢热型选手，熟了之后判若两人。","detail":"你在陌生场合会先安静观察，等气氛熟悉了才慢慢打开。第一次见面你可能话不多，但一旦进入安全区，幽默感和表达欲都会上线。你的社交不是能力问题，而是启动成本偏高。别人以为你高冷，其实你只是在做热身。好消息是这种慢热让你交到的朋友往往更长久，因为你不会随便把人放进核心圈。","traits":["慢热","熟悉后话多","边界感强"],"growthTip":"给自己一个固定的开场句式，比如一句夸奖或一个提问，能大幅降低启动成本。","shareCard":"社恐社牛程度：轻度社恐，熟了之后我自己都害怕。你呢？","adSlot":"share_card"},{"key":"normal","name":"社交普通人","summary":"该聊聊该静静，社交电量基本够用。","detail":"你是人群里最稳定也最不容易被注意到的那一档：能打招呼、能接话、能在聚会里活下来，但也不会主动抢话筒。你的社交能耗大体平衡，工作沟通顺畅，私下也有自己的小世界。你不太会被社交场合难住，也懂得在累了的时候先撤。这种刚刚好的状态其实是最省力的，不必羡慕任何一种极端。","traits":["能耗平衡","沟通顺畅","进退自如"],"growthTip":"保持现状就好，偶尔主动约一次人，关系会比想象中更近一点。","shareCard":"社恐社牛程度：社交普通人，能聊能撤，电量刚刚好。你呢？","adSlot":"info_feed"},{"key":"social_bull","name":"社牛","summary":"社交是充电不是耗电，越聊越精神。","detail":"你在人群里反而更放松，陌生场合对你来说是新的副本而不是考验。你能跟外卖小哥聊天气，能在团建上救场，也能把冷掉的气氛重新点着。你的能量很有感染力，常常是朋友聚会的天然黏合剂。唯一的小提醒是：不是所有人都靠社交充电，记得给身边的省电型朋友留一条安静的退路。","traits":["自来熟","气氛发动机","能量外放"],"growthTip":"热情很好，也记得观察对方的回话长度，对方想撤时别硬留。","shareCard":"社恐社牛程度：社牛，陌生场合对我来说是新副本。你呢？","adSlot":"result_page"},{"key":"social_king","name":"社霸","summary":"场子由你开场，也由你安排下一场。","detail":"你不是参加聚会，你是主持聚会。陌生人到你手里三句话就能变成联系人，冷场在你面前不存在。你享受连接人的过程，也确实擅长让每个人都参与进来。你的存在让群体运转得更顺，但要记得：社交是双向的，留出倾听和沉默的空间，别人会更愿意靠近你，而不只是被你带着走。","traits":["场控能力","人脉枢纽","感染力爆表"],"growthTip":"偶尔把话筒让出去，让安静 "categoryKey":"healing","name":"治愈轻音乐","summary":"温柔有韧性，是很多人心里的背景板。","detail":"你的配乐是干净的钢琴和木吉他，不抢戏但一直都在。你习惯照顾别人的情绪，也擅长把紧绷的氛围轻轻抚平。你不是没有脾气，只是更愿意用柔和的方式解决问题。这种温柔很有力量，它让身边的人愿意靠近你、信任你。要记得的是：温柔不该只对外，给自己留一份同样的耐心，别把所有委屈都调成静音。","traits":["温柔稳定","共情力强","不抢风头"],"growthTip":"把照顾别人的那份耐心分一半给自己，不想做的事可以直接说不。","shareCard":"我的人生 BGM：治愈轻音乐，不抢戏但一直都在。你呢？","adSlot":"result_page"},{"key":"edm","categoryKey":"edm","name":"电子迷幻","summary":"活在未来感里，脑内自带灯光和延迟。","detail":"你的 BGM 有清晰的节拍和层叠的音墙，理性中带着迷幻。你很容易进入心流，一旦开始做事就能长时间沉浸其中。你对新鲜事物敏感，喜欢探索各种可能性，也乐于接受不同的生活方式。你享受孤独创作的状态，但偶尔也需要提醒自己：从音墙里探出头来，看看现实里等着你的人。","traits":["沉浸专注","好奇心强","未来感足"],"growthTip":"心流很宝贵，记得设个提醒，从沉浸里抬头看看现实。","shareCard":"我的人生 BGM：电子迷幻，脑内自带灯光和混响。你呢？","adSlot":"share_card"}]},"35":{"id":35,"title":"你的幸运守护兽是哪一只","shortName":"幸运守护兽","category":"玄学","tags":["玄学","守护兽","瑞兽","运势","脑洞"],"copyrightStatus":"internet_native","entertainment":true,"compliance":{"nonDiagnostic":true,"note":"本测试为娱乐性趣味分类，取材于传统瑞兽形象的文化意象，不代表任何心理评估、命理推算或医学诊断。","minorProtected":false},"source":{"theory":"无权威来源，互联网原生趣味测评","sourceType":"internet_native","reference":"本测题为原创自编"},"description":"白虎、青龙、朱雀、玄武、麒麟、白泽，六只瑞兽各守一种气质。从你面对麻烦、选择朋友到发朋友圈的习惯，看看哪一只正在默默给你撑腰。纯属娱乐，图个好彩头。","instructions":"共 12 题，凭第一直觉选，别纠结哪只兽更厉害。","estimatedMinutes":3,"questionCount":12,"scoringModel":"category","categories":[{"key":"white_tiger","name":"白虎"},{"key":"azure_dragon","name":"青龙"},{"key":"vermilion","name":"朱雀"},{"key":"black_tortoise","name":"玄武"},{"key":"qilin","name":"麒麟"},{"key":"baize","name":"白泽"}],"tieBreak":"分类分数平票时按 results 数组顺序优先。","questions":[{"no":1,"stem":"朋友临时拉你去一个完全没计划的局，你？","options":[{"key":"A","text":"先弄清楚这是什么局、都有谁，再决定去不去","score":{"cat":"azure_dragon","points":1}},{"key":"B","text":"问清时间地点，能排进日程就去","score":{"cat":"black_tortoise","points":1}},{"key":"C","text":"换身像样的衣服再出门，场合不能太随便","score":{"cat":"qilin","points":1}},{"key":"D","text":"去，正好见见没见过的人","score":{"cat":"baize","points":1}}]},{"no":2,"stem":"微信群里突然吵起来了，你？","options":[{"key":"A","text":"先看明白争的是什么，再决定要不要开口","score":{"cat":"az
